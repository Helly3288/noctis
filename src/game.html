    ok:{hint:`Сканер заработает. Инспектор запомнит тебя.`, eff:{rel:{mom:1}, flag:'clerkKnowsLeo'}, res:[
      `— Можно? — Ты берёшь сканер. Антенна считывателя отошла от платы, классика. Ты подгибаешь контакт ногтем.`,
      `Хольт подносит чип матери ещё раз. Зелёный. «Данные подтверждены».`,
      `Хольт смотрит на сканер, потом на тебя, с выражением человека, увидевшего чудо в пятницу вечером. — Молодой человек. Вам бы к нам в техотдел. Как вас записать? — Лео Вельт. — Он записывает. Мать за его спиной закрывает глаза.`,
    ]},
    fail:{hint:`Не справишься`, eff:{flag:'inPersonCheck'}, res:[`Ты крутишь сканер, но он так и не читает чип. Хольт забирает его обратно. — Очная сверка, третье октября, девять утра. Всех касается.`]},
    next:'c2'},
  {t:`Заболтать инспектора, пока мама ищет «бумажную копию».`, check:{stat:'charm', v:4},
    ok:{hint:`Инспектор махнёт рукой`, eff:{stat:{charm:1}, why:`Разговорил инспектора, которому было не до разговоров.`, rel:{mom:1}, flag:'visualCheck'}, res:[
      `Ты спрашиваешь Хольта, сколько адресов ему осталось. Он отвечает. Ты сочувствуешь. Через пять минут ты знаешь всё про его начальницу, его язву и систему «Учёт-4», которая «ложится, если на неё посмотреть».`,
      `Хольт ставит в планшете галочку «сверено визуально». — Хорошие вы люди, — говорит он на прощание. — Редкость.`,
    ]},
    fail:{hint:`Инспектору не до разговоров`, eff:{flag:'inPersonCheck'}, res:[`Ты пытаешься завязать разговор, но Хольт отвечает односложно и смотрит на часы. — Молодой человек, у меня сорок адресов. Очная сверка, третье октября, девять утра. Всех касается.`]},
    next:'c2'},
  {t:`Подсказать инспектору ручной ввод номера.`, check:{stat:'mind', v:6},
    ok:{hint:`Сработает, но в журнале останется отметка`, eff:{flag:'manualEntry'}, res:[
      `— Если сканер не видит старый формат, номер можно вбить вручную, — говоришь ты. — В «Учёт-4» есть такой режим, у нас в университете та же версия.`,
      `Хольт смотрит с подозрением, потом с облегчением и вбивает номер. Зелёный. — Ручной ввод, — бормочет он. — Отметится в журнале. Ну и ладно, у меня полрайона на ручном вводе.`,
    ]},
    fail:{hint:`Не вспомнишь, как это делается`, eff:{flag:'inPersonCheck'}, res:[`Ты пытаешься вспомнить меню «Учёт-4», но путаешься. Хольт теряет терпение. — Очная сверка, третье октября. Всех касается.`]},
    next:'c2'},
  {t:`Постучать по сканеру, как отец по телевизору.`, hint:`Отец всегда так делает. Быстро, без имён и без отметок в журнале.`, eff:{strange:1, rel:{mom:1}, flag:'luckyScanner'}, res:[
    `— Можно? — Ты берёшь у Хольта сканер и стучишь им о ладонь, два раза, по-отцовски. Хольт открывает рот, чтобы возмутиться, но сканер уже пищит. Зелёный. «Данные подтверждены».`,
    `— Вот что значит молодые руки, — говорит Хольт без всякого интереса, ставит галочку и уходит к следующему адресу. Имени твоего он не спрашивает.`,
    `Мать смотрит на сканер в руках уходящего инспектора. Потом на тебя. Долго.`,
  ], next:'c2'},
  {t:`Не вмешиваться. Это мамино дело.`, hint:`Мама справится сама. Как-нибудь.`, eff:{flag:'inPersonCheck'}, res:[
    `Ты молчишь. Мать улыбается Хольту и говорит, что чип, наверное, повредился в стирке. Хольт кивает с видом человека, который слышал это сто раз.`,
    `— Очная сверка, третье октября, девять утра. Всех касается.`,
  ], next:'c2'},
]},

c2:{scene:'s7', text:[
  `Когда за инспектором опускается ставня, мать садится на ступеньку лестницы и долго молчит.`,
  {when:s=>s.flags.inPersonCheck, text:`— Третье октября, — говорит она наконец. — Надо сказать отцу.`},
  {when:s=>s.flags.clerkKnowsLeo, text:`— Зачем ты назвал ему своё имя? — спрашивает она тихо. — Он же спросил. — Да, — кивает она. — Он спросил.`},
  {when:s=>s.flags.luckyScanner, text:`— Как ты это сделал? — спрашивает она. — Постучал. Как папа. — Как папа, — повторяет она и почему-то отводит глаза.`},
  {when:s=>s.flags.manualEntry || s.flags.visualCheck, text:`— Спасибо, — говорит она. — Ты даже не представляешь, как ты нас… как ты меня выручил.`},
], choices:[
  {t:`Спросить, почему она так испугалась.`, hint:s=>(s.rel.mom||0)>=3 ? `Вы близки. Мама не станет отмахиваться.` : `Мама может сказать правду. А может и нет.`, eff:{flag:'askedMom'}, res:s=>(s.rel.mom||0)>=3 ? [
    `— Мам. Почему ты так испугалась? Это же просто сверка.`,
    `Мать долго молчит. Потом берёт твою руку в свои. — Потому что наши документы не такие чистые, как хотелось бы, — говорит она тихо. — Не из-за чего-то плохого, Лео. Из-за того, что мы когда-то сделали, чтобы тебя защитить.`,
    `— Больше не спрашивай пока. Папа расскажет. Он должен сам. Я ему обещала.`,
  ] : [
    `— Мам. Почему ты так испугалась? Это же просто сверка.`,
    `Мать смотрит на тебя, и на секунду тебе кажется, что сейчас она скажет что-то важное. Потом она улыбается. — Потому что очная сверка — это день без зарплаты и три часа в очереди с людьми, которые кашляют. — Она встаёт и целует тебя в макушку. — Не бери в голову.`,
  ], next:'mon9'},
  {t:`Сесть рядом и обнять её.`, eff:{rel:{mom:1}}, res:[
    `Ты садишься рядом. Мать кладёт голову тебе на плечо, как будто это ты взрослый, а она ребёнок.`,
    `Так вы сидите, пока наверху не просыпается Ника и не начинает на весь дом требовать завтрак.`,
  ], next:'mon9'},
  {t:`Пошутить про инспектора.`, eff:{flag:'jokedClerk'}, res:[
    `— Зато у меня теперь есть предложение работы. Техотдел управы. Буду чинить сканеры и ненавидеть людей.`,
    `Мать смеётся, по-настоящему, впервые за утро. — Только не это. Одного человека, который всё чинит, этой семье хватает.`,
  ], next:'mon9'},
]},

/* ================= ОКТЯБРЬ ================= */

/* ---------- СЦЕНА 8. ОЧНАЯ СВЕРКА ---------- */
o1:{scene:'s8', head:true, text:[
  `Октябрь начинается с письма. Не электронного, а настоящего, на серой казённой бумаге: курьер управы заставляет расписаться в получении.`,
  `«В рамках программы „Чистый квартал“ все совершеннолетние жители адреса обязаны 3 октября явиться в управу Южных кварталов для очной регистрации. В целях ускорения процедуры доступна добровольная биометрическая сверка (пилотный проект, реализуется при поддержке корпорации „Церебра“)».`,
  `Отец читает письмо дважды. На слове «Церебра» кружка с кофе замирает на полпути ко рту и так и не доезжает.`,
  {when:s=>s.flags.inPersonCheck || s.flags.manualEntry, text:`— Ну вот, — тихо говорит мать. — Дождались.`},
  {when:s=>!(s.flags.inPersonCheck || s.flags.manualEntry), text:`— Нас же проверили в сентябре, — говорит мать. — Тебя проверили, — поправляет отец. — А нас с Лео, выходит, нет.`},
], choices:[
  {t:`Забрать у отца письмо и перечитать.`, res:[`Ты перечитываешь. «Добровольная». Слово стоит в тексте так, будто его вставили в последний момент.`], next:'o1b'},
  {t:`Пошутить про «Чистый квартал».`, res:[`— «Чистый квартал». Нас что, постирают? — Ника прыскает в чашку. Отец не улыбается.`], next:'o1b'},
  {t:`Молча доесть завтрак.`, res:[`Ты доедаешь молча. Мать забирает у отца письмо и кладёт в ящик лицом вниз.`], next:'o1b'},
]},

o1b:{scene:'s8', text:[
  `Третьего октября в девять утра вы вчетвером стоите в зале управы: Нике шестнадцати нет, но оставить её дома одну отец отказался наотрез.`,
  `Зал похож на станцию монорельса, из которой откачали всю радость. Табло электронной очереди, ряды пластиковых стульев, открыты три окна из двенадцати. На табло горит «Услуга временно недоступна». В углу кто-то спит, обняв папку с документами.`,
  `В центре зала стоит белая кабина, чистая и тихая, как операционная. Над ней логотип Церебры и надпись: «Биометрия. Три минуты — и вы свободны».`,
  `К вам подходит консультант в жёлтом жилете. — Через биометрию без очереди, — говорит он заученно. — Добровольно. А в окно у вас номер двести четырнадцатый.`,
  {tag:'Рассудок', when:s=>s.stats.mind>=6, text:`Отец не смотрит на кабину. Он смотрит на выход. Так смотрят люди, которые прикидывают, успеют ли добежать.`},
], choices:[
  {t:`Предложить пройти биометрию: три минуты, и все свободны.`, hint:`Быстро. Все устали, ещё не начав.`, eff:{flag:'dadStopped'}, res:[
    `— Пап, давай через кабину. Три минуты же.`,
    `Отец берёт тебя за локоть. Не сильно, но так, что ты замолкаешь на полуслове. — Нет, — говорит он. Спокойно. Слишком спокойно. — Мы постоим. Мы никуда не торопимся.`,
    `Ника открывает рот, смотрит на отца и закрывает. Мать делает вид, что изучает табло.`,
  ], next:'o2'},
  {t:`Спросить консультанта, что будет, если отказаться.`, check:{stat:'mind', v:6},
    ok:{hint:`Выяснишь правила игры`, eff:{flag:'knowsRules'}, res:[
      `Консультант вздыхает, но отвечает. При отказе — окно и ручная проверка. А если чип старого формата не читается, нужна «справка из архива о выдаче документа».`,
      `— А если справки нет? — Тогда биометрия, — улыбается он. — Или пункт четыре-два. Но его никто не читает. Он вон там, на стенде.`,
    ]},
    fail:{hint:`Консультант отмахнётся`, res:[`— Всё написано на стенде, — отвечает консультант и уходит к следующим.`]},
    next:'o2'},
  {t:`Молча взять талон и сесть ждать.`, res:[
    `Ты берёшь талон. Двести четырнадцать. На табло горит сто двадцать шесть. Ника стонет так, будто её приговорили.`,
  ], next:'o2'},
]},

o2:{scene:'s8', text:[
  `Через четыре часа, два кофейных автомата и одну потерянную Никой веру в человечество на табло загорается ваш номер. Окно три.`,
  `За стеклом женщина с причёской, которая пережила не одну реформу. Табличка: «Специалист Варга». Она по очереди подносит чипы к считывателю.`,
  {when:s=>s.flags.visualCheck || s.flags.luckyScanner || s.flags.clerkKnowsLeo, text:`Чип матери загорается зелёным: сентябрьская сверка засчитана. Чипы отца и твой — красным.`},
  {when:s=>!(s.flags.visualCheck || s.flags.luckyScanner || s.flags.clerkKnowsLeo), text:`Красный. Красный. Красный.`},
  `— Старый формат, — говорит Варга без выражения. — Либо справка из архива о выдаче, либо биометрия. Архив, — добавляет она почти с сочувствием, — отвечает за сорок пять рабочих дней.`,
  {when:s=>s.flags.manualEntry, text:`Она смотрит в монитор и хмурится. — И ещё: в сентябре у вас был ручной ввод. Его тоже надо подтвердить.`},
  `Отец молчит. Мать улыбается той самой улыбкой. За спиной мягко гудит вентиляция белой кабины.`,
], choices:SHARED_CHOICES.O2},

o2x:{scene:'s8', text:[
  `Варга ждёт, постукивая ручкой по стеклу. Очередь за вашей спиной начинает недовольно гудеть.`,
], choices:SHARED_CHOICES.O2},

/* ---------- ВЕЧЕР ПОСЛЕ УПРАВЫ ---------- */
o3:{scene:'s8h', head:true, text:[
  `Домой вы возвращаетесь затемно. Ника спит в монорельсе на плече у матери. Отец всю дорогу молчит.`,
  {when:s=>s.flags.witnesses && ((s.rel.street||0)>=1 || s.flags.rafaFriend || s.flags.returnedCoins), text:`Рафа на прощание сунул вам пакет лапши «за беспокойство». Он так и остался у отца в руках нетронутым.`},
  `Вечером ты находишь отца в мастерской. Он ничего не чинит, просто сидит над разобранным дроном.`,
  {when:s=>s.flags.dadStopped, text:`На твоём локте проступают четыре синих пятна от его пальцев.`},
  {when:s=>s.flags.readerFixed, text:`— Ловко ты с тем считывателем, — говорит он, не оборачиваясь. И больше ничего.`},
  `— Церебра, — говорит он вдруг. — Раньше они делали импланты. Теперь делают управы. — Он качает головой. — Не заходи в их кабины, Лео. Никогда. Обещай.`,
], choices:[
  {t:`Пообещать.`, eff:{rel:{dad:1}, flag:'promisedDad'}, res:[
    `— Обещаю.`,
    `Отец кивает, будто ты только что снял с него что-то тяжёлое. — Иди спать. Завтра пары.`,
  ], next:s=>s.flags.teoJob ? 'q1a' : 'q1b'},
  {t:`Спросить почему.`, hint:`Отец может сказать правду. А может и нет.`, eff:{flag:'dadCerebraHint'}, res:[
    `— Почему?`,
    `— Потому что я знаю, как они устроены, — говорит отец. — Я когда-то чинил их оборудование. Давно. — Он замолкает, и ты понимаешь, что больше он ничего не скажет.`,
  ], next:s=>s.flags.teoJob ? 'q1a' : 'q1b'},
  {t:`Отшутиться: «Я их кофейных автоматов боюсь больше, чем кабин».`, res:[
    `Отец улыбается уголком рта. — Правильно боишься. Кофе у них тоже корпоративный.`,
    `Но обещания он с тебя так и не берёт. Кажется, он забыл. Или решил, что шутка — тоже ответ.`,
  ], next:s=>s.flags.teoJob ? 'q1a' : 'q1b'},
]},

/* ---------- СЦЕНА 9. УПАВШИЙ ДРОН ---------- */
q1a:{scene:'s9a', head:true, text:[
  `Вторник, семь вечера. Дома ты говоришь, что засиделся в университетской библиотеке. Отец кивает, не поднимая головы. Врать, оказывается, легко, если тебе не задают вопросов. От этого только хуже.`,
  `Тео встречает тебя так, будто ты работаешь у него десять лет: кивком и кружкой чая, от которого пахнет машинным маслом и бергамотом.`,
  `На прилавке лежит дрон. Белый, гладкий, без единой царапины, с логотипом Церебры на брюхе. Один винт погнут. — Упал, — говорит Тео. — Сам. С неба. Бывает. — Он подмигивает мёртвым глазом. — Надо снять маячок и почистить память. Груз внутри — наш.`,
  `В грузовом отсеке шесть одинаковых футляров размером с зажигалку. На каждом наклейка: «Модуль калибровки биометрического терминала. Получатель: управа Южных кварталов».`,
  `Ты вспоминаешь белую кабину в зале управы. И пальцы отца на своём локте.`,
], choices:SHARED_CHOICES.Q1},

q1b:{scene:'s9b', head:true, text:[
  `Тео приходит сам. В среду вечером, когда отец уехал к Барро, в рольставню стучат: два удара, пауза, два.`,
  `— Шёл мимо, — говорит Тео и ставит на верстак сумку. — Дай, думаю, загляну к крестнику. — Я вам не крестник. — Значит, будешь.`,
  {when:s=>s.flags.teoRefused, text:`— Ты отказался у меня работать, — продолжает он, — поэтому работа пришла к тебе сама. Заплачу как за обычный ремонт. Отцу скажешь: был клиент.`},
  {when:s=>!s.flags.teoRefused, text:`— Ты обещал подумать, — продолжает он. — Вот тебе и повод. Заплачу как за обычный ремонт. Отцу скажешь: был клиент.`},
  `В сумке дрон. Белый, гладкий, с логотипом Церебры на брюхе и погнутым винтом. — Упал, — говорит Тео. — Сам. Надо снять маячок и почистить память.`,
  `В грузовом отсеке шесть одинаковых футляров. «Модуль калибровки биометрического терминала. Получатель: управа Южных кварталов».`,
  `Ты вспоминаешь белую кабину в зале управы. И пальцы отца на своём локте.`,
], choices:SHARED_CHOICES.Q1},

q2a:{scene:'s9a', text:[
  `Домой ты возвращаешься в одиннадцатом часу. Отец не спит: сидит на кухне и держит в руках твою куртку, которую ты забыл на вешалке у двери. От рукава пахнет чаем Тео. Машинное масло и бергамот. Этот запах отец узнал бы из тысячи.`,
  `— Библиотека, — говорит он. — Да?`,
], choices:[
  {t:`Стоять на своём: «Библиотека. Там кафе, там такой чай».`, check:{stat:'charm', v:5},
    ok:{hint:`Отец поверит. Наверное.`, eff:{flag:'liedDad'}, res:[`Ты говоришь это так легко, что сам почти веришь. Отец долго смотрит на тебя, потом вешает куртку на место. — Библиотека так библиотека.`]},
    fail:{hint:`Врать ты не умеешь`, eff:{rel:{dad:-2}, flag:['liedDad','dadKnowsTeo']}, res:[
      `Ты начинаешь про кафе, и на слове «бергамот» у тебя краснеют уши. Отец молча кладёт куртку на стол.`,
      `— Не ври мне, — говорит он тихо. — Кому угодно, только не мне. — И уходит наверх. Дверь он не хлопает. Лучше бы хлопнул.`,
    ]},
    next:'dz1'},
  {t:`Сказать правду: ты работаешь у Тео.`, eff:{rel:{dad:-1}, flag:'dadKnowsTeo'}, res:[
    `— Я работаю у Тео. По вечерам. Он платит.`,
    `Отец долго молчит. — Он тебя учит? — Учит. — Чему? — Всякому. — Отец трёт лицо ладонями. — Ладно. Ты взрослый. Но если Бартал попросит сделать что-то, от чего тебе станет не по себе, ты придёшь ко мне. Сразу. Договорились?`,
  ], next:'dz1'},
  {t:`Сказать полуправду: был на рынке, передавал Тео привет.`, check:{stat:'mind', v:6},
    ok:{hint:`Отец отчасти поверит`, eff:{flag:'dadSuspectsTeo'}, res:[
      `— Заходил на рынок. Тео привет тебе передаёт.`,
      `— Тео не передаёт приветы, — говорит отец. — Тео передаёт деньги или неприятности. — Он вешает куртку на место. — Смотри, чтобы не второе.`,
    ]},
    fail:{hint:`Запутаешься`, eff:{rel:{dad:-1}, flag:'dadKnowsTeo'}, res:[`Ты начинаешь с рынка и путаешься на втором предложении. Отец вздыхает: — Ясно. Бартал.`]},
    next:'dz1'},
]},

q2b:{scene:'s9b', text:[
  `Отец возвращается, когда Тео уже застёгивает сумку. Они стоят друг напротив друга посреди мастерской, и ты впервые видишь отца таким: прямым, как натянутая струна.`,
  `— Бартал. — Томаш. — Уходи. — Ухожу, — легко соглашается Тео. — Крестника навещал. Руки у него, Томаш… Твои руки. Жаль, если пропадут.`,
  `Ставня опускается за ним. Отец поворачивается к тебе.`,
], choices:[
  {t:`Сказать правду: Тео приносил работу.`, eff:{rel:{dad:1}, flag:'dadKnowsTeo'}, res:[
    `— Он приносил дрон. Церебры. Просил снять маячок.`,
    `Отец закрывает глаза. — Конечно. Конечно, приносил. — Он садится на табурет. — Если он придёт ещё раз, не открывай. Не потому что я против. Потому что я знаю, чем у Тео заканчивается «поинтереснее».`,
  ], next:'dz1'},
  {t:`Прикрыть Тео: «Зашёл по старой дружбе».`, check:{stat:'charm', v:4},
    ok:{hint:`Отец сделает вид, что поверил`, eff:{rel:{teo:1}, flag:'coveredTeo'}, res:[`— По старой дружбе, — повторяет отец. — У нас с ним дружба старая, это правда. — Больше он ничего не спрашивает.`]},
    fail:{hint:`Отец не поверит`, eff:{rel:{dad:-1}, flag:['coveredTeo','dadSuspectsTeo']}, res:[`Отец смотрит на тебя, потом на верстак, где на пыли остался чистый прямоугольник от дрона. — Дружба, значит, — говорит он и уходит наверх.`]},
    next:'dz1'},
  {t:`Промолчать и уйти наверх.`, eff:{rel:{dad:-1}}, res:[
    `Ты поднимаешься по лестнице, чувствуя спиной его взгляд. Разговор не закончился. Он просто отложен.`,
  ], next:'dz1'},
]},

/* ---------- ДАНА. ОКТЯБРЬ ---------- */
dz1:{scene:'s9d', head:true, text:[
  {when:s=>s.flags.dadKnowsTeo || s.flags.dadSuspectsTeo, text:`После разговора с отцом про Тео дома несколько дней тихо и тяжело, как перед грозой.`},
  {when:s=>!(s.flags.dadKnowsTeo || s.flags.dadSuspectsTeo), text:`После вечера с дроном ты несколько дней ходишь с чувством, что у тебя за спиной кто-то стоит. Дома делаешь вид, что всё как обычно.`},
  `Поэтому, когда после контрольной по схемотехнике Дана говорит: «Лапша? Я угощаю. Отметим, что мы выжили», ты соглашаешься сразу.`,
  {when:s=>(s.rel.dana||0)<2, text:`Ты не сразу понимаешь, почему именно тебя: весь сентябрь она держалась на расстоянии.`},
  `Лапшичная «Пять специй» у ворот университета: шесть столов, запотевшие окна, телевизор с корпоративными новостями без звука. Дана ест быстро и аккуратно, как человек, привыкший есть на ходу.`,
  `Она рассказывает о себе легко и немного. Перевелась из Северного технического, потому что здесь стипендия больше. Живёт с младшим братом. — Мигель. Ему двенадцать, и он уверен, что умнее меня. Иногда прав.`,
  `А потом она спрашивает про тебя. Про твоих. Как давно вы в Южных, где раньше работал отец, почему именно мастерская. Вопросы лёгкие, между делом. Но их много.`,
], choices:[
  {t:`Честно: «Не знаю. Они не любят говорить о прошлом».`, hint:`Правда. Её немного, но она твоя.`, eff:{rel:{dana:1}, flag:'honestDana'}, res:[
    `— Не знаю, — говоришь ты. — Правда. Они не любят вспоминать, что было до меня. Я привык не спрашивать.`,
    `Дана перестаёт жевать. — У всех свои шкафы, — говорит она тихо и зачем-то отводит глаза. Потом отдаёт тебе свои креветки, и дальше вы спорите о том, какая лапша лучше, до самого закрытия.`,
    `У станции вы расходитесь: ей на север, тебе на юг. Она машет тебе из-за стекла вагона.`,
  ], next:'z1'},
  {t:`Перевести разговор на Мигеля.`, check:{stat:'charm', v:4, bonus:[{when:s=>s.flags.fixedWithDana, why:'вы вместе чинили стенд, ей с тобой легко'}]},
    ok:{hint:`Она охотно расскажет о брате`, eff:{rel:{dana:1}, flag:'metMiguelTalk'}, res:[
      `— Меня учил тостер, там скучная история. Лучше расскажи про гения, который умнее тебя.`,
      `Дана смеётся и рассказывает: Мигель собирает модели кораблей, ненавидит кашу и всех обыгрывает в «Гонки». Про то, что он болеет, она говорит одной фразой: — У него приступы. Сейчас лучше. Хорошая клиника. — И сразу меняет тему.`,
      `У станции вы расходитесь: ей на север, тебе на юг. Ты уже знаешь о её брате больше, чем она о твоём отце. Кажется, это честный обмен.`,
    ]},
    fail:{hint:`Она заметит, что ты увиливаешь`, res:[
      `— Меня учил тостер, — говоришь ты, и Дана улыбается той улыбкой, которой улыбаются, когда всё поняли. — Ладно, тайный мастер. Не хочешь — не говори.`,
      `Остаток ужина вы говорите о преподавателях. У станции вы расходитесь, и тебе почему-то неловко, будто ты что-то у неё взял и не вернул.`,
    ]},
    next:'z1'},
  {t:`Соврать, что отец всю жизнь чинил технику и учился по книжкам.`, hint:`Врать ты не мастер.`, check:{stat:'charm', v:5},
    ok:{hint:`Прозвучит убедительно`, eff:{flag:'liedDana'}, res:[
      `— Отец всю жизнь в мастерской. Самоучка. По книжкам. — Ты говоришь это так спокойно, что сам почти веришь.`,
      `Дана кивает и больше не спрашивает. У станции она машет тебе и уходит, уткнувшись в комм. Что-то пишет. Длинное.`,
    ]},
    fail:{hint:`Она поймёт, что ты врёшь`, eff:{flag:'liedDana'}, res:[
      `— Самоучка. По книжкам, — говоришь ты, и на слове «книжкам» у тебя краснеют уши.`,
      `Дана смотрит на тебя секунду дольше, чем нужно. — Понятно, — говорит она мягко. У станции вы расходитесь, и ты всю дорогу думаешь, зачем соврал человеку, который просто спросил.`,
    ]},
    next:'z1'},
  {t:`Спросить, почему её так интересуют твои родители.`, show:s=>s.stats.mind>=7, hint:`Слишком много вопросов для лапши.`, eff:{flag:'danaSuspicious'}, res:[
    `— Ты третий раз спрашиваешь про моих родителей. Почему?`,
    `Дана замирает с палочками в руке. На полсекунды, не больше. — Интересуешься человеком — интересуешься его семьёй, — говорит она. — Нормально же? — Нормально, — соглашаешься ты. Но запоминаешь эти полсекунды.`,
    `У станции вы расходитесь. Она машет тебе из-за стекла вагона, и улыбка у неё немного виноватая.`,
  ], next:'z1'},
]},

/* ---------- СЦЕНА 10. ТИХИЙ ВЕЧЕР ---------- */
z1:{scene:'s10', head:true, text:[
  `Последняя неделя октября выдаётся на удивление тихой. Никто не стучит в ставню, не приходят письма, дождь впервые за месяц перестаёт на целый вечер.`,
  {when:s=>s.flags.kitInformant, text:`Только однажды утром ты находишь у рольставни записку, нацарапанную на обёртке от лапши: «Грач велел узнать, где ты учишься. Я не сказал. К.»`},
  {when:s=>(s.rel.dana||0)>=2, text:`С Даной вы теперь переписываетесь по вечерам. О преподавателях, о дурацких мемах, о чём угодно, кроме её семьи.`},
  `Ника вытаскивает тебя на крышу мастерской с двумя пледами и термосом. Отсюда видно пол-Ноктиса: деловой центр горит, как ёлочная игрушка, Южные кварталы тлеют, как угли.`,
  {when:s=>s.flags.nikaTattoo, text:`Рыбка у неё на запястье светится в темноте. Мать её так и не заметила. Или сделала вид.`},
  {when:s=>s.flags.lostComm, text:`Новый комм ей купила мать в рассрочку. Ника до сих пор перебирает в нём пустую галерею.`},
  `— Лео, — говорит Ника, глядя на город. — Как думаешь, мы нормальная семья?`,
], choices:[
  {t:`Пошутить: «Нормальная. Для семьи, которая живёт под эстакадой и ест рагу-улику».`, eff:{rel:{nika:1}}, res:[
    `Ника фыркает в плед. — Улика, кстати, была вкусная. — Не ври. — Ладно, не была.`,
    `Вы смеётесь, и на минуту всё действительно кажется нормальным.`,
  ], next:'mon10'},
  {t:`Сказать честно: «Не знаю».`, eff:{rel:{nika:1}, flag:'honestNika'}, res:[
    `— Не знаю, — говоришь ты. — Иногда мне кажется, что они что-то от нас скрывают.`,
    `Ника долго молчит. — Мне тоже, — говорит она наконец. — Хорошо, что не только мне.`,
    `Она придвигается ближе, и вы сидите так, пока термос не остывает.`,
  ], next:'mon10'},
  {t:`Успокоить: «Нормальная. Самая лучшая».`, res:[
    `— Нормальная, — говоришь ты. — Самая лучшая.`,
    `Ника кивает, но не отвечает. Вы оба знаете, что она спрашивала не об этом.`,
  ], next:'mon10'},
]},

/* ---------- МЕЖДУ ДЕЛОМ: итог месяца, +1 к выбранной характеристике ---------- */
mon9:{scene:'mon9', head:true, text:[
  `Сентябрь позади. Если оглянуться, у всех его дней было что-то общее: куда ты шёл, когда не нужно было никуда идти.`,
  {when:s=>s.flags.handedKid, tag:'Новости Ноктиса', text:`«Патруль „Эстакады“ задержал малолетнего карманника. Пострадавшая благодарит неизвестного студента»`},
  {when:s=>s.flags.releasedKid || s.flags.ignoredThief || s.flags.lostThief, tag:'Новости Ноктиса', text:`«Карманники на „Эстакаде“: патруль опять опоздал»`},
  {when:s=>s.flags.froze || s.flags.shouted, tag:'Новости Ноктиса', text:`«Ночью в Южных кварталах на пять минут погас свет. Энергосеть: „скачок напряжения“»`},
  {tag:'Новости Ноктиса', text:`«Церебра открыла ещё сорок кабин биометрии в управах бедных районов. „Для вашего удобства“»`},
  `Чем ты жил этот месяц?`,
], choices:[
  {t:`Спортзал в подвале университета, три раза в неделю.`, eff:{stat:{body:1}, why:`Месяц в подвальном спортзале университета.`}, res:[
    `Подвальный зал пахнет резиной и чужим потом. Тренер, бывший докер, говорит мало и всегда одно: «Ещё раз». К концу месяца ты поднимаешься на пятый этаж, не задыхаясь.`,
  ], next:'o1'},
  {t:`Пробежки по утрам вдоль эстакады.`, eff:{stat:{agi:1}, why:`Утренние пробежки вдоль эстакады, через ограждения и крыши гаражей.`}, res:[
    `Шесть утра, дождь, пустые улицы. Ты бежишь вдоль эстакады, перемахиваешь через ограждения, срезаешь по крышам гаражей. Однажды пёс со свалки гонится за тобой два квартала и отстаёт.`,
  ], next:'o1'},
  {t:`Вечера в мастерской с отцом.`, eff:{stat:{tech:1}, why:`Вечера в мастерской: отец показывал то, чего нет ни в одном учебнике.`}, res:[
    `Вы с отцом разбираете всё, что приносят клиенты, и ещё немного того, что никто не приносил. Он показывает то, чего нет ни в одном учебнике. Иногда вы молчите по часу, и это хорошее молчание.`,
  ], next:'o1'},
  {t:`Библиотека до самого закрытия.`, eff:{stat:{mind:1}, why:`Месяц в университетской библиотеке до закрытия.`}, res:s=>[
    `Библиотекарь начинает здороваться с тобой первой. Ты читаешь всё подряд: схемотехнику, историю корпораций, старые журналы, где Церебра ещё называлась «лабораторией нейропротезирования».`,
    ('dana' in s.rel) ? `Дана иногда сидит за соседним столом. Вы не разговариваете, но она всегда кивает.` : null,
  ], next:'o1'},
  {t:`Забегаловки с одногруппниками.`, eff:{stat:{charm:1}, why:`Вечера с одногруппниками: научился говорить с людьми, а не с железом.`}, res:[
    `Дешёвая лапша, споры о преподавателях и о том, чья очередь платить. Ты вдруг обнаруживаешь, что умеешь рассмешить стол из шести человек. Раньше ты умел рассмешить только тостер.`,
  ], next:'o1'},
  {t:`Жёсткий режим: подъём в шесть, никаких поблажек.`, eff:{stat:{will:1}, why:`Месяц жёсткого режима: подъём в шесть, никаких поблажек.`}, res:[
    `Будильник в шесть. Холодный душ, потому что горячая вода в Южных кварталах бывает по праздникам. Ни одной пропущенной пары. Ника называет тебя роботом. Тебе почему-то приятно.`,
  ], next:'o1'},
]},

mon10:{scene:'mon10', head:true, text:[
  `Октябрь тает в дожде. Между управой, Тео и крышей с Никой у тебя ещё оставалось время.`,
  {when:s=>s.flags.strippedDrone, tag:'Новости Ноктиса', text:`«Церебра сообщает о потере курьерского дрона над Южными кварталами. Нашедшего просят вернуть за вознаграждение»`},
  {when:s=>s.flags.grachAngry, tag:'Новости Ноктиса', text:`«На ночном рынке прикрыли точку напёрсточников. Торговцы: „Надолго ли?“»`},
  {tag:'Новости Ноктиса', text:`«Очередь на сверку документов в управе Южных кварталов растянулась до весны»`},
  `Чем ты его занимал?`,
], choices:[
  {t:`Помогал Барро перетаскивать его склад.`, eff:{stat:{body:1}, why:`Месяц таскал ящики со склада Барро.`}, res:[
    `Барро переезжает и платит едой. Ящики тяжёлые, Барро молчаливый, а новый локтевой узел работает как часы. Однажды он говорит: «Крепче стал». Больше за месяц он не говорит ничего.`,
  ], next:'ev10'},
  {t:`Лазил по крышам ночного рынка.`, eff:{stat:{agi:1}, why:`Месяц на крышах ночного рынка.`}, res:s=>[
    s.flags.kitFriend ? `Кит показывает тебе крыши рынка: где можно пройти, где нельзя и где можно, но лучше не надо. Он прыгает как кошка. К концу месяца ты прыгаешь как очень осторожная кошка.` : `Уличные мальчишки с рынка носятся по крышам, как по тротуару. Ты начинаешь с малого и падаешь всего дважды. К концу месяца ты уже не смотришь вниз.`,
  ], next:'ev10'},
  {t:`Собирал из хлама свой первый дрон.`, eff:{stat:{tech:1}, why:`Собрал из хлама собственный дрон.`}, res:[
    `Корпус от кухонного вентилятора, моторы от старых дронов, контроллер, выменянный на рынке. Первый полёт длится четыре секунды и заканчивается в тазу с бельём. Второй — двенадцать. Ника даёт ему имя: Таз.`,
  ], next:'ev10'},
  {t:`Читал то, что не задавали: учебник по нейроинтерфейсам.`, eff:{stat:{mind:1}, why:`Прочитал учебник по нейроинтерфейсам, которого не было в программе.`}, res:[
    `Толстый учебник издательства Церебры, двадцатилетней давности. Половина глав про импланты. Одна — про «интеграцию интерфейса на этапе формирования нервной системы». Она обрывается на середине, дальше страницы вырваны.`,
  ], next:'ev10'},
  {t:`Подрабатывал на рынке по выходным.`, eff:{stat:{charm:1}, why:`Месяц за прилавком на рынке: торговался, уговаривал, улыбался.`, flag:'marketJob'}, res:[
    `Рафа берёт тебя за прилавок по выходным. Ты торгуешься, уговариваешь, улыбаешься и к концу месяца продаёшь лапшу даже тем, кто пришёл за батарейками.`,
  ], next:'ev10'},
  {t:`Не пропустил ни одной пары, даже в ливень.`, eff:{stat:{will:1}, why:`Ни одной пропущенной пары за месяц, даже в ливень.`}, res:[
    `В Ноктисе всегда дождь, но в октябре он особенно убедителен. Ты ходишь на все пары, включая лекцию по истории корпоративного права в восемь утра. На ней вас трое. Преподаватель смотрит на тебя с благодарностью.`,
  ], next:'ev10'},
]},

/* ================= НОЯБРЬ ================= */

/* ---------- СЦЕНА 11. ЧАЙ У ГРАЧА ---------- */
g1:{scene:'s11', head:true, text:[
  `Ноябрь приходит с холодным дождём, который не идёт, а висит в воздухе. Ноктис кутается в неон, как в шарф.`,
  {when:s=>s.flags.kitFriend, text:`Приглашение приносит Кит. Он ждёт тебя у выхода из университета, мокрый и важный, как курьер с дипломатической почтой. — Грач зовёт на чай. Сказал, вежливо позвать. Я вежливо зову.`},
  {when:s=>!s.flags.kitFriend && s.flags.grachEnemy, text:`У выхода из университета тебя ждут двое в знакомых куртках. Тот, которого ты бил, держит руки в карманах. — Пойдём, — говорит он. — Грач зовёт. На чай. Не бойся, он правда на чай.`},
  {when:s=>!s.flags.kitFriend && !s.flags.grachEnemy && (s.flags.grachDebt || s.flags.handedKid || s.flags.grachAngry), text:`В почтовом ящике мастерской лежит визитка. На ней только нарисованная птица и адрес чайной на рынке. На обороте аккуратным почерком: «Четверг, 19:00. Будьте любезны. Г.»`},
  {when:s=>!s.flags.kitFriend && !s.flags.grachEnemy && !(s.flags.grachDebt || s.flags.handedKid || s.flags.grachAngry), text:`В почтовом ящике мастерской лежит визитка с нарисованной птицей и адресом чайной на рынке. На обороте: «Хотел бы познакомиться с сыном Томаша. Четверг, 19:00. Г.» Кто-то на рынке, видимо, слишком много рассказывает о мастерах, которые всё чинят.`},
  `Чайная «Белый журавль» — три стола, бамбуковые шторы и запах жасмина поверх запаха рынка. Грач сидит у окна. Невысокий, аккуратный, лет пятидесяти, в сером кардигане и очках для чтения. Перед ним чайник и толстая бумажная тетрадь. Больше всего он похож на бухгалтера, который вышел на пенсию и завёл кошку.`,
  `— Садись, Лео, — говорит он мягко. — Чай с молоком или без?`,
], choices:[
  {t:`«С молоком».`, res:[`Грач наливает, добавляет молоко из крошечного кувшина и пододвигает чашку. Движения точные, как у аптекаря.`], next:'g1b'},
  {t:`«Без».`, res:[`Грач одобрительно кивает. — Правильно. Хороший чай не надо спасать.`], next:'g1b'},
  {t:`«Спасибо, не надо».`, res:[`Грач пожимает плечами и наливает себе. Твоя чашка так и стоит пустой, как знак вопроса.`], next:'g1b'},
]},

g1b:{scene:'s11', text:[
  `Грач отпивает чай и смотрит на тебя поверх очков, будто сверяет с записью в тетради.`,
  {when:s=>s.flags.handedKid, text:`— Ты сдал моего мальчика патрулю, — продолжает он. — Я не сержусь, ты действовал по совести. Но совесть стоит денег: мальчик потерял неделю заработка, а я — мальчика на неделю.`},
  {when:s=>s.flags.grachEnemy, text:`— Ты ударил моего человека, — продолжает он. — Он заслужил, я не спорю. Но порядок есть порядок, и в тетради у меня записано.`},
  {when:s=>s.flags.grachAngry, text:`— Ты испортил мне точку с напёрстками на неделю, — продолжает он. — Остроумно, кстати. Но в тетради у меня записано.`},
  {when:s=>s.flags.grachSoftened, text:`— Ты извинился перед ребёнком, — говорит он. — Взрослые люди этого почти не делают. Я ценю редкие вещи.`},
  {when:s=>s.flags.kitFriend, text:`— Кит тебя хвалит, — добавляет он. — Кит никого не хвалит. Даже меня.`},
], choices:[
  {t:`Спросить, чего он хочет.`, res:[
    `— Чего вы хотите? — Прямо к делу, — кивает Грач с одобрением. — Хорошо. Люблю людей, которые экономят чужое время.`,
  ], next:'g2'},
  {t:`Спросить про белые кабины в управах. Вдруг он что-то знает.`, check:{stat:'mind', v:6, bonus:[{when:s=>s.flags.dadStopped, why:'ты видел кабину в управе своими глазами'}]},
    ok:{hint:`Грач скажет больше, чем собирался`, eff:{flag:'grachKnowsCabins'}, res:[
      `Грач снимает очки и протирает их салфеткой. — Кабины ищут кого-то. Не преступников: преступники Церебре неинтересны. Они ищут кого-то конкретного. А кто ищет конкретного, рано или поздно начинает платить за сведения.`,
      `Он надевает очки обратно. — Я пока не продаю. Мои мальчики в управы не ходят. Ты тоже не ходи.`,
    ]},
    fail:{hint:`Грач уйдёт от ответа`, res:[`— Кабины как кабины, — улыбается Грач. — Я в управы не хожу. Там очереди.`]},
    next:'g2'},
  {t:`Сказать, что ничего ему не должен.`, check:{stat:'will', v:5},
    ok:{hint:`Грач зауважает`, eff:{rel:{grach:1}}, res:[`— Я вам ничего не должен. Грач смотрит на тебя поверх очков долго и внимательно. Потом что-то пишет в тетради. — Возможно, — говорит он. — Возможно, и не должен. Выпей чаю.`]},
    fail:{hint:`Прозвучит неуверенно`, res:[`Голос звучит неуверенно даже для тебя самого. Грач мягко улыбается, как учитель ребёнку. — Выпей чаю, Лео.`]},
    next:'g2'},
]},

g2:{scene:'s11', text:[
  `— У меня на рынке двенадцать камер, — говорит Грач. — Половина не работает, остальные показывают то, что хотят, а не то, что мне нужно. Мне нужен мастер, который умеет чинить и не умеет болтать.`,
  {when:s=>s.flags.handedKid || s.flags.grachEnemy || s.flags.grachAngry || s.flags.grachDebt, text:`— Починишь, и я вычеркну тебя из тетради. Будем квиты.`},
  {when:s=>!(s.flags.handedKid || s.flags.grachEnemy || s.flags.grachAngry || s.flags.grachDebt), text:`— Починишь, и я запишу тебя в другую графу тетради. Туда, где записаны люди, которым я должен.`},
], choices:[
  {t:`Согласиться.`, hint:`Грач станет союзником. Такие союзники дорого стоят.`, eff:{rel:{grach:1}, flag:'grachDeal'}, res:[
    `— Согласен.`,
    `Грач кивает и аккуратно, по линейке, что-то пишет в тетради. — По средам, после восьми. Кит покажет, где камеры. И, Лео… — Он поднимает глаза. — Мне нравятся люди, которые держат слово. Не разочаровывай меня.`,
  ], next:'g3'},
  {t:`Согласиться, если он отпустит Кита работать на рынке по-честному.`, check:{stat:'charm', v:5},
    ok:{hint:`Грач согласится на условие`, eff:{moral:1, rel:{grach:1}, flag:['grachDeal','kitFree']}, res:[
      `Грач долго молчит. Потом смеётся, тихо, одними глазами. — Ты торгуешься за чужого мальчика. Ладно. Кит будет продавать лапшу у Рафы. Если сам захочет.`,
      `Он записывает в тетрадь две строчки вместо одной.`,
    ]},
    fail:{hint:`Грач откажет в условии`, eff:{rel:{grach:1}, flag:'grachDeal'}, res:[`— Ты торгуешься тем, чего у тебя нет, — мягко говорит Грач. — Кит мой, пока сам не решит иначе. Но камеры ты починишь. Среда, после восьми.`]},
    next:'g3'},
  {t:`Вежливо отказаться.`, check:{stat:'will', v:5},
    ok:{hint:`Грач отпустит без обид`, eff:{flag:'grachRefused'}, res:[`— Спасибо за чай. Но нет. Грач кивает, будто другого и не ждал. — Разумно. Когда передумаешь, чайная работает до полуночи.`]},
    fail:{hint:`Грач запомнит`, eff:{rel:{grach:-1}, flag:['grachRefused','grachDebt']}, res:[`Ты мнёшься, отказываешься, извиняешься. Грач выслушивает всё и что-то пишет в тетради. — Как скажешь, Лео. Как скажешь.`]},
    next:'g3'},
]},

g3:{scene:'s11', text:[
  {when:s=>s.flags.grachDeal, text:`Грач закрывает тетрадь и снимает очки, будто рабочий день закончился. Дальше, кажется, просто чай.`},
  {when:s=>!s.flags.grachDeal, text:`Грач закрывает тетрадь. Разговор о деле окончен, но чай в твоей чашке ещё горячий, и уходить сразу почему-то неловко.`},
  `За бамбуковой шторой шумит рынок. По стеклу ползут капли, в каждой отражается неоновая вывеска напротив.`,
], choices:[
  {t:`Допить чай и попрощаться как следует.`, res:s=>[
    `Ты допиваешь чай. Он и правда хороший: горький, с дымком. Грач провожает тебя до двери и пожимает руку. Ладонь сухая, крепкая.`,
    s.flags.grachDeal ? `— До среды, мастер, — говорит он. — Кит будет ждать у лапшичной Рафы.` : `— Заходи без дела, — говорит он. — Чай тут не хуже, если ничего не должен.`,
    `Ты выходишь под дождь. Рынок гудит, как всегда. Ничего не изменилось. Кроме того, что теперь ты есть в тетради Грача.`,
  ], next:'d1'},
  {t:`Спросить, откуда он знает отца.`, hint:`Грач может рассказать. Может и не всё.`, res:s=>[
    `— Вы знаете моего отца?`,
    `— Томаша? Кто ж его не знает. Он чинил мне кассу, когда ты ещё в школу ходил, — говорит Грач. — Лучший мастер на рынке. И единственный, кто ни разу не спросил, откуда у меня деньги. Я ценю людей, которые не задают лишних вопросов.`,
    `Он смотрит на тебя поверх очков. — Ты, я вижу, задаёшь. Это не упрёк. Просто ты не совсем в него.`,
    `От этих слов тебе становится неуютно. Ты допиваешь чай, прощаешься и выходишь под дождь.`,
  ], next:'d1'},
  {t:`Уйти, не допив.`, res:s=>[
    `Ты встаёшь, оставив полчашки. Грач не обижается, только кивает, будто так и записано в тетради.`,
    s.flags.grachDeal ? `— Среда, — напоминает он тебе в спину. — После восьми.` : `— Дверь не заперта, — говорит он тебе в спину. — Ни туда, ни обратно.`,
    `На улице дождь. Ты идёшь к станции быстрее, чем нужно.`,
  ], next:'d1'},
]},

/* ---------- СЦЕНА 12. ВЕЧЕР У ДАНЫ ---------- */
d1:{scene:'s12', head:true, text:[
  {when:s=>s.flags.grachDeal, text:`В первую среду после чайной ты лезешь на столб посреди рынка. Кит держит лестницу и даёт советы, которых никто не просил. Камеры у Грача старые, провода погрызены крысами, но к полуночи три из двенадцати уже смотрят туда, куда надо.`},
  {when:s=>!s.flags.grachDeal, text:`Неделю после чайной ты обходишь рынок стороной, хотя никто тебя не трогает. Грач, похоже, правда отпустил. Или просто записал и ждёт.`},
  `Ноябрь входит в колею: пары, мастерская, дождь. А в пятницу после пары тебя ловит Дана.`,
  `— У Мигеля сломалась приставка, — говорит она. — Старая, ещё папина. Он третий день со мной не разговаривает, будто это я её сломала. — Она мнётся. — Ты же всё чинишь. Приходи в субботу? Я накормлю. Честно, больше некого позвать.`,
  {when:s=>s.flags.metMiguelTalk, text:`Мигель. Тот самый, который уверен, что умнее сестры.`},
  {tag:'Рассудок', when:s=>s.stats.mind>=7, text:`Приставку можно отнести в любую мастерскую на рынке. Но она зовёт тебя домой. Ты отмечаешь это про себя и соглашаешься.`},
], choices:[
  {t:`«Приду. С паяльником».`, res:[`— Приду. С паяльником. — Дана выдыхает, будто ждала отказа. — В субботу, в пять. Я скину адрес.`], next:'d1a'},
  {t:`«А что мне за это будет?»`, res:[`— Ужин, — говорит Дана. — И Мигель, который будет смотреть на тебя, как на фокусника. Поверь, это дорого стоит. — Ладно, в субботу.`], next:'d1a'},
]},

d1a:{scene:'s12', text:[
  `В субботу ты едешь в Северный район. Панельная девятиэтажка, лифт, который помнит лучшие времена.`,
  {when:s=>s.flags.nikaMove, text:`Ника говорила, что вы жили здесь, когда тебе было десять. Ты идёшь от станции и не узнаёшь ни одной улицы. Ни одной.`},
  `Квартира маленькая и очень чистая. Пахнет лекарствами и корицей. На двери холодильника расписание приёма таблеток, расчерченное по часам.`,
  `— Ты Лео, который всё чинит? — Из комнаты выходит мальчишка лет двенадцати, худой, бледный и очень серьёзный. В руках у него приставка, древняя, с потёртыми джойстиками. — Я Мигель. Она не включается. Дана говорит, ты волшебник. Я не верю в волшебников, так что давай, докажи.`,
  `У Мигеля на левом виске маленький имплант. Гладкий, белый, с голубым огоньком, который мигает раз в секунду. И с логотипом Церебры.`,
], choices:[
  {t:`Чинить вместе с Мигелем: пусть держит фонарик и смотрит.`, hint:`Медленнее. Зато вы познакомитесь.`, eff:{rel:{dana:1}, flag:['playedMiguel','knowsMiguel']}, res:[
    `Вы садитесь на пол. Мигель держит фонарик и задаёт по вопросу в секунду: а это что, а это зачем, а почему ты паяешь левой. Ты отвечаешь на все.`,
    `— А это у меня от приступов, — вдруг говорит он, заметив твой взгляд на импланте. — Раньше я падал и дёргался, а теперь нет. Раз в месяц Дана возит меня в белую клинику, настраивать. Там все улыбаются, как в рекламе. Даже когда колют.`,
    `Виноват вздувшийся конденсатор. Через час приставка включается. Мигель смотрит на экран, потом на тебя: — Ладно. Может, немного волшебник. — И тут же обыгрывает тебя в «Гонки» три раза подряд.`,
    `Дана стоит в дверях кухни с полотенцем и смотрит на вас так, будто это очень хрупкая вещь.`,
  ], next:'d1b'},
  {t:`Починить быстро и показать класс.`, check:{stat:'tech', v:6},
    ok:{hint:`Мигель будет впечатлён`, eff:{rel:{dana:1}, flag:'playedMiguel'}, res:[
      `Ты вскрываешь корпус, находишь вздувшийся конденсатор и меняешь его на запасной из своей сумки. Десять минут. Приставка пищит и загорается.`,
      `Мигель молчит секунд пять. — Ладно, — говорит он. — Реванш. — И обыгрывает тебя в «Гонки» три раза подряд, а один раз даёт выиграть, так явно, что вы оба смеётесь.`,
    ]},
    fail:{hint:`Провозишься дольше, чем хотел`, res:[
      `Конденсатор ты находишь сразу, а вот трещину в плате только через час. Мигелю надоедает смотреть, и он уходит в комнату.`,
      `Когда приставка наконец включается, он прибегает на писк, молча хватает её и уносит к себе. — Это значит «спасибо», — переводит Дана. — На его языке.`,
    ]},
    next:'d1b'},
  {t:`Пока чинишь, приглядеться к импланту Мигеля.`, hint:`Такие импланты ты видел только в учебниках.`, check:{stat:'tech', v:6},
    ok:{hint:`Поймёшь, что это за модель`, eff:{flag:'miguelLimen'}, res:[
      `Мигель сидит рядом и светит фонариком в корпус, и имплант у тебя прямо перед глазами. Модель экспериментальная: ни одного стандартного разъёма, только корпоративный порт с защитой. На корпусе крошечная гравировка: «Серия „Лимен“. Не для продажи».`,
      `Ты не знаешь, что такое «Лимен». Но от слова почему-то холодно.`,
      `Приставку ты чинишь за полчаса. Мигель кивает, как начальник, принимающий работу.`,
    ]},
    fail:{hint:`Ничего не поймёшь`, res:[`Имплант как имплант, ты таких не видел, но мало ли что ты не видел. Приставку ты чинишь за полчаса. Мигель кивает, как начальник, принимающий работу.`]},
    next:'d1b'},
]},

d1b:{scene:'s12', text:[
  `Дана кормит вас гречкой с тушёнкой, а чай у неё с корицей. Мигель ест за троих и рассказывает про «Гонки», пока не начинает клевать носом. Ровно в девять, по расписанию на холодильнике, Дана даёт ему таблетку и уводит спать.`,
  {when:s=>s.flags.playedMiguel, text:`— Завтра реванш, — грозится он с порога. — Ты слышишь? Реванш!`},
  `На кухне вы остаётесь вдвоём. Дана наливает чай и садится напротив. Комм у неё лежит на столе экраном вниз.`,
  {when:s=>s.flags.honestDana, text:`— Ты говорил, твои не любят вспоминать прошлое, — говорит она. — Совсем ничего? Даже где ты родился?`},
  {when:s=>!s.flags.honestDana, text:`— Слушай, а твои родители… — начинает она и запинается. — Вы же не всегда жили под эстакадой? Твой отец раньше где работал? Руки у тебя не как у самоучки.`},
  `Комм на столе вибрирует. Дана не смотрит на него.`,
], choices:[
  {t:`Ответить честно: сам почти ничего не знаешь.`, hint:`Честность располагает. Даже когда нечего сказать.`, eff:{rel:{dana:1}, flag:'honestDana'}, res:[
    `— Не знаю, Дан. Правда. Они не рассказывают, а я не спрашиваю. Раньше не спрашивал.`,
    `Дана долго смотрит в чашку. — Прости, — говорит она. — Лезу не в своё дело. — Кажется, она хочет сказать что-то ещё, но комм опять вибрирует, и она выключает его совсем.`,
  ], next:'d2'},
  {t:`Спросить в ответ: а где её родители?`, hint:`Она спрашивает о твоих. Честно спросить о её.`, eff:{rel:{dana:1}, flag:'danaOpened'}, res:[
    `— А твои где? Вы с Мигелем одни живёте.`,
    `Дана вертит чашку. — Отец улетел на орбитальные верфи, когда Мигелю было семь. Денег присылает. Иногда. Мама… мамы нет. — Она пожимает плечами, будто это про погоду. — Так что я Мигелю и мама, и папа, и сестра. И медсестра.`,
    `— Прости, — говоришь ты. — Ничего, — отвечает она. — Ты первый, кто спросил.`,
  ], next:'d2'},
  {t:`Посмотреть, кто ей так настойчиво звонит.`, check:{stat:'mind', v:6, bonus:[{when:s=>s.flags.danaSuspicious, why:'в лапшичной ты заметил, что она слишком много спрашивает'}]},
    ok:{hint:`Увидишь то, что не предназначено тебе`, eff:{flag:'sawCurator'}, res:[
      `Дана встаёт за сахаром, и комм снова вибрирует, сдвинувшись к краю стола. Экран на секунду загорается из-под края: «Куратор. Отчёт».`,
      `Дана возвращается, переворачивает комм ещё раз и выключает звук. На вопрос про родителей ты так и не отвечаешь, а она больше не спрашивает.`,
    ]},
    fail:{hint:`Не обратишь внимания`, res:[`Комм вибрирует ещё пару раз. Дана не берёт. Мало ли кто звонит в субботу. Про родителей ты отвечаешь что-то расплывчатое, и она больше не спрашивает.`]},
    next:'d2'},
]},

d2:{scene:'s12', text:[
  `Поздно вечером Дана провожает тебя до лестницы. Лампочка на площадке мигает, внизу хлопает дверь подъезда. Дождь.`,
  {when:s=>s.flags.playedMiguel, text:`— Спасибо, что пришёл, — говорит Дана. — Мигель… ему редко бывает весело. А сегодня было.`},
  {when:s=>!s.flags.playedMiguel, text:`— Спасибо за приставку, — говорит Дана. — Он теперь неделю будет с ней спать.`},
  {when:s=>s.flags.danaOpened, text:`— И за то, что спросил. Я обычно никому не рассказываю.`},
], choices:[
  {t:`Поцеловать её.`, show:s=>(s.rel.dana||0)>=3, hint:`Рискнёшь. Она может и не ответить.`, eff:{rel:{dana:1}, flag:'kissedDana'}, res:[
    `Ты делаешь шаг, и она не отступает. Поцелуй получается короткий, неловкий и очень настоящий.`,
    `Потом Дана отстраняется, быстро, будто обожглась. — Прости. Мне нельзя. — Почему? — Просто нельзя. Не сейчас. — Она уходит в квартиру, не оборачиваясь. Дверь закрывается тихо-тихо.`,
  ], next:{road:true, then:'x1', ctx:'nov'}},
  {t:`Сказать, что она тебе нравится.`, check:{stat:'charm', v:4},
    ok:{hint:`Скажешь как надо`, eff:{rel:{dana:2}, flag:'confessedDana'}, res:[`— Ты мне нравишься, — говоришь ты. Просто, без шуток. Дана смотрит на тебя долго, и в глазах у неё что-то, что очень похоже на боль. — Ты мне тоже, — говорит она. — В этом и проблема.`]},
    fail:{hint:`Выйдет неловко`, eff:{rel:{dana:1}, flag:'confessedDana'}, res:[`— Ты мне это… нравишься. В смысле… в хорошем смысле. — Дана вдруг смеётся, по-настоящему, и целует тебя в щёку. — Иди уже, в хорошем смысле.`]},
    next:{road:true, then:'x1', ctx:'nov'}},
  {t:`Спросить прямо: «Кто такой Куратор?»`, show:s=>s.flags.sawCurator, hint:`Дана может соврать. Или не может.`, eff:{flag:'askedCurator'}, res:[
    `Дана замирает. На полсекунды, не больше. — Научный руководитель. По стипендии. Он… требовательный.`,
    `Она врёт хуже тебя. Ты понимаешь это сразу. Она понимает, что ты понял.`,
  ], next:{road:true, then:'x1', ctx:'nov'}},
  {t:`Просто пожелать спокойной ночи.`, res:[`— Спокойной ночи, Дана. — Спокойной ночи, Лео. — Дверь закрывается, и ты ещё минуту стоишь на мигающей площадке, не понимая, почему не сказал больше.`], next:{road:true, then:'x1', ctx:'nov'}},
]},

/* ---------- СЦЕНА 14. СБОЙ ---------- */
x1:{scene:'s14', head:true, text:[
  `В конце ноября на входе в университет ставят новые турникеты. Белые, гладкие, с логотипом Церебры. Объявление: «Пилотный проект учёта посещаемости. Биометрия. Три секунды — и вы на паре».`,
  `Студенты ворчат, но идут. Очередь двигается быстро: приложил ладонь, мигнуло зелёным, прошёл.`,
  {when:s=>s.flags.promisedDad, text:`Ты вспоминаешь обещание, данное отцу: не заходить в кабины Церебры. Турникет — не кабина. Наверное.`},
  {when:s=>s.flags.dadStopped && !s.flags.promisedDad, text:`Ты вспоминаешь пальцы отца на своём локте в управе. Турникет — не кабина. Наверное.`},
  {tag:'Рассудок', when:s=>s.stats.mind>=7, text:`У турникетов стоят двое не из охраны университета. Серые пальто, планшеты. Смотрят не на студентов, а на экраны.`},
], choices:[
  {t:`Пройти как все. Это просто турникет.`, hint:`Приложить ладонь, как все. Три секунды.`, next:'x2', res:[`Ты подходишь к турникету и кладёшь ладонь на белую панель.`]},
  {t:`Сказать охраннику, что забыл студенческий, и пройти через ручной пропуск.`, check:{stat:'charm', v:4},
    ok:{hint:`Охранник пропустит мимо турникета`, eff:{flag:'avoidedTurnstile'}, res:[`Охранник, пожилой дядька с кроссвордом, машет рукой: — Проходи, Вельт. Я тебя третий год вижу. — Он записывает тебя в бумажный журнал. Белый турникет ты обходишь стороной.`], next:'x3'},
    fail:{hint:`Охранник отправит к турникету`, res:[`— Без студенческого через турникет, по ладони, — говорит охранник, не поднимая глаз от кроссворда. — Для того и поставили.`], next:'x2'}},
  {t:`Пролезть через служебный вход у столовой.`, check:{stat:'agi', v:5},
    ok:{hint:`Проскользнёшь`, eff:{flag:'avoidedTurnstile'}, res:[`Служебная дверь у столовой, как всегда, подпёрта ящиком. Ты проскальзываешь мимо поваров, пахнет капустой. Белые турникеты остаются по ту сторону.`], next:'x3'},
    fail:{hint:`Поймают и отправят обратно`, res:[`Повариха ловит тебя за капюшон. — Куда? Через главный вход, как все люди! — И выставляет обратно, прямо к турникетам.`], next:'x2'}},
]},

x2:{scene:'s14', mood:'tense', text:[
  `Панель холодная. Секунду ничего не происходит.`,
  `Потом турникет под твоей ладонью вспыхивает красным. За ним соседний. И следующий. Красная волна бежит по всем двенадцати турникетам, перекидывается на табло, на камеры, на лампы в холле. «ОШИБКА ИДЕНТИФИКАЦИИ. ОШИБКА. ОШИБКА».`,
  `Свет гаснет во всём корпусе. В темноте слышно, как по всему университету с сухим щелчком одна за другой отключаются двери.`,
  `В голове у тебя звенит, как после удара. Ты проводишь рукой по губе, и пальцы становятся тёплыми и мокрыми. Кровь из носа.`,
  {when:s=>'dana' in s.rel && (s.rel.dana||0)>=1, text:`Кто-то вкладывает тебе в руку салфетку. Дана. Она смотрит на тебя, потом на кровь, потом снова на тебя. И ничего не говорит.`},
  {tag:'Рассудок', when:s=>s.stats.mind>=7, text:`Двое в серых пальто больше не смотрят на экраны. Экраны погасли. Они смотрят в толпу. И один из них что-то быстро говорит в комм.`},
], choices:[
  {t:`Помочь админам перезапустить сеть: ты знаешь, где серверная.`, check:{stat:'tech', v:6},
    ok:{hint:`Станешь героем дня. Имя запомнят.`, eff:{strange:1, flag:['cerebraPing','adminKnowsLeo']}, res:[
      `Серверная в подвале, админ Пак в панике тычет в мёртвый терминал. Ты перезапускаешь коммутаторы по одному, и сеть оживает. Турникеты загораются зелёным.`,
      `— Вельт, ты гений, — говорит Пак. — Напишу на тебя благодарность в деканат. — Не надо, — говоришь ты. Он уже пишет.`,
    ]},
    fail:{hint:`Не разберёшься`, eff:{strange:1, flag:'cerebraPing'}, res:[`Ты спускаешься в серверную, но там уже целая толпа. Сеть поднимают только к обеду.`]},
    next:'x3'},
  {t:`Уйти, пока никто не начал разбираться.`, check:{stat:'will', v:4},
    ok:{hint:`Сохранишь лицо`, eff:{strange:1, flag:['cerebraPing','slippedAway']}, res:[`Ты зажимаешь нос салфеткой и спокойно, не торопясь, идёшь к лестнице. Никто не останавливает. В темноте все одинаковые.`]},
    fail:{hint:`Сорвёшься на бег`, eff:{strange:1, flag:['cerebraPing','ranAway']}, res:[`Ты срываешься на бег, и это единственное быстрое движение в застывшей толпе. Кто-то оборачивается тебе вслед.`]},
    next:'x3'},
  {t:`Громко пошутить: «Технология древних сломалась!»`, check:{stat:'charm', v:4},
    ok:{hint:`Толпа засмеётся и отвлечётся`, eff:{strange:1, flag:'cerebraPing'}, res:[`— Технология древних сломалась! — кричишь ты в темноту. Холл взрывается смехом. Кто-то подхватывает: «Верните ключи!» Ты смеёшься вместе со всеми и незаметно вытираешь кровь.`]},
    fail:{hint:`Шутка повиснет`, eff:{strange:1, flag:['cerebraPing','ranAway']}, res:[`Шутка повисает в темноте. Никто не смеётся. Ты сам слышишь, как дрожит голос.`]},
    next:'x3'},
  {t:`Громко сказать охране, что это парень перед тобой что-то сделал с турникетом.`, hint:`Подозрение уйдёт от тебя. К другому.`, eff:{moral:-1, strange:1, flag:['cerebraPing','blamedOther']}, res:[
    `— Это он! — Ты показываешь на первокурсника, который стоял перед тобой. — Он что-то приложил к панели, я видел!`,
    `Охрана хватает растерянного парня под руки. Двое в серых пальто смотрят на него долго и внимательно. Ты вытираешь кровь из носа рукавом и уходишь, пока все смотрят не на тебя.`,
  ], next:'x3'},
  {t:`Вытащить первокурсников, застрявших в погасшем лифте.`, hint:`Про кровь из носа подумаешь потом.`, eff:{moral:1, strange:1, flag:['cerebraPing','savedLift']}, res:[
    `Из шахты лифта доносится стук и чей-то плач. Ты находишь аварийный ключ за пожарным щитом, раздвигаешь двери и вытаскиваешь троих первокурсников по одному. Последняя девчонка цепляется за тебя и не хочет отпускать.`,
    `Кровь из носа ты замечаешь, только когда она протягивает тебе платок.`,
  ], next:'x3'},
]},

x3:{scene:'s14', text:[
  {when:s=>s.flags.avoidedTurnstile, text:`К обеду по университету ползёт слух: утром турникеты «легли» у какого-то первокурсника, и сеть лежала два часа. Ты был в библиотеке и ничего не видел. Вечером в новостях кампуса пишут «плановое обслуживание».`},
  {when:s=>s.flags.cerebraPing, text:`Вечером в новостях кампуса пишут «плановое обслуживание». Никто не верит, но все делают вид.`},
  {when:s=>s.flags.cerebraPing, text:`Ночью тебе снится белый коридор. Длинный, очень чистый. В конце кто-то считает вслух: пять, шесть, семь.`},
  {when:s=>s.flags.avoidedTurnstile, text:`Через неделю белые турникеты убирают так же тихо, как поставили. «Пилотный проект завершён».`},
], choices:[
  {t:`Рассказать отцу про турникеты.`, show:s=>s.flags.cerebraPing, hint:`Отец должен знать. Наверное.`, eff:{rel:{dad:1}, flag:'toldDadPing'}, res:[
    `Ты рассказываешь отцу про турникеты, про красную волну и про кровь из носа.`,
    `Отец слушает молча. Потом встаёт, подходит к окну и долго смотрит на улицу. — Больше через них не ходи, — говорит он. — Никогда. — Голос у него спокойный. Руки нет.`,
  ], next:'mon11'},
  {t:`Никому ничего не говорить.`, show:s=>s.flags.cerebraPing, res:[`Ты никому ничего не говоришь. Кровь из носа бывает у всех. Сбои бывают у всех. Ноябрь, давление, дождь.`], next:'mon11'},
  {t:`Выдохнуть и забыть про турникеты.`, show:s=>!s.flags.cerebraPing, res:[`Ты не знаешь, почему обошёл их стороной. Просто не захотелось. Иногда не хочется, и всё.`], next:'mon11'},
]},

mon11:{scene:'mon11', head:true, text:[
  `Ноябрь уходит в декабрь, как вода в сток: незаметно, но с чавканьем.`,
  {when:s=>s.flags.cerebraPing, tag:'Новости Ноктиса', text:`«Сбой турникетов в Техническом университете. Церебра: „плановое обслуживание“»`},
  {when:s=>s.flags.avoidedTurnstile, tag:'Новости Ноктиса', text:`«Пилотный проект биометрии в Техническом университете свернули через неделю»`},
  {when:s=>s.flags.blamedOther, tag:'Новости Ноктиса', text:`«Первокурсника Технического отчислили за „порчу имущества корпорации-партнёра“»`},
  {when:s=>s.flags.savedLift, tag:'Новости Ноктиса', text:`«Студент вытащил троих первокурсников из застрявшего лифта и ушёл, не назвав имени»`},
  {when:s=>s.flags.adminKnowsLeo, tag:'Новости Ноктиса', text:`«Студент Технического поднял сеть кампуса за двадцать минут. Деканат объявил благодарность»`},
  {when:s=>s.flags.grachDeal, tag:'Новости Ноктиса', text:`«На ночном рынке заработали камеры. Торговцы довольны, карманники нет»`},
  `Чем ты жил этот месяц?`,
], choices:[
  {t:`Лазил по столбам, чиня камеры.`, show:s=>s.flags.grachDeal, eff:{stat:{body:1}, why:`Месяц на столбах рынка с камерами Грача.`, flag:'trainedBody', rel:{grach:1}}, res:[`Двенадцать камер на столбах и крышах рынка. К концу месяца ты залезаешь на любой столб быстрее Кита. Грач присылает тебе банку домашнего варенья. Без записки.`], next:'ev11'},
  {t:`Спортзал в подвале университета.`, show:s=>!s.flags.grachDeal, eff:{stat:{body:1}, why:`Месяц в подвальном спортзале университета.`, flag:'trainedBody'}, res:[`Тренер-докер по-прежнему говорит только «Ещё раз». Ты по-прежнему делаешь ещё раз.`], next:'ev11'},
  {t:`Бегал под ноябрьским дождём.`, eff:{stat:{agi:1}, why:`Пробежки под ноябрьским дождём.`}, res:[`Мокрые кроссовки, мокрые улицы, мокрые мысли. Зато ноги стали быстрее головы.`], next:'ev11'},
  {t:`Чинил с отцом всё, что приносили.`, eff:{stat:{tech:1}, why:`Месяц в мастерской с отцом.`, rel:{dad:1}}, res:[`Отец в ноябре стал больше говорить за работой. Про схемы, про допуски, про то, как отличить хорошую деталь от красивой. Ни слова о прошлом.`], next:'ev11'},
  {t:`Искал в библиотеке всё про программу «Лимен».`, show:s=>s.flags.miguelLimen, eff:{stat:{mind:1}, why:`Месяц поисков в архивах про программу «Лимен».`, flag:'researchedLimen'}, res:[`В открытых архивах про «Лимен» почти ничего нет. Одна статья двадцатилетней давности: «Перспективы нейроинтеграции на этапе эмбриогенеза». Автор — доктор А. Рейне. Фотографии нет.`], next:'ev11'},
  {t:`Сидел в библиотеке до закрытия.`, show:s=>!s.flags.miguelLimen, eff:{stat:{mind:1}, why:`Ещё месяц в университетской библиотеке.`}, res:[`Библиотекарь уже откладывает для тебя новые журналы. Ты читаешь всё подряд и начинаешь замечать, как много в Ноктисе принадлежит Церебре.`], next:'ev11'},
  {t:`Подрабатывал за прилавком у Рафы.`, eff:{stat:{charm:1}, why:`Месяц за прилавком у Рафы: торговался и уговаривал.`, flag:'marketJob'}, res:[`Рафа платит лапшой и историями. Ты учишься торговаться с бабушками и уговаривать тех, кто пришёл «просто посмотреть». К концу месяца уходят с покупкой даже они.`], next:'ev11'},
  {t:`Держал режим, несмотря ни на что.`, eff:{stat:{will:1}, why:`Месяц жёсткого режима в ноябрьской темноте.`}, res:[`Подъём в шесть в ноябре — это подъём в темноте. Ты всё равно встаёшь. Ника перестала называть тебя роботом и начала вставать вместе с тобой.`], next:'ev11'},
]},

e0:{scene:'s15a', head:true, text:[
  `Начало декабря. Сессия на носу, в университетской библиотеке не протолкнуться.`,
  {when:s=>s.flags.kissedDana, text:`После поцелуя на лестнице Дана держится так, будто ничего не было. Но на парах садится всегда рядом.`},
  {when:s=>s.flags.confessedDana && !s.flags.kissedDana, text:`После твоего признания на лестнице Дана стала тише. Но на парах садится всегда рядом.`},
  {when:s=>s.flags.askedCurator, text:`После разговора про «Куратора» между вами будто стекло: видно, но не дотянуться.`},
  {when:s=>!(s.flags.kissedDana || s.flags.confessedDana || s.flags.askedCurator), text:`С Даной вы видитесь на парах и иногда в библиотеке. Мигель через неё передаёт, что ждёт реванша.`},
  `В пятницу она ловит тебя у гардероба. Лицо у неё странное: будто она долго решалась.`,
  `— Лео. Если к вам в мастерскую придут с каким-нибудь опросом… про связь, про сбои… не открывай. Скажи, что никого нет дома.`,
  `— Почему? — Просто не открывай. Пожалуйста.`,
], choices:[
  {t:`«Откуда ты знаешь про опрос?»`, hint:`Она может не ответить.`, eff:{flag:'danaWarned'}, res:s=>[
    `— Откуда ты знаешь?`,
    `— Слышала. У соседей были, — быстро говорит Дана. — Всё, я опаздываю.`,
    s.stats.mind>=6 ? {tag:'Рассудок', text:`В её доме никаких опросов не было: ты был там в ноябре, и соседи у неё сплошь пенсионеры, которым не звонят даже мошенники. Она соврала. И очень хотела, чтобы ты её послушал.`} : `Она уходит так быстро, что ты не успеваешь спросить ещё что-нибудь.`,
  ], next:'e1'},
  {t:`«Хорошо. Спасибо, что сказала».`, eff:{rel:{dana:1}, flag:'danaWarned'}, res:[
    `— Хорошо. Спасибо, что сказала.`,
    `Дана выдыхает, будто держала воздух с самого утра. Сжимает твою руку, быстро, и уходит к выходу. У двери оборачивается, но ничего не говорит.`,
  ], next:'e1'},
  {t:`Взять её за руку: «Дана, у тебя проблемы?»`, show:s=>(s.rel.dana||0)>=3, hint:`Она близко. Может, скажет правду.`, eff:{rel:{dana:1}, flag:'danaWarned'}, res:[
    `— Дан. У тебя проблемы?`,
    `Она смотрит на твою руку на своей. — Да, — говорит она наконец. — Не сейчас, Лео. Честно: не сейчас. Потом я расскажу. Обещаю.`,
    `Это не ответ. Но это первая правда, которую она тебе сказала о себе без шуток.`,
  ], next:'e1'},
]},

/* ---------- СЦЕНА 15. ЛЮДИ В СЕРОМ ---------- */
e1:{scene:'s15', head:true, text:[
  `В середине декабря в Южных кварталах появляются люди в сером.`,
  `Их двое, иногда трое. Длинные пальто, аккуратные стрижки, маленькие белые значки на лацканах. Они ходят от двери к двери с планшетами и вежливо спрашивают: «Исследование качества связи. Не замечали ли вы в последнее время необычных сбоев электроники?»`,
  {when:s=>s.flags.grachDeal, text:`Кит передаёт от Грача записку: «Люди в сером спрашивали о тебе. Я не продал. Пока. Г.»`},
  {when:s=>s.flags.kitInformant && !s.flags.grachDeal, text:`Кит прибегает к мастерской запыхавшийся: — Серые у Грача были. Про тебя спрашивали. Грач им ничего не сказал. Пока.`},
  `В пятницу утром они стучат в рольставню мастерской. Отец в подсобке. Открываешь ты.`,
  {when:s=>s.flags.danaWarned, text:`Ты вспоминаешь Дану у гардероба: «не открывай». Поздно: ставня уже поднята, и женщина в сером улыбается тебе в лицо.`},
  `— Добрый день. Исследование качества связи. — Женщина улыбается, мужчина смотрит мимо тебя, в мастерскую. — Вы, случайно, не учитесь в Техническом университете?`,
  {when:s=>s.flags.cerebraPing, text:`— В ноябре у вас там был интересный сбой, — добавляет она. — Вы, случайно, не видели?`},
], choices:[
  {t:`Отвечать спокойно и скучно, как на анкету.`, check:{stat:'will', v:5, bonus:[{when:s=>s.flags.danaWarned, why:'Дана предупредила: ты их ждал'}]},
    ok:{hint:`Им станет неинтересно`, eff:{flag:'calmGrey'}, res:[`Ты отвечаешь коротко, ровно и скучно, как человек, который опаздывает на пару. Сбоев не видел. Связь нормальная. Спасибо, до свидания. Женщина делает пометку и благодарит. Они уходят к соседям.`]},
    fail:{hint:`Голос выдаст`, eff:{flag:'greyNoted'}, res:[`На слове «сбой» у тебя дёргается голос. Женщина улыбается шире и делает в планшете длинную пометку. — Спасибо, вы нам очень помогли.`]},
    next:'e2'},
  {t:`Заболтать их про качество связи в Южных кварталах.`, check:{stat:'charm', v:5, bonus:[{when:s=>s.flags.marketJob, why:'месяц за прилавком у Рафы: заговаривать зубы ты умеешь'}]},
    ok:{hint:`Они сбегут сами`, eff:{flag:'calmGrey'}, res:[`Ты рассказываешь им про связь в Южных кварталах. Подробно. Про роутер соседа, про эстакаду, которая глушит сигнал, про то, как в прошлом году… Через десять минут они уходят, почти убегают. Кажется, им стало скучно.`]},
    fail:{hint:`Они заметят нервы`, eff:{flag:'greyNoted'}, res:[`Ты говоришь слишком много и слишком быстро. Мужчина впервые смотрит прямо на тебя. — Спасибо. Очень… развёрнуто.`]},
    next:'e2'},
  {t:`Позвать отца: пусть говорит он.`, eff:{flag:'dadTalkedGrey'}, res:[
    `— Пап! Тут опрос.`,
    `Отец выходит из подсобки, вытирая руки тряпкой, и говорит с людьми в сером так, как говорят с дождём: вежливо и не глядя в глаза. Они уходят. Отец ещё долго стоит у ставни.`,
  ], next:'e2'},
  {t:`Посмотреть, что у них на планшете.`, check:{stat:'mind', v:6, bonus:[{when:s=>s.flags.grachKnowsCabins, why:'Грач говорил: они ищут кого-то конкретного'}]},
    ok:{hint:`Увидишь лишнее`, eff:{flag:'sawGreyMap'}, res:[
      `Пока женщина задаёт вопросы, ты скашиваешь глаза на планшет мужчины. Там карта Южных кварталов, усыпанная точками. Красные — сбои. Их больше всего вокруг университета.`,
      `И три красные точки вокруг вашей мастерской.`,
    ]},
    fail:{hint:`Мужчина прикроет экран`, res:[`Мужчина поворачивает планшет экраном к себе, будто случайно.`]},
    next:'e2'},
  {t:`Сказать, что сбои часто бывают у соседки, госпожи Сун.`, hint:`Их интерес уйдёт от вас. К старухе, которая поит тебя чаем.`, eff:{moral:-1, flag:['calmGrey','blamedSun']}, res:[
    `— Сбои? У нас нет. А вот у госпожи Сун через дорогу вечно всё мигает. У неё какие-то старые приборы.`,
    `Женщина в сером благодарит и делает пометку. Через минуту они стучат в дверь напротив. Ты опускаешь ставню и долго стоишь, не отпуская ручку.`,
  ], next:'e2'},
]},

e2:{scene:'s15', text:[
  `Вечером ты спускаешься в мастерскую за паяльником и видишь, как отец укладывает в старый армейский рюкзак вещи. Документы в пакете. Деньги. Лекарства. Четыре зарядки. Фонарь.`,
  `Он замечает тебя и не прячет рюкзак.`,
  `— Это на всякий случай, — говорит он. — Каждая нормальная семья в Ноктисе должна иметь тревожный чемодан. Наводнение, пожар, мало ли.`,
], choices:[
  {t:`Помочь ему собрать рюкзак и ничего не спрашивать.`, eff:{rel:{dad:1}, flag:'helpedBag'}, res:[
    `Ты молча подаёшь ему вещи. Он молча укладывает. Когда рюкзак готов, отец кладёт руку тебе на плечо. — Если когда-нибудь я скажу «бери рюкзак и уходи», ты берёшь и уходишь. С Никой. Не споря. Хорошо? — Хорошо.`,
  ], next:'f1'},
  {t:`Спросить: «Это из-за людей в сером?»`, hint:`Отец может сказать правду. А может и нет.`, eff:{flag:'askedBag'}, res:[
    `— Это из-за них?`,
    `Отец застёгивает рюкзак. — После праздников, — говорит он. — После праздников мы поговорим. Все. Я обещаю. А сейчас дай мне ещё немного побыть обычным отцом.`,
  ], next:'f1'},
  {t:`Пошутить про наводнение в квартале, где даже насос не работает.`, res:[
    `— В квартале, где насос в переходе не работает с моего рождения, наводнение — самый реалистичный сценарий.`,
    `Отец смеётся, и на секунду всё как раньше. Потом он засовывает рюкзак под верстак, глубоко, в самый угол.`,
  ], next:'f1'},
]},

/* ---------- СЦЕНА 16. НОВЫЙ ГОД ---------- */
f1:{scene:'s16', head:true, text:[
  `Тридцать первого декабря мастерская превращается в столовую. Верстак застилают скатертью, паяльники прячут, с эстакады свешивается гирлянда, которую Ника протянула из окна, рискуя жизнью.`,
  `Мать приготовила настоящую еду. Отец принёс настоящий торт. Даже дождь к вечеру перешёл в снег, мокрый и сразу тающий, но всё-таки снег.`,
  {when:s=>s.flags.grachDeal, text:`Кит приносит от Грача коробку мандаринов. Без записки. Отец долго смотрит на коробку, но мандарины ест.`},
  `У тебя под кроватью лежит подарок, который ты готовил весь декабрь.`,
], choices:[
  {t:`Подарить Нике комм с восстановленными фотографиями.`, show:s=>s.flags.lostComm, check:{stat:'tech', v:7},
    ok:{hint:`Ника получит свои фото обратно`, eff:{rel:{nika:3}, flag:'giftPhotos'}, res:[
      `Ты весь декабрь выковыривал резервную копию из облака, в которое никто не заходит. Восемьсот фотографий. Ника листает их и плачет, потом смеётся, потом снова плачет.`,
      `— Как ты… — Секрет фирмы. — Ты дурак, — говорит Ника и обнимает тебя так, что трещат рёбра.`,
    ]},
    fail:{hint:`Восстановишь только часть`, eff:{rel:{nika:1}, flag:'giftPhotos'}, res:[`Восстановить удалось только сорок фотографий из восьмисот. Ника листает их очень медленно, каждую. — Сорок — это много, — говорит она. — Спасибо.`]},
    next:'f2'},
  {t:`Подарить отцу паяльную станцию, собранную своими руками.`, check:{stat:'tech', v:6},
    ok:{hint:`Отец оценит`, eff:{rel:{dad:2}, flag:'giftDad'}, res:[`Отец вертит станцию в руках, щёлкает переключателями, проверяет температуру и молчит слишком долго. — Лучше моей, — говорит он наконец хриплым голосом. — Не говори матери, что я расчувствовался.`]},
    fail:{hint:`Выйдет кривовато`, eff:{rel:{dad:1}, flag:'giftDad'}, res:[`Станция греется неравномерно и немного искрит. Отец всё равно ставит её на верстак на самое видное место. — Доведём до ума, — говорит он. — Вдвоём.`]},
    next:'f2'},
  {t:`Подарить матери настоящие духи: копил два месяца.`, eff:{rel:{mom:2}, flag:'giftMom'}, res:[
    `Мать открывает коробочку, и лицо у неё становится таким, каким ты его не видел никогда: растерянным. — Лео. Это же… это же дорого. — Ты заслужила.`,
    `Она пшикает на запястье и долго нюхает, закрыв глаза. — Так пахло в одном месте, где я была очень давно, — говорит она. — До тебя.`,
  ], next:'f2'},
  {t:`Подарить Нике кулон со светящейся рыбкой, как у неё на запястье.`, show:s=>s.flags.nikaTattoo, eff:{rel:{nika:2}, flag:'giftFish'}, res:[
    `Ника смотрит на кулон, потом на запястье, потом на тебя. — Ты запомнил. — Сложно забыть, ты её показывала двадцать раз. — Двадцать три, — поправляет Ника и надевает кулон.`,
  ], next:'f2'},
  {t:`Отнести половину праздничного ужина Барро: он встречает Новый год один.`, hint:`Подарок не для своих.`, eff:{moral:1, rel:{barro:1}, flag:'barroNY'}, res:[
    `Ты собираешь в контейнеры половину маминой еды и бежишь через двор. Барро открывает не сразу. Увидев тебя, он долго молчит, потом отходит от двери: — Заходи. Пять минут.`,
    `Пять минут превращаются в двадцать. Барро рассказывает, как служил на границе, и впервые при тебе смеётся. Домой ты возвращаешься к самому бою часов.`,
  ], next:'f2'},
]},

f2:{scene:'s16', text:[
  `Без пяти двенадцать отец встаёт с бокалом. Руки у него не дрожат, но голос немного.`,
  `— За то, чтобы в следующем году мы сидели за этим столом. Все четверо. Что бы ни случилось.`,
  `Вы чокаетесь. Над эстакадой взлетают фейерверки корпораций: синие Церебры, золотые Пандоры. Ника визжит. Мать смеётся.`,
  `А потом отец наклоняется к тебе и говорит тихо, так, чтобы слышал только ты: — После праздников нам надо поговорить. Всем. Я тянул слишком долго.`,
], choices:[
  {t:`Попросить сказать сейчас.`, check:{stat:'will', v:6, bonus:[{when:s=>s.flags.askedWhat, why:'в сентябре на кухне он обещал рассказать'}, {when:s=>evCount(s,'family')>=2, why:'вечера с родителями: он привык говорить с тобой'}]},
    ok:{hint:`Отец почти решится`, eff:{flag:'pushedDad'}, res:[`— Скажи сейчас. — Отец смотрит на тебя долго. Открывает рот. Закрывает. — Третьего января, — говорит он. — В мастерской. Дай мне два дня, Лео. Два дня нормальной жизни.`]},
    fail:{hint:`Отец отмахнётся`, res:[`— Не сегодня, — отец кладёт руку тебе на затылок. — Сегодня праздник.`]},
    next:'mon12'},
  {t:`Кивнуть: «Хорошо, пап».`, eff:{rel:{dad:1}}, res:[`— Хорошо, пап. — Он сжимает твоё плечо и отворачивается к фейерверкам. В отражении в окне ты видишь, что он не смотрит на небо. Он смотрит на вас.`], next:'mon12'},
  {t:`Отшутиться: «Если это про оценки, то я не виноват».`, res:[`— Если это про оценки, то я не виноват. — Отец смеётся, громко, и Ника спрашивает, над чем. — Над твоим братом, — говорит отец. — Как обычно.`], next:'mon12'},
]},

mon12:{scene:'mon12', head:true, text:[
  `Между Новым годом и третьим января время течёт медленно и вязко, как мёд. Праздничные дни. Твои последние обычные дни, хотя ты об этом ещё не знаешь.`,
  {when:s=>s.flags.blamedSun, tag:'Новости Ноктиса', text:`«Пенсионерку из Южных кварталов допросили о „несанкционированных устройствах“. Её отпустили под утро»`},
  {tag:'Новости Ноктиса', text:`«Опрос о качестве связи в Южных кварталах завершён. Результаты не публикуются»`},
  {tag:'Новости Ноктиса', text:`«Фейерверк над эстакадой: Церебра потратила на праздник вдвое больше Пандоры»`},
  `Чем ты их заполнил?`,
], choices:[
  {t:`Колол лёд на крыше мастерской и таскал с отцом старые станки.`, eff:{stat:{body:1}, why:`Праздничная неделя тяжёлой работы с отцом.`, flag:'trainedBody'}, res:[`Лёд, станки, ящики. Отец работает молча, ты тоже. К вечеру вы оба пахнете одинаково: потом, железом и немного мандаринами.`], next:'ev12'},
  {t:`Катался с Никой на крыше монорельса.`, eff:{stat:{agi:1}, why:`Каникулы на крышах с Никой.`, rel:{nika:1}}, res:[`Нельзя, опасно, запрещено. Именно поэтому вы с Никой делаете это три дня подряд. Ветер, огни, её смех. Ни разу не падаете.`], next:'ev12'},
  {t:`Доводил до ума свой дрон.`, eff:{stat:{tech:1}, why:`Праздничная неделя над собственным дроном.`}, res:[`Таз летает уже две минуты. Потом падает. Но две минуты!`], next:'ev12'},
  {t:`Читал старые отцовские журналы.`, eff:{stat:{mind:1}, why:`Праздничная неделя над отцовскими журналами.`}, res:[`В одном из журналов, между страницами о сервоприводах, ты находишь старую фотографию: молодые отец и мать в белых халатах. На фото подпись: «Лимен, первый набор». Ты кладёшь её обратно. Руки почему-то дрожат.`], next:'ev12'},
  {t:`Ходил по гостям с Никой: соседи, Рафа, госпожа Сун.`, eff:{stat:{charm:1}, why:`Праздничные визиты по соседям.`, rel:{street:1}}, res:[`Госпожа Сун угощает вас чаем, от которого слезятся глаза, и рассказывает про третью реформу. Рафа кормит бесплатно. Соседи, которых ты знал только в лицо, оказываются людьми.`], next:'ev12'},
  {t:`Ни одного дня без пробежки и книги.`, eff:{stat:{will:1}, why:`Ни одного пропущенного дня даже на праздниках.`}, res:[`Праздники — самое трудное время для режима. Поэтому ты его держишь.`], next:'ev12'},
]},

/* ================= ЯНВАРЬ ================= */

/* ---------- СЦЕНА 17. ТАЙНИК ---------- */
h1:{scene:'s17', head:true, text:[
  `Третье января. Утро. Отец запирает рольставню изнутри на оба замка, чего не делал никогда, и зовёт всех в мастерскую. Мать садится на табурет. Ника на ступеньку. Ты остаёшься стоять.`,
  `Отец отодвигает верстак, поддевает отвёрткой половицу и поднимает её. Под полом ящик. В ящике старый терминал, папка с белым логотипом и детская больничная бирка на резинке.`,
  {when:s=>s.flags.askedWhat && (s.rel.dad||0)>=3, text:`— Я обещал тебе в сентябре, на кухне, — говорит отец. — Рассказать всё. Держу слово.`},
  `— Меня зовут не Томаш Вельт, — говорит отец. — Меня зовут Адам Рейне. Вашу мать зовут Ирена. Двадцать лет назад мы работали в Церебре. В программе, которая называлась «Лимен».`,
  `Он кладёт на верстак папку. На обложке: «Программа „Лимен“. Образец 7».`,
], choices:[
  {t:`Сесть.`, res:[`Ты садишься на край верстака. Ноги почему-то не держат.`], next:'h1b'},
  {t:`Остаться стоять.`, res:[`Ты остаёшься стоять. Кажется, если сядешь, всё это станет правдой.`], next:'h1b'},
  {t:`Посмотреть на Нику.`, res:[`Ника смотрит не на отца, а на тебя. Будто ждёт, что ты скажешь: это шутка.`], next:'h1b'},
]},

h1b:{scene:'s17', text:[
  `— «Лимен» — это попытка вырастить человека, у которого интерфейс не вживлён, а врос. С самого начала. В нервную систему, пока она формируется. Шестеро до тебя… — он замолкает. — Шестеро не выжили, Лео. Ты седьмой. Ты выжил.`,
  `— Ты не мой сын по крови. Ты сын по всему остальному. Когда тебе было три, мы поняли, что с тобой собираются делать дальше, и унесли тебя. Купили новые имена. Спрятались здесь.`,
  {when:s=>s.flags.froze || s.flags.shouted, text:`— Та ночь с Барро. Свет погас не от проводки. Это был ты.`},
  {when:s=>s.flags.cerebraPing, text:`— Турникеты в университете. Это был ты. И они тебя услышали.`},
  {when:s=>s.flags.dadStopped, text:`— Белые кабины в управах. Они ищут тебя. Не преступников. Тебя.`},
  {when:s=>s.flags.nikaMove, text:`— Из Северного района мы бежали, когда тебе было десять: они подошли слишком близко. Ты тогда попал в их сканер, и мы… — Мать закрывает лицо руками. — Мы стёрли тебе память о той ночи. Иначе ты бы проговорился. Прости нас.`},
  `— В твоей голове ключ, — говорит отец. — Ты можешь открыть любую систему. Любую. Сначала это получалось само, от страха, от злости. Потом получится, когда захочешь. Церебра хочет его вернуть. Всё остальное они хотят меньше.`,
  `Отец замолкает. В мастерской так тихо, что слышно, как тикают часы на стене.`,
], choices:[
  {t:`«Вы мне врали всю жизнь!»`, hint:`Злость честная. Но не только она.`, eff:{rel:{dad:-1, mom:-1}, flag:['revealed','angryReveal']}, res:[
    `— Вы врали мне всю жизнь! Девятнадцать лет! — Ты не узнаёшь свой голос.`,
    `Лампа над верстаком вспыхивает и гаснет. Отец не вздрагивает. Он ждал этого.`,
    `— Да, — говорит он. — Врали. Чтобы у тебя была жизнь, про которую можно врать.`,
  ], next:'h2'},
  {t:`Молча уйти на крышу.`, eff:{flag:['revealed','withdrewReveal']}, res:[
    `Ты не говоришь ничего. Просто поднимаешься по лестнице, открываешь люк и садишься на мокрую крышу. Внизу Ноктис. Сверху снег, который не долетает до земли.`,
    `Через час на крышу поднимается мать с пледом. Садится рядом. Молчит. Это правильно.`,
  ], next:'h2'},
  {t:`Спросить всё: что я могу, что они сделают, что теперь.`, check:{stat:'mind', v:6, bonus:[{when:s=>s.flags.miguelLimen || s.flags.researchedLimen, why:'ты уже встречал слово «Лимен»'}]},
    ok:{hint:`Разберёшься в том, что услышал`, eff:{flag:['revealed','askedEverything']}, res:[
      `Ты задаёшь вопросы. Один за другим, спокойно, как на семинаре. Отец отвечает. Ключ — это не программа, это способ мышления. Можно научиться управлять. Можно — людьми тоже, но этого нельзя делать никогда.`,
      `— Кто может научить? — Есть один человек, — говорит отец неохотно. — Ты его знаешь. Тео.`,
    ]},
    fail:{hint:`Запутаешься в вопросах`, eff:{flag:'revealed'}, res:[`Вопросы путаются, сталкиваются друг с другом. Отец отвечает на половину. Этого пока достаточно.`]},
    next:'h2'},
  {t:`Обнять отца.`, eff:{rel:{dad:2, mom:1}, flag:['revealed','forgaveReveal']}, res:[
    `Ты делаешь шаг и обнимаешь его. Отец деревенеет, потом обнимает в ответ так сильно, что больно.`,
    `— Вы меня унесли, — говоришь ты ему в плечо. — Вы меня спасли. Остальное потом.`,
    `Мать плачет беззвучно. Ника на ступеньке смотрит на вас огромными глазами.`,
  ], next:'h2'},
]},

/* ---------- СЦЕНА 18. НИКА ---------- */
h2:{scene:'s18', head:true, text:[
  `Шкала, которую ты не видел, теперь видна. Странность — то, что копилось в тебе всё это время.`,
  {when:s=>s.strange>=4, text:`Её набралось немало. Ты вспоминаешь каждый раз: дрон, стенд, замок Тео, сканер. Это было не везение.`},
  {when:s=>s.strange<4, text:`Её немного. Ты вспоминаешь те редкие разы, когда техника слушалась слишком охотно. Это было не везение.`},
  `Поздно вечером Ника стучит к тебе в комнату. Стучит, хотя никогда не стучала.`,
  `Она садится на край кровати, в твоей толстовке, с кулаками в рукавах. Молчит долго.`,
  {when:s=>(s.rel.nika||0)>=3 || s.flags.honestNika, text:`— Помнишь, на крыше? — говорит она. — Ты сказал, что они что-то скрывают. Я тогда подумала: хоть бы про деньги. Про долги. Про что-нибудь нормальное.`},
  `— Значит, я им родная, а ты… — Она замолкает.`,
], choices:[
  {t:`«А я тебе — брат. Это не поменялось».`, check:{stat:'charm', v:4, bonus:[{when:s=>s.flags.honestNika, why:'на крыше вы были честны друг с другом'}, {when:s=>evCount(s,'nika')>=2, why:'вечера с Никой'}]},
    ok:{hint:`Скажешь правильно`, eff:{rel:{nika:2}, flag:'nikaBrother'}, res:[`— А я тебе брат, — говоришь ты. — Который отбирает тосты и не пускает на рынок. Это не поменялось. — Ника смотрит на тебя, и подбородок у неё дрожит. — Не поменялось, — повторяет она. — Ладно. Ладно.`]},
    fail:{hint:`Прозвучит неуклюже`, eff:{rel:{nika:1}, flag:'nikaBrother'}, res:[`Ты говоришь что-то про брата, но получается неуклюже. Ника всё равно кивает. Иногда неважно, как сказано.`]},
    next:'i1'},
  {t:`Честно: «Я не знаю, кто я теперь».`, eff:{rel:{nika:1}, flag:'nikaHonest2'}, res:[
    `— Я не знаю, кто я теперь, Ник.`,
    `Ника вдруг тычет тебя кулаком в плечо, сильно. — Ты Лео. Ты дурак. Ты не умеешь врать и отдал мне толстовку. Вот кто ты. Остальное — их проблемы.`,
  ], next:'i1'},
