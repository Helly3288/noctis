    ok:{hint:`Поймаешь его головой, а не ногами`, res:[
      `Ты не бежишь. Ты смотришь. Турникеты забиты, у южного выхода патруль, значит, он пойдёт через грузовой лифт, как все местные мальчишки.`,
      `Ты спокойно проходишь к лифту и встаёшь у дверей. Через десять секунд мальчишка вылетает из-за колонны прямо на тебя. Такого лица, как у него в этот момент, ты не видел ни у кого.`,
    ], next:'r1_caught'},
    fail:{hint:`Ошибёшься с выходом`, res:[`Ты ставишь на грузовой лифт. Мальчишка ставит на южный выход. Он выигрывает.`], next:'r1_lost'}},
  {t:`Заорать на всю станцию: «Держите вора!»`, check:{stat:'will', v:5},
    ok:{hint:`Толпа отреагирует`, res:[
      `— ДЕРЖИТЕ ВОРА! — орёшь ты так, что оборачивается половина станции.`,
      `Курьер с огромным термокоробом на спине, не поворачивая головы, выставляет ногу. Мальчишка летит через неё кубарем прямо к твоим ботинкам.`,
      `— Работа у меня такая, — сообщает курьер неизвестно кому и уходит.`,
    ], next:'r1_caught'},
    fail:{hint:`Голос может сорваться`, res:[
      `— Держите в… — голос срывается на середине, и выходит что-то среднее между криком и кашлем. Пара человек оборачивается, но на тебя, а не на вора.`,
      `Мальчишка ныряет за турникеты и исчезает.`,
    ], next:'r1_lost'}},
  {t:`Не вмешиваться. Это не твоё дело.`, eff:{moral:-1, flag:'ignoredThief'}, res:[
    `Ты отводишь глаза. Через минуту мальчишка растворяется в толпе, а женщина стоит у турникетов и кому-то звонит, и голос у неё дрожит.`,
    `Монорельс приходит вовремя. Ты едешь и всю дорогу смотришь в окно, чтобы не смотреть на своё отражение.`,
  ], next:'u1'},
]},

r1_caught:{scene:'s2', text:[
  `Мальчишке лет тринадцать. Под курткой рёбра, которые можно пересчитать. Оранжевые зрачки мечутся.`,
  `— Отпусти, а? — шепчет он. — Меня Грач убьёт, если я без сумки вернусь. Серьёзно убьёт.`,
  `Женщина в пальто уже пробивается к вам. За ней неторопливо плывёт патрульный дрон.`,
], choices:[
  {t:`Отдать сумку женщине, а мальчишку отпустить, пока не подлетел дрон.`, eff:{moral:1, rel:{street:1}, flag:'releasedKid'}, res:[
    `Ты выдёргиваешь сумку и разжимаешь пальцы. — Беги. И найди себе другого Грача.`,
    `Мальчишка исчезает быстрее, чем ты договариваешь. Женщина забирает сумку, проверяет что-то внутри и смотрит на тебя с подозрением, будто ты был в доле. «Спасибо» она так и не говорит. Зато дед на лавке одобрительно кивает.`,
  ], next:'u1'},
  {t:`Сдать его патрульному дрону. Воровать нельзя.`, eff:{money:30, rel:{street:-1}, flag:'handedKid'}, res:[
    `Дрон сканирует мальчишку, и на его запястье защёлкивается пластиковый браслет. Женщина суёт тебе тридцать кредитов: — Благодарю, молодой человек. — И уходит, даже не взглянув на воришку.`,
    `Мальчишка смотрит на тебя, пока его уводят. Долго. Ты запомнишь этот взгляд. Он, похоже, тоже.`,
  ], next:'u1'},
  {t:`Спросить, кто такой Грач.`, check:{stat:'charm', v:4},
    ok:{hint:`Мальчишка разговорится`, eff:{moral:1, rel:{street:1}, flag:'knowsGrach'}, res:[
      `Ты отпускаешь капюшон и говоришь тихо, как с младшим. Мальчишка вдруг начинает тараторить: Грач держит всех мелких от станции до рынка, забирает половину, а кто не приносит… Он проводит пальцем по горлу.`,
      `Потом сам отдаёт сумку и исчезает в толпе. Женщина забирает её и уходит. Имя «Грач» остаётся с тобой.`,
    ]},
    fail:{hint:`Мальчишка замкнётся и сбежит`, res:[
      `Ты пытаешься говорить мягко, но выходит как у полицейского из сериала. Мальчишка замыкается, выкручивается из куртки и удирает. Без куртки, зато и без сумки.`,
      `Ты стоишь с чужой курткой в одной руке и чужой сумкой в другой. Женщина молча забирает сумку. Куртку никто не забирает.`,
    ]},
    next:'u1'},
]},

r1_lost:{scene:'s2', text:[
  `Женщина в пальто стоит у турникетов, прижимая к уху комм.`,
  `— Там были документы, — говорит она кому-то. — Все документы.`,
  `Ты знаешь, что такое потерять документы в Ноктисе. Все знают.`,
], choices:[
  {t:`Подойти и описать ей мальчишку.`, eff:{moral:1, flag:'lostThief'}, res:[
    `Ты описываешь: оранжевые импланты, куртка не по размеру, побежал к южному выходу. Она записывает, кивает, и на секунду в её лице появляется что-то человеческое. — Спасибо. Хоть кто-то попытался.`,
  ], next:'u1'},
  {t:`Уйти на монорельс. Ты сделал, что мог.`, hint:`Ничего не изменится.`, eff:{flag:'lostThief'}, res:[
    `Двери вагона закрываются. Гордость ноет сильнее, чем всё остальное. Ноктис едет дальше.`,
  ], next:'u1'},
]},

/* ---------- СЦЕНА 3. УНИВЕРСИТЕТ ---------- */
u1:{scene:'s3', head:true, text:[
  {when:s=>s.flags.late, text:`Ты влетаешь в лабораторию 4-Б последним. Староста смотрит на тебя так, будто ты лично виноват в дожде.`},
  {when:s=>!s.flags.late, text:`Ты приходишь в лабораторию 4-Б за десять минут до начала и занимаешь лучшее место: у окна, подальше от вытяжки.`},
  {when:s=>s.flags.releasedKid || s.flags.knowsGrach, text:`Из головы не идёт мальчишка со станции. «Меня Грач убьёт». Интересно, сколько таких мальчишек бегает по Ноктису.`},
  {when:s=>s.flags.handedKid, text:`Тридцать кредитов в кармане почему-то не радуют. Ты всё ещё слышишь, как на запястье мальчишки щёлкает браслет.`},
  {when:s=>s.flags.ignoredThief, text:`Ты стараешься не думать о женщине у турникетов. Получается плохо.`},
  {when:s=>s.flags.lostThief, text:`После погони до сих пор ноет всё, что может ныть. Воришка ушёл, но ты хотя бы попытался.`},
  `Половина оборудования здесь списанные подарки корпораций: на каждом стенде логотип, на каждом логотипе улыбка. Над твоим столом табличка «Дар Церебры будущим инженерам».`,
  `Сегодня практикум по нейроинтерфейсам. Стенд, на котором должна работать вся группа, мёртв. Преподаватель опаздывает, староста паникует, а оценка за практикум идёт в итоговую.`,
  `— Место свободно? — Рядом садится девушка, которую ты раньше не видел. Тёмные волосы собраны в небрежный узел, на запястье старый коммуникатор, перемотанный изолентой. — Дана. Ортега. Перевелась на прошлой неделе. — Она кивает на стенд. — Он всегда такой дохлый?`,
], choices:[
  {t:`Полезть в стенд самому.`, check:{stat:'tech', v:6},
    ok:{hint:`Починишь на глазах у всей группы`, eff:{rel:{dana:1}, strange:1, flag:'danaSawStand'}, res:[
      `Ты снимаешь боковую панель. Внутри классика: пыль и отошедший шлейф. Ты вставляешь его на место, щёлкаешь фиксатором, и экран загорается. Бегут строчки загрузки, мигает логотип Церебры, белый и стерильный, как больничный свет.`,
      `Группа аплодирует. Староста выдыхает так, будто его только что помиловали.`,
      `Дана смотрит не на экран. Она смотрит на тебя, очень внимательно. — Быстро, — говорит она. — Ты такие уже чинил?`,
    ]},
    fail:{hint:`Провозишься без толку`, eff:{rel:{dana:0}}, res:[`Ты возишься с панелью, но стенд так и не оживает.`]},
    next:'u2'},
  {t:`Предложить Дане разобраться вместе.`, eff:{rel:{dana:2}, flag:'fixedWithDana'}, res:[
    `— Хочешь проверить, кто из нас лучше в железе? — Это вызов? — Это приглашение. Звучит одинаково, я знаю.`,
    `Вы ковыряетесь вдвоём минут пятнадцать. Дана знает теорию лучше тебя, ты знаешь, где у таких стендов обычно отваливаются шлейфы. Когда экран загорается, она улыбается, впервые, и сразу прячет улыбку, будто её поймали.`,
  ], next:'u2'},
  {t:`Подождать преподавателя. Не твоя зона ответственности.`, eff:{rel:{dana:0}, flag:'waitedStand'}, res:[
    `Ты откидываешься на стуле. Преподаватель приходит через двадцать минут, ругается на стенд, на погоду и на корпорации, чинит за пять минут и ставит всей группе «удовлетворительно».`,
    `Дана весь практикум что-то пишет в свой перемотанный коммуникатор.`,
  ], next:'u2'},
]},

u2:{scene:'s3', text:[
  `После пары Дана догоняет тебя в коридоре.`,
  {when:s=>s.flags.danaSawStand, text:`— Слушай, ты его за минуту оживил. Преподаватель бы полчаса возился.`},
  {when:s=>s.flags.fixedWithDana, text:`— А ты неплохо соображаешь. Для человека с дыркой на локте.`},
  {when:s=>s.flags.waitedStand, text:`— Ты весь практикум смотрел в окно. Скучно было?`},
  `— Где ты вообще научился возиться с железом?`,
], choices:[
  {t:`Честно: «В мастерской у отца. Он чинит всё, что можно починить, и немного того, что нельзя».`, eff:{rel:{dana:1}, flag:'toldDanaWorkshop'}, res:s=>[
    `— Мастерская, — повторяет она, будто пробует слово на вкус. — Где?`,
    `— Южные кварталы, под эстакадой. Заходи, если сломается что-нибудь дорогое. Или дешёвое. Мы не гордые.`,
    `Она смеётся и что-то быстро помечает в коммуникаторе. Наверное, адрес. Приятно, когда тобой интересуются.`,
    s.stats.mind>=6 ? {tag:'Рассудок', text:`Хотя странно: адрес она записала, а номер так и не спросила.`} : null,
    `Остаток дня тянется, как все первые дни: списки, расписания, преподаватели, которые обещают, что «в этом году будет сложно». Домой ты выходишь, когда над Ноктисом уже зажигаются вывески.`,
  ], next:{road:true, then:'w0'}},
  {t:`Отшутиться: «Ролики в сети. Двести часов котиков и немного пайки».`, check:{stat:'charm', v:4},
    ok:{hint:`Дана оценит шутку`, eff:{rel:{dana:1}}, res:[
      `Дана фыркает, потом смеётся по-настоящему. — Ладно, котовед. Увидимся в четверг.`,
      `Остаток дня тянется, как все первые дни: списки, расписания, преподаватели, которые обещают, что «в этом году будет сложно». Домой ты выходишь, когда над Ноктисом уже зажигаются вывески.`,
    ]},
    fail:{hint:`Шутка может не зайти`, res:[
      `Шутка выходит так себе. Дана вежливо улыбается той улыбкой, которой улыбаются кассирам. — Ясно. Ну, увидимся.`,
      `Ты ещё минуту стоишь в коридоре и мысленно переписываешь реплику. Во второй версии ты гораздо смешнее. Домой ты выходишь вечером, так и не придумав третью.`,
    ]},
    next:{road:true, then:'w0'}},
  {t:`Уйти от ответа: «Да так, само как-то».`, hint:`Дана останется без ответа. Надолго ли?`, eff:{flag:'dodgedDana'}, res:s=>[
    `Она не настаивает. — Само так само.`,
    s.stats.mind>=6 ? {tag:'Рассудок', text:`Но когда ты оборачиваешься у лестницы, Дана всё ещё стоит в коридоре и смотрит тебе вслед, прижав коммуникатор к губам. Будто что-то надиктовывает.`} : `Когда ты оборачиваешься у лестницы, коридор уже пуст.`,
    `Остаток дня тянется, как все первые дни. Домой ты выходишь, когда над Ноктисом уже зажигаются вывески.`,
  ], next:{road:true, then:'w0'}},
]},

/* ---------- ДОРОГА ДОМОЙ (одно случайное событие) ---------- */
rd_train:{scene:'rd_train', head:true, text:[
  {when:s=>s.road.length<2, text:`Домой ты едешь вечерним монорельсом. Он полупустой. Ты стоишь у двери и смотришь, как огни Ноктиса стекают по стеклу вместе с дождём, и думаешь о том, что день был длинный.`},
  {when:s=>s.road.length>=2, text:`С рынка ты едешь последним монорельсом. Вагон почти пустой, локтевой узел оттягивает карман, огни Ноктиса стекают по стеклу вместе с дождём.`},
  `Краем глаза замечаешь, что мужчина в мятом плаще придвигается ближе. Слишком близко для полупустого вагона. Его рука скользит к твоему карману, где лежат комм и все деньги до конца недели.`,
], choices:[
  {t:`Перехватить руку.`, check:{stat:'agi', v:5},
    ok:{hint:`Поймаешь его за руку`, eff:{flag:'scanner'}, res:[
      `Ты ловишь его запястье раньше, чем он успевает что-то вытащить. Секунду вы смотрите друг на друга.`,
      `— Станция «Рынок», — объявляет автомат. Мужчина вырывается и выскакивает в открывшиеся двери, оставив на полу дешёвый сканер-отмычку. Ты подбираешь его. Пригодится.`,
    ]},
    fail:{hint:`Он окажется быстрее`, eff:{money:-20}, res:[
      `Ты дёргаешься, но он быстрее. На «Рынке» мужчина выходит, а твой карман становится легче на двадцать кредитов.`,
      `Комм, к счастью, на месте. Видимо, модель слишком старая, чтобы её воровать.`,
    ]},
    next:'@after'},
  {t:`Громко сказать: «Мужик, у тебя рука в моём кармане».`, check:{stat:'will', v:4},
    ok:{hint:`Вор сбежит ни с чем`, res:[
      `Ты говоришь это громко и спокойно, как о погоде. Весь вагон оборачивается. Мужчина краснеет, бормочет что-то про давку (в пустом вагоне) и выходит на следующей.`,
      `Пожилая женщина с сумкой-тележкой показывает тебе большой палец.`,
    ]},
    fail:{hint:`Голос может подвести`, eff:{money:-20}, res:[`Голос срывается на середине фразы. Мужчина ухмыляется и выходит на следующей. С твоими двадцатью кредитами.`]},
    next:'@after'},
]},

rd_shop:{scene:'rd_shop', head:true, text:[
  {when:s=>s.road.length<2, text:`Мать на смене до полуночи, так что по дороге домой ты заходишь в круглосуточный за лапшой на всех.`},
  {when:s=>s.road.length>=2, text:`По дороге с рынка ты заходишь в круглосуточный за водой: во рту до сих пор горит от рыночной еды.`},
  `Автомат с напитками у входа глотает твою последнюю монету, мигает и ничего не выдаёт.`,
  `Продавец не отрывается от сериала: — Он всегда так. Пни его. Слева. Нет, правее.`,
], choices:[
  {t:`Пнуть автомат, как советуют.`, check:{stat:'body', v:4},
    ok:{hint:`Автомат сдастся`, res:[
      `Ты бьёшь туда, куда показали. Автомат издаёт звук умирающего кита и выплёвывает банку. И ещё одну. И ещё три.`,
      `Продавец наконец отрывается от сериала. — Ну, — говорит он, — это уже воровство. — И возвращается к сериалу.`,
    ]},
    fail:{hint:`Пострадает нога, не автомат`, res:[`Ты бьёшь. Автомат не реагирует. Нога реагирует.`]},
    next:'@after'},
  {t:`Открыть заднюю панель и разобраться.`, req:{stat:'tech', v:5}, res:[
    `Ты снимаешь панель. Монетоприёмник забит: кто-то пытался протолкнуть в него гнутую шайбу, и всё, что бросали после, копилось за ней. Ты выковыриваешь шайбу, и в ладонь высыпается горсть монет. Раз в десять больше, чем ты бросал.`,
    `Продавец не видит: у героя сериала как раз драма.`,
  ], next:'rd_shop2'},
  {t:`Махнуть рукой и уйти без банки.`, hint:`Ничего не изменится. Кроме твоего кошелька.`, res:[
    `Монета остаётся в автомате навсегда. Где-то там, внутри, копится целое состояние из монет таких же смирившихся людей.`,
  ], next:'@after'},
]},

rd_shop2:{scene:'rd_shop', text:[
  `Двадцать кредитов мелочью. Для тебя это неделя обедов. Для «Лакки 24», судя по облезлым стенам, тоже.`,
], choices:[
  {t:`Оставить себе. Автомат первый начал.`, eff:{money:20, moral:-1, flag:'keptCoins'}, res:[
    `Ты ссыпаешь монеты в карман. Они звенят при каждом шаге до самого дома. Громче, чем должны.`,
  ], next:'@after'},
  {t:`Вернуть лишнее продавцу.`, eff:{moral:1, rel:{street:1}, flag:'returnedCoins'}, res:[
    `Продавец смотрит на горсть монет, потом на тебя, потом снова на монеты. — Ты откуда такой? — Из мастерской Вельтов. — А. Томаша сын. — Он кивает, как будто это всё объясняет, и суёт тебе банку газировки. Бесплатно.`,
  ], next:'@after'},
]},

rd_alley:{scene:'rd_alley', head:true, text:[
  {when:s=>s.road.length<2, text:`Чтобы успеть домой к ужину, ты срезаешь через переулок за ночным рынком.`},
  {when:s=>s.road.length>=2, text:`С рынка ты уходишь переулком: так короче и меньше шансов встретить людей Грача.`},
  `Под козырьком закрытой лавки сидит мужчина, его трясёт. Левая рука, дешёвый протез, дёргается сама по себе: пальцы сжимаются и разжимаются, как у сломанной куклы.`,
  `— Сбой… — хрипит он. — Прошивка… Не трогай, укусит…`,
], choices:[
  {t:`Попробовать отключить протез.`, check:{stat:'tech', v:6},
    ok:{hint:`Найдёшь сервисный порт`, eff:{moral:1, rel:{street:1}, flag:'rafaFriend'}, res:[
      `Ты находишь сервисный порт под манжетой и замыкаешь контакты скрепкой. Протез обмякает. Мужчина долго дышит, глядя в небо.`,
      `— Спасибо, парень. Меня Рафа зовут. Я на рынке жареную лапшу продаю. Для тебя бесплатно. Навсегда. Ну, пока не разорюсь.`,
    ]},
    fail:{hint:`Протез окажется слишком дешёвым`, eff:{moral:1}, res:[`Ты ищешь сервисный порт, но протез слишком дешёвый, чтобы его иметь. В итоге вы вдвоём держите руку, пока прошивка не перезагрузится сама.`]},
    next:'@after'},
  {t:`Вызвать скорую и дождаться её.`, eff:{money:-15, moral:1}, res:s=>[
    `Скорая в Южные кварталы едет сорок минут и берёт плату за вызов с того, кто вызвал. Ты ждёшь рядом. Мужчина всё время извиняется.`,
    s.road.length<2 ? `К ужину ты, конечно, опаздываешь.` : `Домой ты возвращаешься далеко за полночь.`,
  ], next:'@after'},
  {t:`Пройти мимо.`, eff:{moral:-1}, res:[
    `Ты ускоряешь шаг. Позади звон: протез бьёт по жестяной витрине. Ещё раз. И ещё. Потом тишина.`,
    `Ты не оборачиваешься.`,
  ], next:'@after'},
]},

/* ---------- СЦЕНА 4. ВЕЧЕР И НОЧЬ ---------- */
w0:{scene:'s4', head:true, text:[
  `Дома пахнет подгоревшим луком и канифолью. Мать на смене, так что ужин — это то, что отец назвал «рагу», а Ника назвала «уликой».`,
  {when:s=>s.flags.toldDanaWorkshop, text:`Ника, конечно, первым делом вытягивает из тебя новости. Узнав, что ты дал какой-то однокурснице адрес мастерской, она расплывается в улыбке: — У Лео девушка!`},
  {when:s=>s.flags.toldDanaWorkshop, text:`Отец поднимает глаза от тарелки. Он не улыбается. — Какая однокурсница? — Дана. Новенькая, перевелась. — Перевелась откуда? — Не знаю, пап. Какая разница? Отец молчит. Потом говорит: — Никакой. Ешь.`},
  {when:s=>s.flags.handedKid, text:`Ты рассказываешь про воришку на станции. Ника в восторге. Отец слушает молча и, когда ты доходишь до патрульного дрона, отводит глаза. — Патрулю, значит, — говорит он. — Ну. Закон есть закон.`},
  {when:s=>s.flags.releasedKid, text:`Ты рассказываешь про воришку на станции. Отец дослушивает до места, где ты отпустил мальчишку, и неожиданно кивает: — Правильно. Патруль в Южных кварталах ещё никого не сделал лучше.`},
  `Весь вечер отец сам не свой: дважды проверяет замок на рольставне, поглядывает на часы и в десять отправляет вас с Никой спать, чего не делал лет пять.`,
  `— Это из-за твоего старого знакомого? — спрашиваешь ты. — Спать, — отвечает он.`,
  {tag:'Рассудок', when:s=>s.stats.mind>=6 && (s.flags.askedParents || s.flags.jokedDocs), text:`Утреннее радио, «сплошная проверка», побелевшие костяшки матери, теперь это. Для одного дня совпадений многовато.`},
], choices:[
  {t:`Лечь спать, как сказали.`, hint:`Ночь пройдёт как обычно. Наверное.`, res:[
    `Ты ложишься и долго слушаешь дождь. Потом перестаёшь слушать.`,
  ], next:'w1'},
  {t:`Сделать вид, что лёг, и не спать.`, hint:`Узнаешь, кто придёт ночью. Если не уснёшь.`, check:{stat:'will', v:4},
    ok:{hint:`Дождёшься гостя`, eff:{flag:'stayedUp'}, res:[`Ты гасишь свет и лежишь с открытыми глазами. Час. Два. Дом затихает. Ты не спишь.`]},
    fail:{hint:`Сон победит`, res:[`Ты гасишь свет, чтобы полежать с открытыми глазами. Через десять минут глаза закрываются сами.`]},
    next:'w1'},
  {t:`Заглянуть к Нике и спросить, что она думает.`, eff:{rel:{nika:1}, flag:'nikaMove'}, res:[
    `Ника сидит на кровати в твоей толстовке и листает что-то в комме. — Папа так себя вёл перед тем, как мы переехали, — говорит она, не поднимая глаз. — Мне было шесть.`,
    `— Мы переезжали? — Ну да, из Северного района. Ты что, не помнишь? Тебе же было уже десять.`,
    `Ты не помнишь. Совсем. Ника пожимает плечами: — Может, у тебя память дырявая. Спокойной ночи, дырявая память.`,
  ], next:'w1'},
]},

w1:{scene:'s4', text:[
  {when:s=>s.flags.stayedUp, text:`В 02:40 раздаётся стук. Ты не спишь и поэтому слышишь всё: не в дверь, а в рольставню мастерской, три удара, пауза, ещё два.`},
  {when:s=>!s.flags.stayedUp, text:`В 02:40 тебя будит стук. Не в дверь, а в рольставню мастерской: три удара, пауза, ещё два.`},
  `Ты спускаешься в носках и видишь, как отец поднимает ставню ровно настолько, чтобы внутрь пролез человек. Человек пролезает с трудом. Он огромный, мокрый, и его правая рука от плеча до кончиков пальцев — военный протез, тяжёлый, с маркировкой, которую кто-то старательно сточил.`,
  `— Томаш, — говорит гость. — Барро, — отвечает отец. Тот самый «старый знакомый». Похоже, отец ему не рад.`,
  `Отец замечает тебя на лестнице. — Лео. Раз уж проснулся, подержи свет. И пожалуйста, — он смотрит тебе в глаза, — никаких вопросов.`,
], choices:[
  {t:`Держать свет и молчать.`, eff:{rel:{dad:1}}, res:[
    `Ты держишь лампу. Отец работает быстро и молча, как хирург. Ты никогда не видел, чтобы он так работал: без ругани, без шуток, без единого лишнего движения.`,
    `Барро смотрит на тебя поверх отцовской головы. Долго. — Сын? — спрашивает он. — Сын, — отвечает отец, не поднимая глаз.`,
  ], next:'w2'},
  {t:`Всё-таки заговорить с гостем.`, check:{stat:'charm', v:4},
    ok:{hint:`Барро что-нибудь расскажет`, eff:{rel:{dad:-1}, flag:'heardRumor'}, res:[
      `— Хорошая рука, — говоришь ты. — Армейская? Барро хмыкает. — Была. Как и я.`,
      `Потом, помолчав: — Томаш, в квартале люди ходят. Спрашивают про беглых из больших лабораторий. Платят хорошо.`,
      `Отвёртка в руке отца замирает на полсекунды. — Нас это не касается, — говорит он. — Держи свет ровнее, Лео.`,
    ]},
    fail:{hint:`Барро промолчит, отец рассердится`, eff:{rel:{dad:-1}}, res:[
      `— Хорошая рука, — говоришь ты. — Армейская? Барро смотрит на тебя как на муху, которая заговорила. Не отвечает.`,
      `Отец цедит сквозь зубы: — Свет, Лео.`,
    ]},
    next:'w2'},
  {t:`Вернуться наверх, раз просили не лезть.`, eff:{rel:{dad:-1}, flag:'wentUp'}, res:[
    `— Ладно, пап. Отец кивает, не глядя.`,
    `Уже на верхней ступеньке ты слышишь, как гость тихо говорит: — Большой вырос. Ответа отца не слышно. Уснуть не получается.`,
  ], next:'w2'},
]},

w2:{scene:'s4', mood:'tense', text:[
  {when:s=>!s.flags.wentUp, text:`Отец подключает к протезу диагностический кабель, и рука оживает. Не так, как должна. Пальцы растопыриваются, сервоприводы воют, и огромная механическая кисть смыкается у отца на горле.`},
  {when:s=>s.flags.wentUp, text:`Снизу доносится вой сервоприводов и хрип. Ты скатываешься по лестнице. Огромная механическая кисть уже сжимает отцу горло.`},
  `Барро рычит, пытаясь оттащить собственную руку второй, живой. — Не могу… Она не слушается… Томаш!`,
  `Лицо отца наливается тёмной кровью.`,
], choices:[
  {t:`Повиснуть на протезе всем весом.`, check:{stat:'body', v:5},
    ok:{hint:`Освободишь отца своими силами`, res:[
      `Ты виснешь на руке, и она поддаётся на сантиметр, на два, достаточно, чтобы отец вдохнул и дотянулся до разъёма. Кабель выдернут. Рука падает, как мёртвая.`,
      `Отец сидит на полу и кашляет. Барро смотрит на тебя с уважением: — Крепкий малый.`,
    ]},
    fail:{hint:`Рука отшвырнёт тебя`, eff:{strange:1, flag:'froze'}, res:[
      `Ты виснешь на руке всем весом. Рука этого даже не замечает. Она дёргает плечом, и ты летишь через полмастерской в стеллаж с деталями. Бок взрывается болью.`,
      `Сквозь звон в ушах ты видишь, как отец синеет. Ты кричишь, сам не понимая что.`,
      `И в ту же секунду в мастерской гаснет свет.`,
      `Сервоприводы взвизгивают и замолкают. Темнота. Тишина. Хрип отца, потом кашель. Когда над дверью начинает мигать аварийная лампа, рука Барро висит мёртвым грузом, а отец сидит на полу и держится за горло.`,
    ]},
    next:'w3'},
  {t:`Выдернуть силовой кабель из стены.`, check:{stat:'agi', v:5},
    ok:{hint:`Обесточишь протез`, res:[
      `Кабель тянется через всю мастерскую. Ты перелетаешь через верстак и срываешь его со стены вместе с розеткой. Протез дёргается и замирает.`,
      `Отец падает на колени и кашляет, кашляет, кашляет.`,
    ]},
    fail:{hint:`Не дотянешься до кабеля`, eff:{strange:1, flag:'froze'}, res:[
      `Ты прыгаешь через верстак, цепляешься ногой и падаешь. Кабель в метре от тебя. Отец хрипит. Ты кричишь.`,
      `И в ту же секунду в мастерской гаснет свет.`,
      `Сервоприводы взвизгивают и замолкают. Когда над дверью начинает мигать аварийная лампа, рука Барро висит мёртвым грузом. Кабель по-прежнему в розетке.`,
    ]},
    next:'w3'},
  {t:`Найти аварийный сброс протеза.`, hint:`У военных протезов он где-то есть. Вопрос, где.`, check:{stat:'tech', v:7},
    ok:{hint:`Отключишь руку отвёрткой`, eff:{rel:{dad:1}, flag:'foundReset'}, res:[
      `Ты вспоминаешь схему из отцовских журналов: аварийный сброс у армейских моделей прячут под локтевой пластиной. Ты вгоняешь отвёртку в щель, нажимаешь, и рука обмякает.`,
      `Отец падает на колени и кашляет. Барро смотрит на тебя: — Откуда знаешь? — Журналы, — хрипит отец вместо тебя. — Он читает мои журналы.`,
    ]},
    fail:{hint:`Не найдёшь сброс вовремя`, eff:{strange:1, flag:'froze'}, res:[
      `Ты шаришь отвёрткой по пластинам: локоть, запястье, плечо. Сброса нигде нет. Отец хрипит всё тише. Ты кричишь.`,
      `И в ту же секунду в мастерской гаснет свет.`,
      `Сервоприводы взвизгивают и замолкают. Когда над дверью начинает мигать аварийная лампа, рука Барро висит мёртвым грузом.`,
    ]},
    next:'w3'},
  {t:`Закричать: «ХВАТИТ!»`, hint:`Ни силы, ни плана. Только крик.`, eff:{strange:1, flag:['froze','shouted']}, res:[
    `— ХВАТИТ!`,
    `Это даже не слово. Это что-то, что вырывается из тебя вместе с воздухом, откуда-то из-под рёбер.`,
    `И в ту же секунду в мастерской гаснет свет.`,
    `Сервоприводы взвизгивают и замолкают. Темнота. Тишина. Хрип отца, потом кашель. Когда над дверью начинает мигать аварийная лампа, рука Барро висит мёртвым грузом, а отец сидит на полу, держится за горло и смотрит на тебя.`,
  ], next:'w3'},
  {t:`Отключить его. Не руку — его самого. Всю нервную систему разом, как рубильник. Мысль приходит откуда-то снизу, холодная и чужая, и от неё начинает тошнить.`, thought:true},
]},

w3:{scene:'s4', text:[
  {when:s=>s.flags.froze, text:`Свет дают через минуту: в щитке выбило автомат. Отец долго смотрит на щиток. Потом на тебя. — Скачок напряжения, — говорит он Барро. — Старая проводка.`},
  {when:s=>s.flags.froze, text:`Барро кивает. Но у ставни оборачивается: — Береги сына, Томаш, — говорит он тихо. — Очень береги.`},
  {when:s=>!s.flags.froze, text:`Барро уходит через полчаса. — Спасибо, малый, — бросает он тебе на прощание. — Реакция что надо.`},
  `На верстаке остаётся пачка кредитов, вдвое больше, чем стоит ремонт.`,
  `Потом вы с отцом сидите на кухне. Три часа ночи. Отец греет руки о чашку, на шее у него наливаются синяки в форме пальцев. Чай остывает. Никто не идёт спать.`,
], choices:[
  {t:`Спросить, что это было.`, hint:`Отец может сказать правду. А может и нет.`, eff:{flag:'askedWhat'}, res:s=>[
    `— Пап. Что это было?`,
    `Отец долго смотрит в чашку. — Старая рука, — говорит он наконец. — Паршивая прошивка. Скачок напряжения. Бывает. — Он поднимает глаза. — Бывает, Лео. Ты мне веришь?`,
    s.flags.froze ? `Ты вспоминаешь темноту и тишину, в которой замерла рука. Скачок напряжения. Конечно. Ты киваешь.` : `Ты смотришь на синяки у него на шее. Ты киваешь. Ты не веришь.`,
  ], next:'m0'},
  {t:`Просто сесть рядом.`, eff:{rel:{dad:1}, flag:'dadLove'}, res:[
    `Ты садишься рядом и ничего не говоришь. Отец тоже. Через какое-то время он кладёт тяжёлую тёплую ладонь тебе на затылок, как делал, когда ты был маленьким, и держит так, пока не остынет чай.`,
    `— Я тебя люблю, — говорит он. — Что бы ни было. Помни.`,
    `Это звучит как прощание, и тебе становится страшно.`,
  ], next:'m0'},
  {t:`Пошутить.`, hint:`Смех иногда помогает. А иногда выдаёт больше слов.`, eff:{flag:'notMine'}, res:[
    `— Ну, — говоришь ты, — зато клиент заплатил вдвое. Может, будем всем руки ломать?`,
    `Отец смеётся. Сначала через силу, потом по-настоящему, до слёз, до кашля, держась за горло. — Ты невозможный, — говорит он. — Весь в мать.`,
    `Ты почему-то запоминаешь, что он не сказал «весь в меня».`,
  ], next:'m0'},
]},

/* ---------- СЦЕНА 5. ПОРУЧЕНИЕ И НОЧНОЙ РЫНОК ---------- */
m0:{scene:'s5', head:true, text:[
  `Две недели проходят так, как проходят все недели после чего-то странного: ты всё ждёшь продолжения, а его нет. Пары, практикумы, мастерская, дождь.`,
  {when:s=>s.flags.froze, text:`Про ту ночь отец не говорит. Только однажды ты застаёшь его у электрощитка: он стоит и смотрит на выбитый тогда автомат, будто тот может ему что-то объяснить.`},
  {when:s=>!s.flags.froze, text:`Синяки на шее отца желтеют, потом бледнеют. Про ту ночь он не говорит, а ты не спрашиваешь.`},
  {when:s=>(s.rel.dana||0)>=2, text:`С Даной вы теперь сидите вместе на всех практикумах. Она смешно ругается на преподавателей и никогда ничего не рассказывает о себе. Ты замечаешь это не сразу.`},
  {when:s=>('dana' in s.rel) && s.rel.dana<2, text:`Дана здоровается с тобой в коридорах, но держится на расстоянии. Иногда тебе кажется, что она смотрит тебе в спину.`},
  `В пятницу вечером отец кладёт на верстак свёрток, перетянутый изолентой.`,
  `— Ночной рынок, задняя линия, будка с зелёной лампой. Спросишь Тео. Отдашь это, заберёшь то, что он даст. Барро нужен новый локтевой узел, а такие есть только у Тео.`,
  `— А сам почему не сходишь? — Меня там слишком хорошо помнят, — говорит отец и не объясняет, хорошо это или плохо.`,
  `Тео ты помнишь смутно: сухой смешливый старик с мутным искусственным глазом. Он приходил, когда тебе было лет двенадцать, и подарил тебе первый паяльник.`,
  `— Я с тобой! — объявляет Ника с лестницы. — Нет, — хором отвечаете вы с отцом.`,
], choices:[
  {t:`Взять Нику с собой: под присмотром ей ничего не будет.`, eff:{rel:{nika:1, dad:-1}, flag:'nikaCame'}, res:[
    `— Под мою ответственность, пап.`,
    `Отец долго смотрит на тебя, потом на Нику. — Под твою. Если с ней что-то случится, я тебя… — Знаю, знаю. Ника уже натягивает кроссовки, твою толстовку и самую невинную улыбку в Южных кварталах.`,
  ], next:'m1'},
  {t:`Отказать: ночной рынок не место для пятнадцатилетней.`, hint:`Отец будет доволен. Ника — нет.`, eff:{rel:{nika:-1, dad:1}, flag:'nikaSneaked'}, res:[
    `— Нет, Ника. Правда нет.`,
    `Ника смотрит на тебя как на предателя всего человечества и хлопает дверью своей комнаты так, что с полки падает отвёртка.`,
    `Уже на улице ты не замечаешь, что свет в её окне погас подозрительно быстро.`,
  ], next:'m1'},
  {t:`Договориться: она остаётся, а ты приносишь ей лапшу с рынка.`, check:{stat:'charm', v:4},
    ok:{hint:`Ника согласится`, eff:{flag:'nikaDeal'}, res:[
      `— Двойная порция. С острым соусом. И ты неделю моешь ванную. — Три дня. — Пять. — Договорились.`,
      `Ника пожимает тебе руку с видом торговца оружием. Отец одобрительно хмыкает.`,
    ]},
    fail:{hint:`Ника не купится`, eff:{rel:{nika:-1}, flag:'nikaSneaked'}, res:[
      `— Лапшу? Серьёзно? Мне не десять лет. — Ника уходит к себе с видом оскорблённой королевы.`,
      `Уже на улице ты не замечаешь, что свет в её окне погас подозрительно быстро.`,
    ]},
    next:'m1'},
]},

m1:{scene:'s5', text:[
  `Ночной рынок начинается там, где кончаются фонари, и светится ярче любой рекламы в деловом центре. Навесы из пластика, гирлянды ламп, пар из кастрюль, запах жареного теста и палёной изоляции. Здесь продают всё: лапшу, импланты, чужие воспоминания на кристаллах, «почти новые» глаза.`,
  {when:s=>s.flags.nikaCame, text:`Ника держится за твой рукав первые десять метров. Потом отпускает и начинает вертеть головой так, что ты боишься за её шею.`},
  {when:s=>s.flags.rafaFriend, text:`— Эй, мастер! — из облака пара машет Рафа, тот самый, с протезом. Рука у него теперь ходит как новая. Он суёт тебе картонку с лапшой и, узнав, куда ты идёшь, понижает голос: — К Тео? Тео честный. Пока тебе от него ничего не нужно. Запомни.`},
  {when:s=>s.flags.nikaDeal, text:`Лапшу для Ники ты возьмёшь на обратном пути. Главное не забыть, иначе мыть тебе ванную до Нового года.`},
  `Задняя линия — узкий проход между рядами, где лампы висят реже, а продавцы смотрят внимательнее.`,
], choices:[
  {t:`Держать Нику рядом и идти прямо к Тео.`, show:s=>s.flags.nikaCame, res:[
    `— Не отставай. — Я не отстаю, я исследую. — Исследуй ближе.`,
  ], next:s=>s.flags.handedKid ? 'm2h' : (s.flags.releasedKid || s.flags.knowsGrach) ? 'm2f' : 't1'},
  {t:`Разрешить Нике пять минут у лотка со светящимися татуировками.`, show:s=>s.flags.nikaCame, hint:`Нике понравится. Маме — вряд ли.`, eff:{rel:{nika:1}, flag:'nikaTattoo'}, res:[
    `Через пять минут у Ники на запястье светится крошечная голубая рыбка. Через шесть она показывает её тебе в двадцатый раз.`,
    `Матери вы это объясните как-нибудь потом. Желательно никогда.`,
  ], next:s=>s.flags.handedKid ? 'm2h' : (s.flags.releasedKid || s.flags.knowsGrach) ? 'm2f' : 't1'},
  {t:`Идти к задней линии.`, show:s=>!s.flags.nikaCame, res:[
    `Ты сворачиваешь с шумного ряда, и гул рынка сразу становится тише, будто кто-то убавил громкость.`,
  ], next:s=>s.flags.handedKid ? 'm2h' : (s.flags.releasedKid || s.flags.knowsGrach) ? 'm2f' : 't1'},
]},

m2h:{scene:'s5', text:[
  `Проход перегораживают трое. Двое постарше, лет по шестнадцать, а между ними тот самый мальчишка со станции. Оранжевые зрачки узнают тебя раньше, чем ты его. Браслета на запястье уже нет: в Южных кварталах патрульные браслеты снимают за полчаса и за десятку.`,
  `— Это он, — говорит мальчишка. — Который сдал.`,
  `Старший сплёвывает тебе под ноги. — Грач передаёт привет. И счёт.`,
  {when:s=>s.flags.nikaCame, text:`Ника за твоей спиной перестаёт дышать.`},
], choices:[
  {t:`Стоять и смотреть им в глаза.`, check:{stat:'will', v:4},
    ok:{hint:`Они отступят первыми`, eff:{flag:'grachDebt'}, res:[
      `Ты не двигаешься. Секунда, две, пять. Старший первым отводит взгляд: драк на задней линии Тео не любит, а Тео здесь принято слушаться.`,
      `— Ещё увидимся, — бросает он. Они уходят. Мальчишка оглядывается дважды.`,
    ]},
    fail:{hint:`Дрогнешь`, eff:{flag:'grachDebt'}, res:[`Колени выдают тебя раньше, чем лицо. Старший толкает тебя в грудь, и ты садишься в лоток с кабелями. Они уходят, смеясь.`]},
    next:'t1'},
  {t:`Ударить первым, пока их не стало больше.`, check:{stat:'body', v:5},
    ok:{hint:`Уложишь старшего`, eff:{flag:'grachEnemy'}, res:[
      `Ты бьёшь старшего под дых, коротко и зло. Он садится на мокрый асфальт и пытается вспомнить, как дышать. Второй отступает на шаг.`,
      `— Ты покойник, — шипит старший, поднимаясь. Они растворяются между лотков. Кулак у тебя болит так, будто это ты получил.`,
    ]},
    fail:{hint:`Старший дерётся чаще, чем ты`, eff:{flag:'grachEnemy'}, res:[
      `Ты бьёшь первым. Старший, судя по всему, дерётся чаще, чем ты чинишь дроны. Через десять секунд у тебя разбита губа, а куртка порвана по шву.`,
      `Они уходят, не торопясь. Им некуда торопиться: теперь ты никуда от них не денешься.`,
    ]},
    next:'t1'},
  {t:`Сказать мальчишке, что тогда был неправ.`, check:{stat:'charm', v:4},
    ok:{hint:`Мальчишка поверит`, eff:{moral:1, flag:'grachSoftened'}, res:[
      `— Слушай. Я тогда поступил как идиот. — Ты смотришь мальчишке в глаза. — Не как вор, а как идиот. Прости.`,
      `Мальчишка моргает. Старшие переглядываются. — Пошли, — говорит мальчишка. — Он того… нормальный.`,
    ]},
    fail:{hint:`Прозвучит как издёвка`, eff:{flag:'grachDebt'}, res:[`Слова застревают в горле, и выходит почти издевательски. Старший смеётся: — Извинения свои оставь себе. Грач сам с тобой поговорит.`]},
    next:'t1'},
  {t:`Развернуться и уйти через ряды.`, check:{stat:'agi', v:5},
    ok:{hint:`Оторвёшься`, eff:{flag:'grachDebt'}, res:[`Ты ныряешь под навес, между двумя лотками, через кухню какой-то забегаловки (повар кричит тебе вслед на трёх языках) и через минуту стоишь у зелёной лампы. Хвоста нет.`]},
    fail:{hint:`Запутаешься в гирлянде`, eff:{flag:'grachDebt'}, res:[`Ты ныряешь под навес и застреваешь в гирлянде. Они догоняют, но бить не бьют, только отвешивают подзатыльник. — Бегать научись, — советует старший.`]},
    next:'t1'},
]},

m2f:{scene:'s5', text:[
  `У лотка с жареными жуками тебя дёргают за рукав. Мальчишка со станции, тот самый, с оранжевыми глазами. Живой, целый и, кажется, даже сытый.`,
  {when:s=>s.flags.releasedKid, text:`— Ты тогда меня отпустил, — говорит он. — Меня Кит зовут.`},
  {when:s=>!s.flags.releasedKid, text:`— Ты тогда со мной по-человечески говорил, — говорит он. — Меня Кит зовут.`},
  `— Ты к Тео? Я короткий путь знаю. — Он понижает голос. — Только это… Грач про тебя спрашивал. Кто такой, где живёт. Я не сказал. Но он всё равно узнает, он всё узнаёт.`,
], choices:[
  {t:`Попросить Кита предупредить, если Грач спросит снова.`, check:{stat:'charm', v:4},
    ok:{hint:`Кит согласится`, eff:{rel:{street:1}, flag:['kitFriend','kitInformant']}, res:[`— Ладно, — говорит Кит так серьёзно, будто подписывает контракт. — Ты мне, я тебе. Где тебя найти? — В мастерской Вельтов. — А, у Томаша. Знаю.`]},
    fail:{hint:`Кит пожмёт плечами`, eff:{flag:'kitFriend'}, res:[`Кит пожимает плечами: — Посмотрим. Я Грачу тоже не враг.`]},
    next:'t1'},
  {t:`Спросить, зачем ты Грачу.`, eff:{flag:['kitFriend','grachAware']}, res:[
    `— Зачем я ему? — Грач всех запоминает, кто ему мешал, — говорит Кит просто. — Ты мешал. Не бойся, он не сразу. Он сначала смотрит.`,
  ], next:'t1'},
  {t:`Сказать Киту, чтобы держался от Грача подальше.`, eff:{moral:1, flag:'kitFriend'}, res:[
    `— Держись от него подальше, слышишь? — Куда я денусь? — Кит смотрит на тебя почти снисходительно. — Грач — это как дождь. Его не обойдёшь.`,
    `Короткий путь, кстати, действительно короткий.`,
  ], next:'t1'},
]},

/* ---------- СЦЕНА 6. ТЕО ---------- */
t1:{scene:'s6', head:true, text:[
  `Будка Тео прилеплена к стене старого кинотеатра, как ласточкино гнездо. Внутри тесно от полок: платы, мотки провода, банки с винтами, три монитора, из которых работает полтора. Над всем этим горит зелёная лампа.`,
  `Тео почти такой, каким ты его помнишь: сухой, лысый, с мутным искусственным глазом, который не мигает. Морщин стало больше, а голос остался прежним, будто он постоянно чему-то радуется.`,
  `— Лео Вельт, — говорит он, не оборачиваясь. — В последний раз ты доставал мне до пояса и разобрал мой комм. Собрать, правда, не смог. — Мне было двенадцать. — Твой отец в двенадцать собрал. Ладно, давай свёрток.`,
  {when:s=>s.flags.nikaCame, text:`Тео замечает Нику и надолго задерживает на ней живой глаз. — Сестра? Вылитая Ирина. Одно лицо. — Про тебя он ничего такого не говорит.`},
  {when:s=>s.flags.froze, text:`Он взвешивает свёрток на ладони и будто между делом добавляет: — Барро заходил. Рассказывал, как ты у Томаша в мастерской кричишь. Громко, говорит. Аж пробки вылетают.`},
  {when:s=>!s.flags.froze, text:`Он взвешивает свёрток на ладони. — Барро заходил. Говорит, реакция у тебя что надо. Для инженера редкость.`},
], choices:[
  {t:`Отшутиться: «Проводка у нас старая. От чиха вылетает».`, show:s=>s.flags.froze, check:{stat:'charm', v:4},
    ok:{hint:`Тео посмеётся`, res:[`Тео смеётся, сухо и коротко, как кашляет. — Проводка, да. У Томаша всегда проводка.`]},
    fail:{hint:`Шутка выйдет натянутой`, eff:{flag:'teoSuspects'}, res:[`Шутка выходит натянутой, и ты сам это слышишь. Тео кивает: — Ну-ну. — И больше ничего не говорит.`]},
    next:'t2'},
  {t:`Спокойно пожать плечами: совпадение.`, show:s=>s.flags.froze, check:{stat:'will', v:4},
    ok:{hint:`Лицо не дрогнет`, res:[`Тео смотрит на тебя живым глазом долго, дольше, чем нужно. Ты смотришь в ответ. Потом он кивает. — Совпадение. Бывает.`]},
    fail:{hint:`Лицо выдаст`, eff:{flag:'teoSuspects'}, res:[`Ты пожимаешь плечами, но уши предательски краснеют. Тео ничего не говорит. Он просто запоминает.`]},
    next:'t2'},
  {t:`Спросить, что ещё рассказывал Барро.`, show:s=>s.flags.froze, check:{stat:'mind', v:6},
    ok:{hint:`Заметишь, как Тео себя ведёт`, eff:{flag:'teoWatching'}, res:[
      `— А что ещё он рассказывал? — Да ничего. Барро вообще мало говорит.`,
      `Тео улыбается. Но ты замечаешь, что его пальцы перестали крутить отвёртку, пока ты говорил. Он ждал твоей реакции. Это была проверка.`,
    ]},
    fail:{hint:`Ничего не узнаешь`, res:[`— Да ничего. Барро вообще мало говорит.`]},
    next:'t2'},
  {t:`Скромно пожать плечами: «Отец сам справился бы».`, show:s=>!s.flags.froze, res:[
    `— Томаш сам бы справился, — соглашается Тео. — Лет двадцать назад. Сейчас ему нужен кто-то с руками побыстрее.`,
  ], next:'t2'},
  {t:`Пошутить: «Это вы ещё не видели, как я от Ники убегаю».`, show:s=>!s.flags.froze, eff:{rel:{teo:1}}, res:[
    `Тео хохочет так, что звенят банки с винтами. — Нравишься ты мне, Лео Вельт. Томаш никогда не шутил. Томаш только ругался.`,
  ], next:'t2'},
]},

t2:{scene:'s6', text:[
  `Тео убирает свёрток под прилавок и ставит перед тобой металлическую коробку размером с ладонь. На крышке древний кодовый замок, наполовину механический.`,
  `— Локтевой узел внутри, — говорит он. — Откроешь — забирай. Не откроешь — пусть приходит отец. А отца я видеть не хочу: мы с ним поругаемся, и опять из-за ерунды.`,
], choices:[
  {t:`Вскрыть замок по всем правилам.`, check:{stat:'tech', v:7},
    ok:{hint:`Откроешь, как настоящий мастер`, eff:{rel:{teo:1}, flag:'teoTech'}, res:[
      `Ты находишь сервисный контакт под наклейкой производителя, замыкаешь его пинцетом и сбрасываешь код. Щелчок.`,
      `Тео присвистывает. — Руки Томаша. Точно его руки.`,
    ]},
    fail:{hint:`Провозишься долго`, eff:{rel:{teo:1}, strange:1, flag:'teoSawLuck'}, res:[
      `Ты возишься десять минут. Замок оказывается умнее тебя. Тео наблюдает с интересом, как за котом, который пытается открыть холодильник.`,
      `Ты уже готов сдаться и в сердцах дёргаешь крышку, и замок щёлкает. Видимо, всё-таки что-то нажал.`,
      `— Повезло? — спрашивает Тео. — Повезло. — Ну-ну, — говорит он и почему-то больше не улыбается.`,
    ]},
    next:'t3'},
  {t:`Сначала внимательно осмотреть коробку.`, check:{stat:'mind', v:6},
    ok:{hint:`Заметишь то, что пропускают другие`, eff:{rel:{teo:2}, flag:'teoMind'}, res:[
      `Ты не трогаешь замок. Вертишь коробку, смотришь на петли, на шов, на винты… Задняя стенка держится на двух винтах. Замок — декорация.`,
      `Ты откручиваешь винты ногтем и достаёшь узел. Тео долго молчит. — Большинство сразу лезут в замок, — говорит он наконец. — А ты сначала посмотрел. Это редкость. Очень полезная редкость.`,
    ]},
    fail:{hint:`Ничего не заметишь`, res:[`Ты вертишь коробку и ничего особенного не видишь. Тео открывает её сам, не объясняя как.`]},
    next:'t3'},
  {t:`Попробовать сканер-отмычку, который обронил вор в монорельсе.`, show:s=>s.flags.scanner, eff:{rel:{teo:1}, flag:'teoScanner'}, res:[
    `Ты достаёшь сканер. Тео вдруг начинает хохотать так, что дрожат мониторы.`,
    `— Откуда у тебя это? Это мой сканер! Я его месяц назад продал одному идиоту. — Идиот пытался обчистить мой карман. — Значит, сканер вернулся домой. — Тео утирает слезу живым глазом. — Оставь себе. Считай, подарок.`,
    `Замок, кстати, открывается с первого раза.`,
  ], next:'t3'},
  {t:`Отказаться: пусть отец сам приходит.`, eff:{rel:{teo:-1}}, res:[
    `— Не буду я ломать ваши коробки. Хотите отца — зовите отца.`,
    `Тео пожимает плечами и открывает коробку сам, одним движением. — Гордый. Тоже в Томаша.`,
  ], next:'t3'},
]},

t3:{scene:'s6', text:[
  `Тео кладёт локтевой узел тебе в руки, но пальцев не разжимает.`,
  `— У меня к тебе предложение, Лео. Мне нужны руки. Молодые, умные, неболтливые. По вечерам, два-три раза в неделю. Ремонт, настройка, иногда что-нибудь поинтереснее. Плачу нормально.`,
  `— Отцу, — добавляет он, — я бы на твоём месте пока не говорил. У нас с Томашем разные взгляды на то, что можно чинить.`,
  {tag:'Рассудок', when:s=>s.stats.mind>=7 || s.flags.teoWatching, text:`Он говорит легко, но смотрит на тебя так, как отец смотрит на редкую деталь, которую нашёл на свалке. Прикидывает, во что её можно вставить.`},
], choices:[
  {t:`Согласиться.`, hint:`Деньги, опыт и секрет от отца.`, eff:{rel:{teo:1}, flag:'teoJob'}, res:[
    `— По рукам.`,
    `Тео наконец отпускает узел. — Вторник, семь вечера. Опоздаешь — вычту из зарплаты, которой пока нет.`,
  ], next:s=>s.flags.nikaSneaked ? 'n1' : {road:true, then:'c1'}},
  {t:`Отказаться.`, eff:{flag:'teoRefused'}, res:[
    `— Нет, спасибо. У меня учёба и мастерская.`,
    `Тео не обижается. Кажется, он вообще не умеет обижаться. — Предложение не сгорает, — говорит он. — Я подожду. Я умею ждать.`,
  ], next:s=>s.flags.nikaSneaked ? 'n1' : {road:true, then:'c1'}},
  {t:`Спросить, что значит «поинтереснее».`, check:{stat:'charm', v:4},
    ok:{hint:`Тео ответит честно`, eff:{flag:['teoMaybe','teoHonest']}, res:[
      `— Поинтереснее — это когда замок стоит дороже того, что за ним. — Тео подмигивает мёртвым глазом, и это жутко. — Людей не граблю, не бойся. Корпорации — не люди.`,
      `Ты говоришь, что подумаешь. Тео кивает, будто другого и не ждал.`,
    ]},
    fail:{hint:`Тео отшутится`, eff:{flag:'teoMaybe'}, res:[`— Приходи — узнаешь, — улыбается Тео. Ты говоришь, что подумаешь.`]},
    next:s=>s.flags.nikaSneaked ? 'n1' : {road:true, then:'c1'}},
]},

/* ---------- НИКА У НАПЁРСТКОВ (если она сбежала на рынок) ---------- */
n1:{scene:'s6n', head:true, text:[
  `На обратном пути у лотка с напёрстками собралась толпа. Ты бы прошёл мимо, если бы не знакомый голос: — Это нечестно! Я видела!`,
  `Ника. В твоей толстовке, с мокрыми волосами и тем лицом, которое у неё бывает, когда она вот-вот заплачет, но решила не плакать. Напёрсточник, парень с золотыми пальцами-имплантами, держит в руке её комм.`,
  `— Проиграла — плати, — говорит он лениво. — Комм в залог. Придёшь с деньгами — отдам.`,
  {when:s=>s.flags.handedKid || s.flags.grachDebt || s.flags.grachEnemy, text:`За его спиной маячат знакомые куртки. Люди Грача.`},
  `Ника замечает тебя. Облегчение на её лице длится полсекунды, потом его сменяет злость: теперь ей влетит.`,
], choices:[
  {t:`Показать всей толпе, где на самом деле шарик.`, check:{stat:'mind', v:6},
    ok:{hint:`Вернёшь комм, но разозлишь людей Грача`, eff:{moral:1, rel:{nika:1}, flag:'grachAngry'}, res:[
      `Ты следишь за руками. Три перекладывания, и ты видишь, как шарик уходит под золотой ноготь. — Под пальцем, — говоришь ты громко. — Покажи пальцы.`,
      `Толпа гудит. Кто-то смеётся. Напёрсточник смотрит на тебя с такой ненавистью, что становится холодно, и швыряет Нике комм. — Забирай. И брата своего забирай.`,
    ]},
    fail:{hint:`Не уследишь`, eff:{rel:{nika:-1}, flag:'lostComm'}, res:[`Ты следишь за руками, но руки быстрее глаз. Напёрсточник ухмыляется. Комм остаётся у него.`]},
    next:'n2'},
  {t:`Забрать комм силой.`, check:{stat:'body', v:5},
    ok:{hint:`Отберёшь комм`, eff:{rel:{nika:1}, flag:'grachEnemy'}, res:[`Ты перехватываешь золотое запястье и выкручиваешь, пока пальцы не разжимаются. Комм падает Нике в ладони. Вы уходите быстро, не оборачиваясь, и тебе очень хочется обернуться.`]},
    fail:{hint:`Получишь, и комм останется у него`, eff:{flag:['grachEnemy','lostComm']}, res:[`Ты хватаешь его за руку, и золотые пальцы оказываются очень твёрдыми. Особенно когда попадают тебе в скулу. Комм остаётся у напёрсточника.`]},
    next:'n2'},
  {t:`Предложить сделку: «Левый мизинец у тебя западает. Починю — отдашь комм».`, check:{stat:'tech', v:6},
    ok:{hint:`Договоришься по-хорошему`, eff:{rel:{nika:1}, flag:'hustlerFixed'}, res:[
      `Напёрсточник подозрительно шевелит пальцами. Мизинец действительно дёргается с опозданием. — Ну, давай. Только без фокусов.`,
      `Две минуты, пинцет, капля смазки, и мизинец щёлкает как новый. Напёрсточник смотрит на него почти с нежностью и бросает Нике комм. — Приходи ещё, мастер. Мне такие руки нужны.`,
    ]},
    fail:{hint:`Не справишься`, eff:{flag:'lostComm'}, res:[`Ты ковыряешься в мизинце, но он западает ещё сильнее. — Всё, свободен, — говорит напёрсточник. Комм остаётся у него.`]},
    next:'n2'},
  {t:`Сказать: «Ещё партия. Я играю за неё».`, hint:`Рискнёшь курткой. Зато без драки и без новых счетов с Грачом.`, eff:{strange:1, rel:{nika:1}, flag:'hustlerGlitch'}, res:[
    `Ты ставишь на кон свою куртку. Напёрсточник ухмыляется и начинает перекладывать, быстро, красиво.`,
    `И вдруг золотой мизинец дёргается не вовремя. Шарик выкатывается из-под ногтя прямо на стол, у всех на глазах. Толпа взрывается хохотом. — Импланты китайские! — кричит кто-то.`,
    `Напёрсточник, красный как неон, швыряет Нике комм. Ты даже не успел ничего выбрать.`,
  ], next:'n2'},
  {t:`Просто увести Нику. Комм — не жизнь.`, eff:{rel:{nika:-1}, flag:'lostComm'}, res:[
    `Ты берёшь Нику за руку и молча ведёшь прочь. Она не сопротивляется, и это хуже, чем если бы сопротивлялась.`,
  ], next:'n2'},
]},

n2:{scene:'s6n', text:[
  `Домой вы идёте пешком и молча. Дождь смывает с рынка неон, и Южные кварталы снова становятся серыми.`,
  {when:s=>s.flags.lostComm, text:`— Там были все мои фотки, — говорит Ника в никуда. — За три года.`},
  `У самой двери она останавливается. — Папе не говори. Пожалуйста.`,
], choices:[
  {t:`Не говорить. Это останется между вами.`, hint:`Ника будет благодарна. Отец ничего не узнает.`, eff:{rel:{nika:2}, flag:'nikaSecret'}, res:[
    `— Не скажу. — Правда? — Правда. Но ты мне должна. Много.`,
    `Ника вдруг обнимает тебя, быстро и крепко, и сразу отталкивает, будто обожглась. — Ты всё равно дурак, — говорит она и уходит к себе.`,
  ], next:'c1'},
  {t:`Сказать отцу: так будет честнее.`, eff:{rel:{dad:1, nika:-2}, flag:'toldDadNika'}, res:[
    `— Прости, Ник. Он должен знать.`,
    `Ника смотрит на тебя так, что лучше бы ударила. Разговор отца с ней ты слышишь через две стены. Слов не разобрать, но голос у отца такой, каким он говорил с Барро.`,
  ], next:'c1'},
  {t:`Не говорить, но взять с неё слово, что это в последний раз.`, eff:{rel:{nika:1}, flag:'nikaPromise'}, res:[
    `— Не скажу. Но это последний раз. Дай слово. — Даю, — говорит Ника слишком быстро.`,
    `Вы оба знаете, чего стоит такое слово в пятнадцать лет. Но оно всё-таки дано.`,
  ], next:'c1'},
]},

/* ---------- СЦЕНА 7. СВЕРКА ---------- */
c1:{scene:'s7', head:true, text:[
  `Последний день сентября выпадает на субботу. Отец с утра уехал отвозить Барро локтевой узел, Ника спит, мать после ночной смены пьёт кофе, держа кружку двумя руками.`,
  {when:s=>s.flags.teoJob, text:`Ты думаешь о вторнике и о том, как будешь объяснять отцу, где пропадаешь по вечерам. Пока ничего не придумал.`},
  `В одиннадцать в рольставню стучат. Вежливо, по-казённому: ровно три раза.`,
  `На пороге мужчина в форменной куртке управы Южных кварталов, с планшетом, сканером и лицом человека, которому до обеда осталось обойти ещё сорок адресов.`,
  `— Инспектор Хольт, отдел учёта населения, — говорит он, не поднимая глаз. — Предварительная сверка перед октябрьской проверкой. Форма семь-Б, уточнение сведений о лицах, фактически проживающих по адресу. Документы, пожалуйста. Чипы, не бумагу.`,
  `Мать протягивает свой чип. Хольт подносит сканер. Сканер думает, пищит и выдаёт красное. Хольт вздыхает так, будто сканер лично его предал.`,
  `— Не читается. Формат старый. — Он что-то отмечает в планшете. — Придётся направить вас на очную сверку в управу. С полным пакетом документов на всех проживающих. Очередь, — он сверяется с планшетом, — примерно три недели.`,
  {tag:'Рассудок', when:s=>s.stats.mind>=6, text:`Мать улыбается инспектору. Но её рука на дверном косяке вцепилась в дерево так, что побелели ногти. Как тогда, с зонтом.`},
], choices:[
  {t:`Предложить починить инспектору сканер.`, check:{stat:'tech', v:6},
    ok:{hint:`Сканер заработает. Инспектор запомнит тебя.`, eff:{rel:{mom:1}, flag:'clerkKnowsLeo'}, res:[
      `— Можно? — Ты берёшь сканер. Антенна считывателя отошла от платы, классика. Ты подгибаешь контакт ногтем.`,
      `Хольт подносит чип матери ещё раз. Зелёный. «Данные подтверждены».`,
      `Хольт смотрит на сканер, потом на тебя, с выражением человека, увидевшего чудо в пятницу вечером. — Молодой человек. Вам бы к нам в техотдел. Как вас записать? — Лео Вельт. — Он записывает. Мать за его спиной закрывает глаза.`,
    ]},
    fail:{hint:`Не справишься`, eff:{flag:'inPersonCheck'}, res:[`Ты крутишь сканер, но он так и не читает чип. Хольт забирает его обратно. — Очная сверка, третье октября, девять утра. Всех касается.`]},
    next:'c2'},
  {t:`Заболтать инспектора, пока мама ищет «бумажную копию».`, check:{stat:'charm', v:4},
    ok:{hint:`Инспектор махнёт рукой`, eff:{rel:{mom:1}, flag:'visualCheck'}, res:[
      `Ты спрашиваешь Хольта, сколько адресов ему осталось. Он отвечает. Ты сочувствуешь. Через пять минут ты знаешь всё про его начальницу, его язву и систему «Учёт-4», которая «ложится, если на неё посмотреть».`,
      `Хольт ставит в планшете галочку «сверено визуально». — Хорошие вы люди, — говорит он на прощание. — Редкость.`,
    ]},
    fail:{hint:`Инспектору не до разговоров`, eff:{flag:'inPersonCheck'}, res:[`Ты пытаешься завязать разговор, но Хольт отвечает односложно и смотрит на часы. — Молодой человек, у меня сорок адресов. Очная сверка, третье октября, девять утра. Всех касается.`]},
    next:'c2'},
  {t:`Подсказать инспектору ручной ввод номера.`, check:{stat:'mind', v:6},
    ok:{hint:`Сработает, но в журнале останется отметка`, eff:{flag:'manualEntry'}, res:[
      `— Если сканер не видит старый формат, номер можно вбить вручную, — говоришь ты. — В «Учёт-4» есть такой режим, у нас в университете та же версия.`,
      `Хольт смотрит с подозрением, потом с облегчением и вбивает номер. Зелёный. — Ручной ввод, — бормочет он. — Отметится в журнале. Ну и ладно, у меня полрайона на ручном вводе.`,
    ]},
    fail:{hint:`Не вспомнишь, как это делается`, eff:{flag:'inPersonCheck'}, res:[`Ты пытаешься вспомнить меню «Учёт-4», но путаешься. Хольт теряет терпение. — Очная сверка, третье октября. Всех касается.`]},
    next:'c2'},
  {t:`Постучать по сканеру, как отец по телевизору.`, hint:`Отец всегда так делает. Быстро, без имён и без отметок в журнале.`, eff:{strange:1, rel:{mom:1}, flag:'luckyScanner'}, res:[
    `— Можно? — Ты берёшь у Хольта сканер и стучишь им о ладонь, два раза, по-отцовски. Хольт открывает рот, чтобы возмутиться, но сканер уже пищит. Зелёный. «Данные подтверждены».`,
    `— Вот что значит молодые руки, — говорит Хольт без всякого интереса, ставит галочку и уходит к следующему адресу. Имени твоего он не спрашивает.`,
    `Мать смотрит на сканер в руках уходящего инспектора. Потом на тебя. Долго.`,
  ], next:'c2'},
  {t:`Не вмешиваться. Это мамино дело.`, hint:`Мама справится сама. Как-нибудь.`, eff:{flag:'inPersonCheck'}, res:[
    `Ты молчишь. Мать улыбается Хольту и говорит, что чип, наверное, повредился в стирке. Хольт кивает с видом человека, который слышал это сто раз.`,
    `— Очная сверка, третье октября, девять утра. Всех касается.`,
  ], next:'c2'},
]},

c2:{scene:'s7', text:[
  `Когда за инспектором опускается ставня, мать садится на ступеньку лестницы и долго молчит.`,
  {when:s=>s.flags.inPersonCheck, text:`— Третье октября, — говорит она наконец. — Надо сказать отцу.`},
  {when:s=>s.flags.clerkKnowsLeo, text:`— Зачем ты назвал ему своё имя? — спрашивает она тихо. — Он же спросил. — Да, — кивает она. — Он спросил.`},
  {when:s=>s.flags.luckyScanner, text:`— Как ты это сделал? — спрашивает она. — Постучал. Как папа. — Как папа, — повторяет она и почему-то отводит глаза.`},
  {when:s=>s.flags.manualEntry || s.flags.visualCheck, text:`— Спасибо, — говорит она. — Ты даже не представляешь, как ты нас… как ты меня выручил.`},
], choices:[
  {t:`Спросить, почему она так испугалась.`, hint:`Мама может сказать правду. А может и нет.`, eff:{flag:'askedMom'}, res:[
    `— Мам. Почему ты так испугалась? Это же просто сверка.`,
    `Мать смотрит на тебя, и на секунду тебе кажется, что сейчас она скажет что-то важное. Потом она улыбается. — Потому что очная сверка — это день без зарплаты и три часа в очереди с людьми, которые кашляют. — Она встаёт и целует тебя в макушку. — Не бери в голову.`,
  ], next:'o1'},
  {t:`Сесть рядом и обнять её.`, eff:{rel:{mom:1}}, res:[
    `Ты садишься рядом. Мать кладёт голову тебе на плечо, как будто это ты взрослый, а она ребёнок.`,
    `Так вы сидите, пока наверху не просыпается Ника и не начинает на весь дом требовать завтрак.`,
  ], next:'o1'},
  {t:`Пошутить про инспектора.`, eff:{flag:'jokedClerk'}, res:[
    `— Зато у меня теперь есть предложение работы. Техотдел управы. Буду чинить сканеры и ненавидеть людей.`,
    `Мать смеётся, по-настоящему, впервые за утро. — Только не это. Одного человека, который всё чинит, этой семье хватает.`,
  ], next:'o1'},
]},

/* ================= ОКТЯБРЬ ================= */

/* ---------- СЦЕНА 8. ОЧНАЯ СВЕРКА ---------- */
o1:{scene:'s8', head:true, text:[
  `Октябрь начинается с письма. Не электронного, а настоящего, на серой казённой бумаге: курьер управы заставляет расписаться в получении.`,
  `«В рамках программы „Чистый квартал“ все совершеннолетние жители адреса обязаны 3 октября явиться в управу Южных кварталов для очной регистрации. В целях ускорения процедуры доступна добровольная биометрическая сверка (пилотный проект, реализуется при поддержке корпорации „Церебра“)».`,
  `Отец читает письмо дважды. На слове «Церебра» кружка с кофе замирает на полпути ко рту и так и не доезжает.`,
  {when:s=>s.flags.inPersonCheck || s.flags.manualEntry, text:`— Ну вот, — тихо говорит мать. — Дождались.`},
  {when:s=>!(s.flags.inPersonCheck || s.flags.manualEntry), text:`— Нас же проверили в сентябре, — говорит мать. — Тебя проверили, — поправляет отец. — А нас с Лео, выходит, нет.`},
  `Третьего октября в девять утра вы вчетвером стоите в зале управы: Нике шестнадцати нет, но оставить её дома одну отец отказался наотрез.`,
  `Зал похож на станцию монорельса, из которой откачали всю радость. Табло электронной очереди, ряды пластиковых стульев, открыты три окна из двенадцати. На табло горит «Услуга временно недоступна». В углу кто-то спит, обняв папку с документами.`,
  `В центре зала стоит белая кабина, чистая и тихая, как операционная. Над ней логотип Церебры и надпись: «Биометрия. Три минуты — и вы свободны».`,
  `К вам подходит консультант в жёлтом жилете. — Через биометрию без очереди, — говорит он заученно. — Добровольно. А в окно у вас номер двести четырнадцатый.`,
  {tag:'Рассудок', when:s=>s.stats.mind>=6, text:`Отец не смотрит на кабину. Он смотрит на выход. Так смотрят люди, которые прикидывают, успеют ли добежать.`},
], choices:[
  {t:`Предложить пройти биометрию: три минуты, и все свободны.`, hint:`Быстро. Все устали, ещё не начав.`, eff:{flag:'dadStopped'}, res:[
    `— Пап, давай через кабину. Три минуты же.`,
    `Отец берёт тебя за локоть. Не сильно, но так, что ты замолкаешь на полуслове. — Нет, — говорит он. Спокойно. Слишком спокойно. — Мы постоим. Мы никуда не торопимся.`,
    `Ника открывает рот, смотрит на отца и закрывает. Мать делает вид, что изучает табло.`,
  ], next:'o2'},
  {t:`Спросить консультанта, что будет, если отказаться.`, check:{stat:'mind', v:6},
    ok:{hint:`Выяснишь правила игры`, eff:{flag:'knowsRules'}, res:[
      `Консультант вздыхает, но отвечает. При отказе — окно и ручная проверка. А если чип старого формата не читается, нужна «справка из архива о выдаче документа».`,
      `— А если справки нет? — Тогда биометрия, — улыбается он. — Или пункт четыре-два. Но его никто не читает. Он вон там, на стенде.`,
    ]},
    fail:{hint:`Консультант отмахнётся`, res:[`— Всё написано на стенде, — отвечает консультант и уходит к следующим.`]},
    next:'o2'},
  {t:`Молча взять талон и сесть ждать.`, res:[
    `Ты берёшь талон. Двести четырнадцать. На табло горит сто двадцать шесть. Ника стонет так, будто её приговорили.`,
  ], next:'o2'},
]},

o2:{scene:'s8', text:[
  `Через четыре часа, два кофейных автомата и одну потерянную Никой веру в человечество на табло загорается ваш номер. Окно три.`,
  `За стеклом женщина с причёской, которая пережила не одну реформу. Табличка: «Специалист Варга». Она по очереди подносит чипы к считывателю.`,
  {when:s=>s.flags.visualCheck || s.flags.luckyScanner || s.flags.clerkKnowsLeo, text:`Чип матери загорается зелёным: сентябрьская сверка засчитана. Чипы отца и твой — красным.`},
  {when:s=>!(s.flags.visualCheck || s.flags.luckyScanner || s.flags.clerkKnowsLeo), text:`Красный. Красный. Красный.`},
  `— Старый формат, — говорит Варга без выражения. — Либо справка из архива о выдаче, либо биометрия. Архив, — добавляет она почти с сочувствием, — отвечает за сорок пять рабочих дней.`,
  {when:s=>s.flags.manualEntry, text:`Она смотрит в монитор и хмурится. — И ещё: в сентябре у вас был ручной ввод. Его тоже надо подтвердить.`},
  `Отец молчит. Мать улыбается той самой улыбкой. За спиной мягко гудит вентиляция белой кабины.`,
], choices:SHARED_CHOICES.O2},

o2x:{scene:'s8', text:[
  `Варга ждёт, постукивая ручкой по стеклу. Очередь за вашей спиной начинает недовольно гудеть.`,
], choices:SHARED_CHOICES.O2},

/* ---------- ВЕЧЕР ПОСЛЕ УПРАВЫ ---------- */
o3:{scene:'s8h', head:true, text:[
  `Домой вы возвращаетесь затемно. Ника спит в монорельсе на плече у матери. Отец всю дорогу молчит.`,
  {when:s=>s.flags.witnesses && ((s.rel.street||0)>=1 || s.flags.rafaFriend || s.flags.returnedCoins), text:`Рафа на прощание сунул вам пакет лапши «за беспокойство». Он так и остался у отца в руках нетронутым.`},
  `Вечером ты находишь отца в мастерской. Он ничего не чинит, просто сидит над разобранным дроном.`,
  {when:s=>s.flags.dadStopped, text:`На твоём локте проступают четыре синих пятна от его пальцев.`},

const SAVE_KEY = 'noctis-leo-v1';
let S = null;

function fresh(){
  return {v:2, stats:{...START_STATS}, moral:2, strange:0, money:40,
    rel:{dad:2, mom:2, nika:1}, flags:{}, road:[], after:null,
    node:'intro', view:'node', result:null};
}
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function load(){
  try{ const r = localStorage.getItem(SAVE_KEY); if(r){ const o = JSON.parse(r); if(o && o.v===2 && (NODES[o.node] || o.node==='END' || o.node==='intro')) return o; } }catch(e){}
  return null;
}
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const val = x => typeof x==='function' ? x(S) : x;
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function resolveText(arr){
  const out = [];
  (val(arr)||[]).forEach(p=>{
    if(p==null) return;
    if(typeof p==='string') out.push({text:p});
    else if(typeof p==='object'){ if(p.when && !p.when(S)) return; out.push({text:p.text, tag:p.tag}); }
  });
  return out;
}

function apply(eff){
  const ch = [];
  if(!eff) return ch;
  if(eff.stat) for(const k in eff.stat){
    const o = S.stats[k]; S.stats[k] = clamp(o+eff.stat[k],1,10); const d = S.stats[k]-o;
    if(d) ch.push({t:(d>0?'+':'')+d+' '+STATS[k], c:d>0?'up':'down'});
  }
  if(eff.moral){
    const o = S.moral; S.moral = clamp(o+eff.moral,-5,5); const d = S.moral-o;
    if(d) ch.push({t:'Мораль '+(d>0?'↑':'↓'), c:d>0?'up':'down'});
  }
  if(eff.strange){
    const o = S.strange; S.strange = clamp(o+eff.strange,0,10); const d = S.strange-o;
    if(d && SHOW_STRANGE) ch.push({t:'Странность +'+d, c:'odd'});
  }
  if(eff.money){
    const o = S.money; S.money = Math.max(0,o+eff.money); const d = S.money-o;
    if(d) ch.push({t:(d>0?'+':'−')+credits(Math.abs(d)), c:d>0?'up':'down'});
  }
  if(eff.rel) for(const k in eff.rel){
    const isNew = !(k in S.rel);
    const o = isNew ? 0 : S.rel[k];
    S.rel[k] = clamp(o+eff.rel[k],-5,5); const d = S.rel[k]-o;
    const name = REL[k].split(/[,(]/)[0].trim();
    if(isNew) ch.push({t:FACTIONS[k] || 'Новое знакомство: '+name, c:'new'});
    if(d) ch.push({t:name+': отношения '+(d>0?'↑':'↓'), c:d>0?'rel-up':'down'});
  }
  if(eff.flag) [].concat(eff.flag).forEach(f=>S.flags[f]=true);
  return ch;
}

/* Шанс проверки: хватает — всегда успех; не хватает 1 — 35%; 2 — 10%; больше — провал */
function checkChance(have, need){ const d = need-have; return d<=0 ? 1 : d===1 ? .35 : d===2 ? .1 : 0; }
const pct = c => Math.round(c*100)+'%';
function credits(n){ const a=Math.abs(n)%100, b=a%10; const w = (a>10&&a<20)?'кредитов':b===1?'кредит':(b>=2&&b<=4)?'кредита':'кредитов'; return n+' '+w; }
const FACTIONS = {street:'Появилась репутация в квартале'};

function choiceInfo(c){
  if(c.show && !c.show(S)) return null;
  if(c.thought) return {kind:'thought'};
  if(c.req){ const have=S.stats[c.req.stat]; return {kind: have>=c.req.v ? 'req-ok' : 'locked', stat:c.req.stat, need:c.req.v, have}; }
  if(c.check){ const have=S.stats[c.check.stat]; const chance=checkChance(have,c.check.v); return {kind:'check', stat:c.check.stat, need:c.check.v, have, chance}; }
  return {kind:'plain'};
}

function choose(i){
  const n = NODES[S.node]; const c = n.choices[i]; const info = choiceInfo(c);
  if(!info || info.kind==='thought' || info.kind==='locked') return;
  let branch = c, check = null;
  if(c.check){ const pass = info.chance>=1 || Math.random()<info.chance; branch = pass ? c.ok : c.fail; check = {stat:c.check.stat, need:c.check.v, have:info.have, chance:info.chance, pass}; }
  const changes = apply(branch.eff);
  const text = resolveText(branch.res);
  const next = branch.next !== undefined ? branch.next : c.next;
  S.view = 'result';
  S.result = {chosen: val(c.t), text, changes, check, next};
  save(); render();
}

function go(next){
  if(typeof next==='function') next = next(S);
  if(next && typeof next==='object' && next.road){
    S.after = next.then;
    const pool = ROAD_POOL.filter(id=>!S.road.includes(id));
    if(!pool.length){ next = next.then; }
    else { next = pool[Math.floor(Math.random()*pool.length)]; S.road.push(next); }
  }
  if(next==='@after'){ next = S.after || 'END'; S.after = null; }
  S.node = next; S.view = 'node'; S.result = null;
  save(); render(true);
}

function paras(list){
  return list.map(p=> p.tag
    ? `<p class="insight"><span class="tag">${esc(p.tag)}</span>${esc(p.text)}</p>`
    : `<p>${esc(p.text)}</p>`).join('');
}

function effLines(eff){
  const out = [];
  if(!eff) return out;
  if(eff.stat) for(const k in eff.stat){ const d=eff.stat[k]; out.push([(d>0?'+':'')+d+' '+STATS[k], d>0?'up':'down']); }
  if(eff.moral) out.push(['Мораль '+(eff.moral>0?'↑':'↓'), eff.moral>0?'up':'down']);
  if(eff.rel) for(const k in eff.rel){
    const name = REL[k].split(/[,(]/)[0].trim(), d = eff.rel[k];
    if(!(k in S.rel)) out.push([FACTIONS[k] || 'Новое знакомство: '+name, 'mem']);
    if(d) out.push([name+': отношения '+(d>0?'↑':'↓'), d>0?'rel-up':'down']);
  }
  if(eff.money) out.push([(eff.money>0?'+':'−')+credits(Math.abs(eff.money)), eff.money>0?'up':'down']);
  if(eff.strange && SHOW_STRANGE) out.push(['Может случиться что-то странное', 'odd']);
  if(eff.flag && [].concat(eff.flag).some(f=>MEMORY.some(m=>m[0]===f))) out.push(['Мир это запомнит', 'mem']);
  return out;
}
function previewHtml(c, info){
  const ln = arr => arr.map(([t,cl])=>`<span class="ln ${cl}">${esc(t)}</span>`).join('');
  let h = '';
  if(info.kind==='thought'){
    h = `<span class="hint">Мимолётная мысль. Ты пока не понимаешь, откуда она и что с ней делать.</span>`;
    return `<span class="preview" role="tooltip">${h}</span>`;
  }
  if(c.hint) h += `<span class="hint">${esc(val(c.hint))}</span>`;
  if(info.kind==='locked'){
    h += `<span class="ln down">Нужно: ${STATS[info.stat]} ${info.need}, у тебя ${info.have}</span>`;
    const e = effLines(c.eff); if(e.length) h += `<span class="grp">Дало бы</span>`+ln(e);
  } else if(info.kind==='check'){
    h += `<span class="ph">Проверка · ${STATS[info.stat]}: у тебя ${info.have}, нужно ${info.need}</span>`;
    h += info.chance>=1 ? `<span class="ln up">Успех гарантирован</span>` : info.chance>0 ? `<span class="ln risk">Шанс успеха ${pct(info.chance)}: может повезти</span>` : `<span class="ln down">Провал неизбежен: не хватает ${info.need-info.have}</span>`;
    const ok = effLines(c.ok && c.ok.eff), fail = effLines(c.fail && c.fail.eff);
    const side = (b, e) => (b && b.hint ? `<span class="ln mem">${esc(b.hint)}</span>` : '') + (e.length ? ln(e) : (b && b.hint ? '' : `<span class="ln none">без изменений в статах</span>`));
    h += `<span class="grp ok">Если получится</span>` + side(c.ok, ok);
    h += `<span class="grp fail">Если не получится</span>` + side(c.fail, fail);
  } else {
    const e = effLines(c.eff);
    h += e.length ? ln(e) : (c.hint ? '' : `<span class="ln none">Без заметных последствий</span>`);
  }
  if(!h) return '';
  const tap = info.kind==='locked' ? 'Этот вариант сейчас недоступен' : 'Нажми ещё раз, чтобы выбрать';
  return `<span class="preview" role="tooltip">${h}<span class="tap">${tap}</span></span>`;
}

function tagsFor(info){
  if(info.kind==='req-ok') return `<span class="tag-chip ok">${STATS[info.stat]} ${info.need} ✓</span>`;
  if(info.kind==='locked') return `<span class="tag-chip lock">Нужно: ${STATS[info.stat]} ${info.need} · у тебя ${info.have}</span>`;
  if(info.kind==='check'){ const cl = info.chance>=1?'ok':info.chance>0?'risk':'fail'; return `<span class="tag-chip ${cl}">Проверка · ${STATS[info.stat]} ${info.have}/${info.need} · ${info.chance>=1?'успех':info.chance>0?'шанс '+pct(info.chance):'провал'}</span>`; }
  if(info.kind==='thought') return `<span class="tag-chip">мысль · пока недоступно</span>`;
  return '';
}

/* Дождь */
(function rain(){
  const cv = document.getElementById('rain'); const ctx = cv.getContext('2d');
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=0,H=0,drops=[];
  function size(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    W = cv.clientWidth; H = cv.clientHeight; cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const count = Math.round(W*H/9000);
    drops = Array.from({length:count},()=>({x:Math.random()*W, y:Math.random()*H, l:8+Math.random()*16, v:6+Math.random()*9, a:.05+Math.random()*.12}));
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.lineWidth = 1;
    for(const d of drops){
      ctx.strokeStyle = `rgba(160,190,205,${d.a})`;
      ctx.beginPath(); ctx.moveTo(d.x,d.y); ctx.lineTo(d.x-d.l*.18, d.y+d.l); ctx.stroke();
    }
  }
  function tick(){
    if(!document.hidden){
      for(const d of drops){ d.y += d.v; d.x -= d.v*.18; if(d.y>H){ d.y = -d.l; d.x = Math.random()*(W+40); } }
      draw();
    }
    requestAnimationFrame(tick);
  }
  size(); window.addEventListener('resize', size);
  if(reduce) draw(); else requestAnimationFrame(tick);
})();

    ctx = new AC();

    const comp = ctx.createDynamicsCompressor(); comp.threshold.value=-18; comp.ratio.value=3;
    master.connect(comp); comp.connect(ctx.destination);
    reverb = ctx.createConvolver(); reverb.buffer = impulse(3.5); reverb.connect(master);
    // Дождь и гул города: всегда тихо на фоне
    const nb = noiseBuf();
    const rain = ctx.createBufferSource(); rain.buffer=nb; rain.loop=true;
    const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=900;
    const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=5500;
    const rg = ctx.createGain(); rg.gain.value=.028;
    rain.connect(hp); hp.connect(lp); lp.connect(rg); rg.connect(master); rain.start();
    const hum = ctx.createBufferSource(); hum.buffer=nb; hum.loop=true; hum.playbackRate.value=.7;
    const hl = ctx.createBiquadFilter(); hl.type='lowpass'; hl.frequency.value=160;
    const hg = ctx.createGain(); hg.gain.value=.05;
    hum.connect(hl); hl.connect(hg); hg.connect(master); hum.start();
    timer = setInterval(tick, 60);
    document.addEventListener('visibilitychange', ()=>{ if(!ctx) return; if(document.hidden) ctx.suspend(); else if(on) ctx.resume(); });
    return true;
  }
  function newLayer(m){
    const now = ctx.currentTime;
    if(layer){ const old=layer, os=send; old.gain.setTargetAtTime(0, now, .9); setTimeout(()=>{ try{old.disconnect(); os.disconnect();}catch(e){} }, 6000); }
    layer = ctx.createGain(); layer.gain.value = 0; layer.gain.setTargetAtTime(1, now+.2, 1.2);
    send = ctx.createGain(); send.gain.value = m.wet;
    layer.connect(master); layer.connect(send); send.connect(reverb);
    step = 0; nextT = now+.15;
  }
  function pad(m, notes, t, dur){
    const f = ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=m.cutoff; f.Q.value=.6;
    const g = ctx.createGain(); const lvl = m.pad/notes.length;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(lvl,t+2.2); g.gain.setValueAtTime(lvl,t+dur); g.gain.linearRampToValueAtTime(0,t+dur+3);
    f.connect(g); g.connect(layer);
    notes.forEach(n=>[-7,7].forEach(cent=>{ const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=mtof(n); o.detune.value=cent; o.connect(f); o.start(t); o.stop(t+dur+3.1); }));
  }
  function pluck(freq, t, type, lvl, dec){
    const o=ctx.createOscillator(), g=ctx.createGain(), f=ctx.createBiquadFilter();
    o.type=type; o.frequency.value=freq; f.type='lowpass'; f.frequency.value=2600;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(lvl,t+.006); g.gain.exponentialRampToValueAtTime(.0001,t+dec);

  }
  function bass(freq, t, dec, lvl){
    const o=ctx.createOscillator(), g=ctx.createGain(), f=ctx.createBiquadFilter();

    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(lvl,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dec);
    o.connect(f); f.connect(g); g.connect(layer); o.start(t); o.stop(t+dec+.05);
  }
  function thump(t, lvl){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(95,t); o.frequency.exponentialRampToValueAtTime(42,t+.16);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(lvl,t+.008); g.gain.exponentialRampToValueAtTime(.0001,t+.3);
    o.connect(g); g.connect(layer); o.start(t); o.stop(t+.35);
  }
  function schedule(m, s, t){
    const spb = 60/m.tempo;                            // bars = сколько долей держится один аккорд
    const stepsPerChord = m.bars*4;
    const ci = Math.floor(s/stepsPerChord) % m.chords.length, ch = m.chords[ci], inChord = s % stepsPerChord;
    if(inChord===0){
      pad(m, ch, t, m.bars*spb);
      if(m.bass==='root') bass(mtof(ch[0]-12), t, 2.5, .22);
    }
    if(m.bass==='eighth' && s%2===0) bass(mtof(ch[0]-12), t, .22, .2);
    if(m.bass==='sixteenth') bass(mtof(ch[0]-12), t, .1, .17);
    const p = m.pluck;
    if(p && s%p.every===0 && Math.random()<p.p){
      const idx = p.arp ? (s/p.every)%ch.length : Math.floor(Math.random()*ch.length);
      pluck(mtof(ch[idx]+p.oct), t, p.type, p.lvl, p.arp ? .22 : 1.1);
    }
    if(m.heart){
      const beatLen = m.tempo>100 ? 4 : 8;
      if(s%beatLen===0) thump(t, .5); else if(s%beatLen===1) thump(t, .3);
    }
  }
  function tick(){
    if(!ctx || !layer || !mood) return;
    const m = MOODS[mood], dt = 60/m.tempo/4;
    while(nextT < ctx.currentTime + .3){ schedule(m, step, nextT); nextT += dt; step++; }
  }
  function apply(){
    if(!ctx) return;
    const now = ctx.currentTime;
    master.gain.cancelScheduledValues(now);
    master.gain.setTargetAtTime(on ? .55 : 0, now, .4);
    if(on){ ctx.resume(); if(want!==mood){ mood=want; newLayer(MOODS[mood]); } }
    else setTimeout(()=>{ if(!on && ctx) ctx.suspend(); }, 1500);
  }
  return {
    get on(){ return on; },
    unlock(){ if(!on) return; if(ctx && ctx.state==='running' && mood) return; if(init()) apply(); },
    setMood(m){ want = MOODS[m] ? m : 'home'; if(ctx && on && want!==mood){ mood=want; newLayer(MOODS[mood]); } },
    toggle(){ on=!on; try{ localStorage.setItem(PREF, on?'on':'off'); }catch(e){} if(on) init(); apply(); return on; },
  };
})();
