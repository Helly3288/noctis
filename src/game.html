<title>Год Лео Вельта</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#0E1316;
  --bg-2:#131A1E;
  --panel:#172026;
  --panel-2:#1C272E;
  --line:#28343C;
  --line-2:#34434D;
  --text:#E9E3D7;
  --text-2:#C9C3B6;
  --muted:#8E9BA3;
  --amber:#F0A847;
  --amber-soft:rgba(240,168,71,.14);
  --amber-dim:#8C6634;
  --magenta:#E4508A;
  --magenta-soft:rgba(228,80,138,.13);
  --good:#86C9A0;
  --bad:#E27A60;
  --display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --serif:"Literata", "PT Serif", Georgia, "Times New Roman", serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--serif);
  font-size:17px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
#rain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.5}
.app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column}

/* Top bar */
.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  display:flex;align-items:center;gap:16px;
  padding:12px 20px;
  background:linear-gradient(to bottom, rgba(14,19,22,.96), rgba(14,19,22,.86));
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(6px);
}
.brand{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.28em;color:var(--amber);text-shadow:0 0 12px rgba(240,168,71,.35)}
.where{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leo-btn{display:none;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text);background:var(--panel);border:1px solid var(--line-2);padding:7px 12px;border-radius:3px;cursor:pointer}
.leo-btn:hover{border-color:var(--amber)}

.sound-btn{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);background:transparent;border:1px solid var(--line-2);padding:6px 11px;border-radius:3px;cursor:pointer}
.sound-btn:hover,.sound-btn:focus-visible{border-color:var(--amber);color:var(--text);outline:none}
.sound-btn .cross{display:none}
.sound-btn[aria-pressed="false"] .wave{display:none}
.sound-btn[aria-pressed="false"] .cross{display:inline}
.sound-btn[aria-pressed="false"]{color:var(--muted)}

/* Scene art */
.art{display:block;width:100%;margin:0;aspect-ratio:16/7;max-height:320px;border-radius:4px;border:1px solid var(--line);background:#0A0F12;overflow:hidden;margin-bottom:22px}
.art canvas,.art img{display:block;width:100%;height:100%;object-fit:cover}

/* Layout */
.layout{
  flex:1;width:100%;max-width:1120px;margin:0 auto;
  display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:48px;
  padding-inline:20px;padding-block:36px 64px;
}
.story{max-width:680px;width:100%;justify-self:center;min-width:0}

/* Scene head */
.scene-head{display:flex;flex-direction:column;gap:6px;margin-bottom:28px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.scene-num{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.scene-head h1{font-family:var(--display);font-weight:500;font-size:clamp(22px,4vw,30px);line-height:1.2;margin:0;text-wrap:balance;color:var(--text)}
.scene-place{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em;margin:0}

.text{display:flex;flex-direction:column;gap:14px}
.text p{margin:0;color:var(--text-2)}
.text p.lead{color:var(--text)}
.insight{border-left:2px solid var(--amber-dim);padding:2px 0 2px 14px;color:var(--text) !important;font-style:italic}
.insight .tag{display:block;font-style:normal;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin-bottom:2px}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:.001;transform:translateY(4px)}to{opacity:1;transform:none}}

/* Choices */
.choices{display:flex;flex-direction:column;gap:10px;margin-top:30px}
.choice{
  display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;align-items:start;
  width:100%;text-align:left;cursor:pointer;
  font:inherit;font-size:16px;line-height:1.5;color:var(--text);
  background:var(--panel);border:1px solid var(--line);border-radius:4px;
  padding:13px 16px;
  transition:border-color .15s, background .15s;
}
.choice:hover:not([data-off]),.choice:focus-visible{border-color:var(--amber);background:var(--panel-2);outline:none}
.choice .key{font-family:var(--mono);font-size:12px;color:var(--amber);padding-top:3px}
.choice .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag-chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:2px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.tag-chip.ok{color:var(--amber);border-color:var(--amber-dim)}
.tag-chip.fail{color:var(--bad);border-color:rgba(226,122,96,.4)}
.tag-chip.risk{color:#E8C27A;border-color:rgba(232,194,122,.45)}
.preview .risk{color:#E8C27A}
.tag-chip.lock{color:var(--muted)}
.choice[data-off]{cursor:not-allowed}
.choice.locked{opacity:.5}
.choice.locked .key{color:var(--muted)}
.choice.thought{background:var(--magenta-soft);border:1px dashed rgba(228,80,138,.45);color:#EBB3C9;font-style:italic;opacity:.9}
.choice.thought .key{color:var(--magenta);font-style:normal}
.choice.thought .tag-chip{color:var(--magenta);border-color:rgba(228,80,138,.45);font-style:normal}

/* Подсказка о последствиях */
.choice{position:relative}
.preview{
  display:none;position:absolute;z-index:6;left:46px;bottom:calc(100% + 8px);
  width:max-content;max-width:min(360px,calc(100% - 46px));
  flex-direction:column;gap:5px;padding:11px 14px;
  background:#0B1013;border:1px solid var(--amber-dim);border-radius:4px;
  box-shadow:0 10px 30px rgba(0,0,0,.55);
  font-family:var(--mono);font-size:12px;line-height:1.45;font-style:normal;color:var(--text-2);text-align:left;pointer-events:none;
}
.preview::after{content:"";position:absolute;left:18px;top:100%;border:7px solid transparent;border-top-color:var(--amber-dim)}
.preview .ph{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.preview .hint{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--text)}
.preview .grp{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.preview .grp.ok{color:var(--amber)} .preview .grp.fail{color:var(--bad)}
.preview .ln{display:flex;gap:7px}
.preview .ln::before{content:"·";color:var(--muted)}
.preview .up{color:var(--amber)} .preview .rel-up{color:var(--good)} .preview .down{color:var(--bad)}
.preview .odd{color:var(--magenta)} .preview .mem{color:var(--text)} .preview .none{color:var(--muted)}
.preview .tap{display:none;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);margin-top:4px}
.choice.thought .preview{border-color:rgba(228,80,138,.5)}
.choice.thought .preview::after{border-top-color:rgba(228,80,138,.5)}
@media (hover:hover){
  .choice:hover .preview,.choice:focus-visible .preview{display:flex}
}
@media (hover:none){
  .preview{position:static;display:none;width:auto;max-width:none;margin-top:8px;box-shadow:none;background:var(--bg-2)}
  .preview::after{display:none}
  .choice.armed .preview{display:flex}
  .choice.armed{border-color:var(--amber)}
  .preview .tap{display:block}
}

/* Result */
.chosen{display:flex;gap:10px;margin-top:28px;padding:12px 16px;border-left:2px solid var(--amber);background:var(--amber-soft);color:var(--text);font-style:italic;border-radius:0 4px 4px 0}
.chosen::before{content:"›";font-style:normal;color:var(--amber);font-family:var(--mono)}
.checkline{margin-top:14px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.checkline.pass{color:var(--amber)}
.checkline.fail{color:var(--bad)}
.result{margin-top:16px}
.changes{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chg{font-family:var(--mono);font-size:12px;padding:4px 9px;border-radius:3px;border:1px solid var(--line-2);color:var(--text-2);background:var(--bg-2)}
.chg.up{color:var(--amber);border-color:var(--amber-dim)}
.chg.rel-up{color:var(--good);border-color:rgba(134,201,160,.4)}
.chg.down{color:var(--bad);border-color:rgba(226,122,96,.4)}
.chg.odd{color:var(--magenta);border-color:rgba(228,80,138,.5);background:var(--magenta-soft)}
.chg.new{color:var(--text);border-color:var(--line-2)}
.next{
  margin-top:30px;font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;
  color:#1A1206;background:var(--amber);border:0;border-radius:3px;padding:12px 22px;cursor:pointer;
}
.next:hover,.next:focus-visible{background:#F6BB67;outline:2px solid var(--amber);outline-offset:3px}
.btn-ghost{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);background:transparent;border:1px solid var(--line-2);border-radius:3px;padding:11px 18px;cursor:pointer}
.btn-ghost:hover,.btn-ghost:focus-visible{border-color:var(--amber);color:var(--text);outline:none}

/* Title screen */
.title-screen{display:flex;flex-direction:column;gap:20px}
.title-screen .art{margin-bottom:6px;max-height:360px}
.title-screen .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.logo{font-family:var(--display);font-weight:700;font-size:clamp(48px,12vw,104px);line-height:.95;letter-spacing:.06em;margin:0;color:var(--amber);
  text-shadow:0 0 18px rgba(240,168,71,.45),0 0 60px rgba(240,168,71,.18);animation:flicker 3.2s ease-out 1 both}
@keyframes flicker{0%{opacity:.15}8%{opacity:1}10%{opacity:.3}13%{opacity:1}40%{opacity:.85}42%{opacity:1}100%{opacity:1}}
.subtitle{font-family:var(--display);font-weight:500;font-size:clamp(18px,3vw,24px);margin:0;color:var(--text)}
.blurb{max-width:56ch;color:var(--text-2);margin:0}
.title-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:8px}
.title-actions .next{margin-top:0}
.hint{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.04em}

/* Panel */
.panel{display:flex;flex-direction:column;gap:26px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px)}
.p-head{display:flex;flex-direction:column;gap:2px}
.p-name{font-family:var(--display);font-weight:500;font-size:18px;color:var(--text)}
.p-sub{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.p-sec{display:flex;flex-direction:column;gap:10px}
.p-sec h2{margin:0;font-family:var(--mono);font-weight:600;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--line)}
.stat{display:grid;grid-template-columns:86px minmax(0,1fr) 20px;align-items:center;gap:10px;font-size:14px}
.stat .n{font-family:var(--serif);color:var(--text-2)}
.stat .v{font-family:var(--mono);font-size:13px;color:var(--text);text-align:right;font-variant-numeric:tabular-nums}
.pips{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.pips i{height:7px;background:var(--line);border-radius:1px}
.pips i.on{background:var(--amber)}
.meter-row{display:flex;flex-direction:column;gap:6px}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.meter-top .n{color:var(--text-2)}
.meter-top .l{font-family:var(--mono);font-size:11.5px;color:var(--text)}
.moral{position:relative;height:8px;background:linear-gradient(to right, rgba(226,122,96,.35), var(--line) 50%, rgba(240,168,71,.35));border-radius:2px}
.moral::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line-2)}
.moral b{position:absolute;top:-4px;width:4px;height:16px;margin-left:-2px;background:var(--text);border-radius:1px;box-shadow:0 0 0 2px var(--bg)}
.strange{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.strange i{height:7px;background:var(--line);border-radius:1px}
.strange i.on{background:var(--magenta);box-shadow:0 0 6px rgba(228,80,138,.5)}
.strange-l{color:var(--magenta) !important}
.rel{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:14px}
.rel .n{color:var(--text-2)}
.rel .l{font-family:var(--mono);font-size:11.5px;text-align:right}
.rel .bar{grid-column:1/-1;height:3px;background:var(--line);position:relative;border-radius:2px;overflow:hidden}
.rel .bar b{position:absolute;top:0;bottom:0}
.l-good{color:var(--good)} .l-bad{color:var(--bad)} .l-mid{color:var(--muted)}
.money{display:flex;justify-content:space-between;font-size:14px;color:var(--text-2)}
.money b{font-family:var(--mono);font-weight:400;color:var(--text);font-variant-numeric:tabular-nums}
.p-foot{display:flex;flex-direction:column;gap:8px}
.close-panel{display:none}

/* End */
.end-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-top:26px}
.end-box{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.end-box h3{margin:0;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.end-line{display:flex;justify-content:space-between;gap:10px;font-size:15px;color:var(--text-2)}
.end-line b{font-family:var(--mono);font-weight:400;color:var(--text)}
.memory{margin:18px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.memory li{padding-left:18px;position:relative;color:var(--text-2)}
.memory li::before{content:"";position:absolute;left:0;top:.7em;width:7px;height:1px;background:var(--amber)}
.memory li.strange-mem::before{background:var(--magenta)}
h2.end-h{font-family:var(--display);font-weight:500;font-size:20px;margin:34px 0 0;color:var(--text)}

.backdrop{display:none}
@media (max-width: 900px){
  .layout{grid-template-columns:minmax(0,1fr);padding-block:24px 56px;gap:0}
  .leo-btn{display:inline-block}
  .panel{position:fixed;top:0;right:0;bottom:0;width:min(340px,90vw);z-index:20;background:var(--bg-2);border-left:1px solid var(--line);
    padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 20px);overflow-y:auto;transform:translateX(105%);transition:transform .25s ease}
  body.panel-open .panel{transform:none}
  .backdrop{display:block;position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s}
  body.panel-open .backdrop{opacity:1;pointer-events:auto}
  .close-panel{display:inline-block;align-self:flex-start}
  #soundLabel{display:none}
  .top{gap:10px;padding:10px 14px}
  body{font-size:16.5px}
}
@media (prefers-reduced-motion: reduce){
  .fade,.logo{animation:none}
  .panel,.backdrop{transition:none}
}
</style>

<canvas id="rain" aria-hidden="true"></canvas>
<div class="app">
  <header class="top">
    <div class="brand">НОКТИС</div>
    <div class="where" id="where"></div>
    <button class="sound-btn" id="soundBtn" type="button" aria-pressed="true" title="Звук">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path class="cross" d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span id="soundLabel">Звук</span>
    </button>
    <button class="leo-btn" id="leoBtn" type="button" aria-controls="panel" aria-expanded="false">Лео</button>
  </header>
  <div class="layout">
    <main class="story" id="story" aria-live="polite"></main>
    <aside class="panel" id="panel" aria-label="Персонаж"></aside>
  </div>
</div>
<div class="backdrop" id="backdrop"></div>

<script>
/* ============================================================
   ДАННЫЕ ИГРЫ
   ============================================================ */

const STATS = {body:'Тело', agi:'Ловкость', tech:'Техника', mind:'Рассудок', charm:'Обаяние', will:'Воля'};
const STAT_ORDER = ['body','agi','tech','mind','charm','will'];
const START_STATS = {body:4, agi:4, tech:6, mind:6, charm:3, will:4};
const REL = {dad:'Томаш, отец', mom:'Ирина, мать', nika:'Ника, сестра', dana:'Дана Ортега', street:'Квартал (репутация)', teo:'Тео Бартал'};

/* mood — настроение музыки; img — путь к настоящей иллюстрации (когда появится), без неё рисуется заставка кодом */
const SCENES = {
  s1:{label:'Сцена 1 · 07:40', month:'Сентябрь', place:'Дом и мастерская', title:'Утро в мастерской', mood:'home'},
  s2:{label:'Сцена 2 · 08:30', month:'Сентябрь', place:'Станция монорельса «Эстакада»', title:'Час пик', mood:'street'},
  s3:{label:'Сцена 3 · 10:15', month:'Сентябрь', place:'Технический университет Ноктиса', title:'Лаборатория 4-Б', mood:'uni'},
  rd_train:{label:'Дорога домой', month:'Сентябрь', place:'Монорельс, вечерний рейс', title:'Лишняя рука', mood:'street'},
  rd_shop:{label:'Дорога домой', month:'Сентябрь', place:'Круглосуточный «Лакки 24»', title:'Автомат', mood:'street'},
  rd_alley:{label:'Дорога домой', month:'Сентябрь', place:'Переулок за рынком', title:'Сбой', mood:'night'},
  s4:{label:'Сцена 4 · вечер и ночь', month:'Сентябрь', place:'Дом и мастерская', title:'Ночной клиент', mood:'night'},
  s5:{label:'Сцена 5 · две недели спустя', month:'Сентябрь', place:'Мастерская и ночной рынок', title:'Поручение', mood:'street'},
  s6:{label:'Сцена 6 · пятница, 22:00', month:'Сентябрь', place:'Будка Тео, задняя линия рынка', title:'Зелёная лампа', mood:'night'},
  s6n:{label:'Сцена 6 · 22:40', month:'Сентябрь', place:'Ночной рынок', title:'Напёрстки', mood:'street', art:'s5'},
  s7:{label:'Сцена 7 · 30 сентября, 11:00', month:'Сентябрь', place:'Дом и мастерская', title:'Сверка', mood:'home', art:'s1'},
  s8:{label:'Сцена 8 · 3 октября, 09:00', month:'Октябрь', place:'Управа Южных кварталов', title:'Очная сверка', mood:'uni', art:'office'},
  s8h:{label:'Сцена 8 · тот же вечер', month:'Октябрь', place:'Мастерская', title:'Обещание', mood:'home', art:'s1'},
  s9a:{label:'Сцена 9 · вторник, 19:00', month:'Октябрь', place:'Будка Тео', title:'Упавший дрон', mood:'night', art:'s6'},
  s9b:{label:'Сцена 9 · среда, 20:30', month:'Октябрь', place:'Мастерская', title:'Упавший дрон', mood:'night', art:'s1'},
  s10:{label:'Сцена 10 · конец октября', month:'Октябрь', place:'Крыша мастерской', title:'Тихий вечер', mood:'home', art:'city'},
};

/* Странность копится скрытно. Шкала появится у игрока после раскрытия правды (середина года). */
const SHOW_STRANGE = false;

const ROAD_POOL = ['rd_train','rd_shop','rd_alley'];

/* Как читать узел:
   text: абзацы. Строка или {text, when:(s)=>bool, tag:'Рассудок'} — абзац виден при условии.
