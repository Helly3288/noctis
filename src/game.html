  {t:`Попросить её уйти.`, eff:{rel:{nika:-2}, flag:'pushedNika'}, res:[`— Ник. Не сейчас. Пожалуйста. — Она встаёт и уходит. Дверь не хлопает. Лучше бы хлопнула.`], next:'i1'},
]},

/* ---------- СЦЕНА 19. УРОКИ ТЕО ---------- */
i1:{scene:'s19', head:true, text:[
  {when:s=>(s.flags.dadKnowsTeo || s.flags.teoJob), text:`Через неделю отец сам приводит тебя к будке Тео. Они стоят друг напротив друга, как два старых пса. — Ты знал, — говорит отец. — Я всегда знал, — отвечает Тео. — Я же помог вам его вынести, Адам.`},
  {when:s=>!(s.flags.dadKnowsTeo || s.flags.teoJob), text:`Через неделю отец приводит тебя на рынок, к будке с зелёной лампой. — Тео был с нами в «Лимене», — говорит он по дороге. — Инженер безопасности. Он помог нам бежать. Он знает про ключ больше, чем я.`},
  `Тео запирает будку, задёргивает штору и ставит перед тобой обычную настольную лампу. Выключенную. Не подключённую к сети.`,
  `— Включи, — говорит он. — Не руками.`,
  `— Она не подключена. — Именно поэтому, — говорит Тео. — В ней есть конденсатор и остаток заряда. Всё, что нужно, уже внутри. Тебе надо просто попросить.`,
  `Отец стоит у двери и смотрит в пол.`,
], choices:[
  {t:`Сосредоточиться и попросить.`, check:{stat:'will', v:5, bonus:[{when:s=>s.strange>=4, why:'дар уже просыпался не раз'}]},
    ok:{hint:`Получится с первого раза`, eff:{stat:{control:2}, why:`Первый урок Тео: лампа загорелась, потому что ты попросил.`, strange:1, flag:'firstLight'}, res:[
      `Ты смотришь на лампу, пока глаза не начинают слезиться. Ты думаешь: «Гори». Потом: «Пожалуйста». Потом не думаешь ничего.`,
      `Лампа загорается. Тусклым, дрожащим светом. Сама.`,
      `Отец отворачивается к двери. Тео смеётся тихо, почти благоговейно: — С первого раза. Шестая училась месяц.`,
    ]},
    fail:{hint:`Понадобится не одна попытка`, eff:{stat:{control:1}, why:`Первый урок Тео: лампа загорелась с пятой попытки.`, strange:1, flag:'firstLight'}, res:[`Первая попытка — ничего. Вторая — ничего. На пятой, когда ты уже злишься, лампа вспыхивает и лопается. — Злость работает, — говорит Тео, выметая осколки. — Но плохо. Будем учить по-другому.`]},
    next:'i2'},
  {t:`Сначала спросить: «Что будет, если я попрошу не лампу, а человека?»`, check:{stat:'mind', v:6},
    ok:{hint:`Тео ответит серьёзно`, eff:{stat:{control:1}, why:`Первый урок Тео: сначала понять, потом делать.`, flag:'teoWarnedPeople'}, res:[
      `Тео перестаёт улыбаться. — С человеком то же самое, — говорит он. — Всё, что нужно, уже внутри. Импланты, нервы, электричество. Ты можешь попросить сердце остановиться. И оно остановится.`,
      `— Не делай этого, Лео. Никогда. Я видел, что бывает с теми, кто так делал. И с теми, на ком так делали.`,
      `Потом ты зажигаешь лампу. С третьей попытки.`,
    ]},
    fail:{hint:`Тео отмахнётся`, eff:{stat:{control:1}, why:`Первый урок Тео.`}, res:[`— Людей не трогай, — отрезает Тео. — Лампу включи. — Ты включаешь. С третьей попытки.`]},
    next:'i2'},
  {t:`Сначала спросить: можно ли этим помогать людям, а не только лампам?`, hint:`Тео ответит честно.`, eff:{moral:1, stat:{control:1}, why:`Первый урок Тео: дар — чтобы помогать.`, strange:1, flag:['firstLight','askedHelp']}, res:[
    `Тео смотрит на тебя долго, будто видит впервые. — Можно, — говорит он. — Шестая тоже с этого начинала. Она чинила девочкам в палате игрушки. Не руками.`,
    `— Помни это, когда станет трудно. — Потом ты зажигаешь лампу. Со второй попытки.`,
  ], next:'i2'},
]},

i2:{scene:'s19', text:[
  `На этом уроки только начинаются. Дважды в неделю ты приходишь к Тео, и он учит тебя слушать: провода, замки, камеры, дроны. Всё, что работает на электричестве, разговаривает. Нужно только расслышать.`,
  `В панели Лео появляется новая строка: Контроль. Чем он выше, тем меньше дар зависит от страха и тем больше от тебя.`,
  `— Одно правило, — говорит Тео в конце первой недели. — Каждый раз, когда ты делаешь это, ты оставляешь след. Церебра слушает. Чем чаще ты зовёшь, тем легче тебя найти.`,
], choices:[
  {t:`«Понял. Буду осторожен».`, res:[`Тео кивает. Ты понимаешь, что он не верит. Ты сам себе не очень веришь.`], next:'j0'},
  {t:`«А как ты вообще это знаешь? Ты же не такой, как я».`, hint:`Тео может ответить. Или нет.`, eff:{flag:'askedTeoPast'}, res:[`Тео долго протирает свой мёртвый глаз платком. — Я знал таких, как ты, — говорит он наконец. — Одну. Давно. — И переводит разговор на замки.`], next:'j0'},
]},

/* ---------- ДАНА. ЯНВАРЬ ---------- */
j0:{scene:'s19d', head:true, text:[
  `Январская сессия. Ты сдаёшь экзамены как во сне: днём билеты, вечером лампы у Тео.`,
  `После экзамена по схемотехнике Дана ждёт тебя на подоконнике в коридоре.`,
  {when:s=>s.flags.danaWarned && s.flags.calmGrey, text:`— Они приходили? — спрашивает она сразу. — Люди с опросом? — Приходили. Ушли ни с чем. — Дана закрывает глаза на секунду. — Хорошо.`},
  {when:s=>s.flags.danaWarned && !s.flags.calmGrey, text:`— Они приходили? — спрашивает она сразу. — Люди с опросом? — Приходили. — Дана кусает губу и ничего не говорит.`},
  `— Ты другой, — говорит она. — С каникул. Как будто тебе сказали что-то, после чего нельзя обратно.`,
], choices:[
  {t:`Рассказать ей правду про «Лимен».`, hint:`Ты ей доверяешь. Стоит ли?`, eff:{rel:{dana:2}, flag:'toldDanaSecret'}, res:[
    `Ты рассказываешь. Не всё: без ключа, без Тео. Родители работали в Церебре. Ты не совсем их сын. Тебя ищут.`,
    `Дана бледнеет. — Не говори больше никому, — шепчет она. — Никому, слышишь? Даже мне. Особенно мне.`,
    `Она спрыгивает с подоконника и уходит, не попрощавшись. Вечером приходит сообщение: «Прости. Я рада, что ты мне доверяешь. Правда». И через минуту второе: «Удали это».`,
  ], next:'j1'},
  {t:`Честно: «Кое-что случилось. Пока не могу рассказать».`, eff:{rel:{dana:1}, flag:'honestDana'}, res:[
    `— Кое-что случилось. Я пока не могу рассказать.`,
    `Дана смотрит на тебя долго и вдруг кивает. — Понимаю. Лучше, чем ты думаешь. — Она слезает с подоконника. — Когда сможешь, я здесь. И когда не сможешь, тоже.`,
  ], next:'j1'},
  {t:`Отмахнуться: «Просто не выспался».`, eff:{flag:'liedDana'}, res:[
    `— Не выспался. Сессия.`,
    `— Ладно, — говорит Дана. Вы оба знаете, что это неправда, и оба делаете вид, что нет. Она уходит на следующий экзамен, а ты ещё долго сидишь на её подоконнике.`,
  ], next:'j1'},
  {t:`Попросить её разузнать через знакомых, что Церебра знает о «Вельтах». Не объясняя зачем.`, hint:`Она многое может. Ты не знаешь почему.`, eff:{moral:-1, flag:'usedDana'}, res:[
    `— Можешь кое-что для меня узнать? У тебя же знакомые в клинике. Что Церебра знает о семье Вельт. Не спрашивай зачем.`,
    `Дана замирает. Потом кивает, очень медленно. — Узнаю, — говорит она. Уходя, она не оборачивается, и ты понимаешь, что попросил о чём-то большем, чем думал.`,
  ], next:'j1'},
]},

/* ---------- СЦЕНА 20. ВИВЬЕН ---------- */
j1:{scene:'s20', head:true, text:[
  `В конце января на университетскую почту приходит письмо: «Корпорация „Пандора“, отдел перспективных талантов, приглашает вас на собеседование о стажировке. Кофе за наш счёт».`,
  {when:s=>s.flags.adminKnowsLeo, text:`«Нам вас рекомендовал администратор кампуса, господин Пак».`},
  `Кафе на шестидесятом этаже делового центра. Внизу облака, над облаками солнце, которого в Южных кварталах не видели с октября.`,
  `Вивьен Кросс оказывается женщиной лет сорока в идеальном сером костюме, с короткой стрижкой и смеющимися глазами. Она пьёт чёрный кофе и не притворяется, что это собеседование.`,
  `— Давайте сэкономим время, Лео, — говорит она. — Или как вас называют в документах Церебры? Седьмой?`,
  `— В ноябре в вашем университете все турникеты Церебры одновременно сказали «ошибка идентификации». Церебра это видела. Мы тоже. Разница между нами в том, что они хотят вас вернуть, а мы — нанять.`,
], choices:[
  {t:`Спросить прямо, что нужно Пандоре.`, check:{stat:'mind', v:6},
    ok:{hint:`Вивьен скажет правду. Почти всю.`, eff:{rel:{viv:1}, flag:'vivTruth'}, res:[
      `— Что нужно Пандоре? — Ключ, конечно, — улыбается Вивьен. — Я не буду вам врать, это скучно. Нам нужен доступ к системам Церебры. Вы — единственный человек в городе, который может его дать.`,
      `— А взамен — стажировка, зарплата и защита вашей семьи. Настоящая, не на бумаге. Мы умеем прятать людей лучше, чем ваш отец.`,
    ]},
    fail:{hint:`Вивьен улыбнётся и уйдёт от ответа`, res:[`— Таланты, — улыбается Вивьен. — Пандоре нужны таланты. Разве это не очевидно?`]},
    next:'j2'},
  {t:`Сделать вид, что не понимаешь, о чём она.`, check:{stat:'charm', v:5},
    ok:{hint:`Вивьен оценит игру`, eff:{rel:{viv:1}, flag:'vivPlayed'}, res:[`— Седьмой? Это какой-то сериал? — Вивьен смеётся, искренне. — Прекрасно. Вы учитесь быстро. Это хорошее качество для стажёра.`]},
    fail:{hint:`Вивьен не купится`, res:[`— Седьмой? — Лео, — мягко говорит Вивьен, — у вас краснеют уши. Не тратьте силы.`]},
    next:'j2'},
  {t:`Встать и уйти.`, check:{stat:'will', v:5, bonus:[{when:s=>s.flags.forgaveReveal || s.flags.nikaBrother, why:'семья на твоей стороне'}]},
    ok:{hint:`Уйдёшь с достоинством`, eff:{rel:{viv:-1}, flag:'leftViv'}, res:[`Ты встаёшь. Вивьен не пытается тебя остановить, только протягивает визитку. — Когда Церебра постучит в вашу дверь, а она постучит, позвоните. — Ты берёшь визитку. Не выбрасываешь.`], next:'mon1'},
    fail:{hint:`Не хватит решимости`, res:[`Ты встаёшь. И садишься обратно. Вивьен делает вид, что не заметила.`], next:'j2'}},
]},

j2:{scene:'s20', text:[
  `Вивьен кладёт на стол визитку и контракт на три страницы. Шрифт крупный. Никаких сносок.`,
  `— Стажировка в Пандоре. Официально — отдел аналитики. Неофициально — вы учитесь, а мы вас прячем. Ваша семья переезжает в корпоративный жилой комплекс, куда Церебра не зайдёт без войны. Подумайте. Я не тороплю. Церебра будет торопить.`,
], choices:[
  {t:`Подписать.`, hint:`Пандора станет защитой. И хозяином.`, eff:{rel:{viv:2}, flag:'vivIntern'}, res:[
    `Ты подписываешь. Ручка тяжёлая, настоящая, золотая.`,
    `— Добро пожаловать, Лео, — говорит Вивьен и пожимает тебе руку. — Первый день — после февральских. Семье пока ничего не говорите. Им будет трудно понять.`,
  ], next:'mon1'},
  {t:`Сказать, что подумаешь.`, eff:{flag:'vivMaybe'}, res:[`— Я подумаю. — Разумеется, — кивает Вивьен. — Контракт оставьте себе. Он не сгорает. В отличие от вашего времени.`], next:'mon1'},
  {t:`Отказаться.`, eff:{rel:{viv:-1}, flag:'vivRefused'}, res:[`— Нет. — Вивьен кивает без обиды и забирает контракт. Визитку оставляет. — Все отказываются в первый раз. Хорошие — и во второй тоже.`], next:'mon1'},
]},

mon1:{scene:'mon1', head:true, text:[
  `Январь заканчивается. Ты больше не Лео Вельт, который ничего не знает. Ты Лео Вельт, который знает слишком много.`,
  {tag:'Новости Ноктиса', text:`«Церебра: программа „Лимен“ закрыта двадцать лет назад. Слухи о её продолжении — клевета конкурентов»`},
  {when:s=>s.flags.vivIntern || s.flags.vivMaybe, tag:'Новости Ноктиса', text:`«Пандора расширяет отдел перспективных талантов: „Мы ищем тех, кого не видят другие“»`},
  `Чем ты жил этот месяц?`,
], choices:[
  {t:`Тренировал дар с Тео.`, hint:`Дар станет послушнее. След станет заметнее.`, eff:{stat:{control:1}, why:`Месяц тренировок с Тео: замки, камеры, дроны.`, strange:1}, res:[`Замки, камеры, дроны. К концу месяца ты открываешь дверь будки, не касаясь её. Тео хлопает в ладоши, как ребёнок. Потом серьёзнеет: — След, Лео. Помни про след.`], next:'ev1'},
  {t:`Спортзал: телу тоже нужна защита.`, eff:{stat:{body:1}, why:`Январь в спортзале.`, flag:'trainedBody'}, res:[`Если за тобой придут, лучше уметь бегать и бить. Тренер-докер впервые говорит что-то кроме «Ещё раз»: «Неплохо».`], next:'ev1'},
  {t:`Изучал пути отхода по крышам.`, eff:{stat:{agi:1}, why:`Январь на крышах: пути отхода.`, flag:'roofRoutes'}, res:[`Ты изучаешь крыши Южных кварталов, как карту. Где пройти, где спрыгнуть, где спрятаться. На всякий случай.`], next:'ev1'},
  {t:`Читал папку «Лимен» от корки до корки.`, eff:{stat:{mind:1}, why:`Прочитал папку программы «Лимен».`, flag:'readLimen'}, res:[`Отчёты, графики, фамилии. Доктор Сорель — руководитель программы. Шесть образцов — шесть отчётов об «утилизации». Кроме одного. У Шестой в графе «статус» стоит: «Возвращена. Интегрирована».`], next:'ev1'},
  {t:`Больше времени проводил с Никой и мамой.`, eff:{stat:{charm:1}, why:`Январь с семьёй.`, rel:{nika:1, mom:1}}, res:[`Мама рассказывает про лабораторию. Про смешного лаборанта, который пел колыбельные ретортам. Про то, как ты впервые улыбнулся. Ника слушает и держит тебя за рукав.`], next:'ev1'},
  {t:`Учился не бояться: холодный душ, пробежка, никакой паники.`, eff:{stat:{will:1}, why:`Январь: учился не поддаваться страху.`}, res:[`Страх теперь живёт у тебя под рёбрами постоянно. Ты учишься с ним жить. Получается.`], next:'ev1'},
]},

/* ================= ФЕВРАЛЬ ================= */

/* ---------- СЦЕНА 21. ЗАДАНИЕ ---------- */
k1:{scene:'s21', head:true, mood:'tense', text:[
  `Первая неделя февраля. Урок у Тео заканчивается не как обычно: он запирает будку, гасит зелёную лампу и разворачивает на прилавке план твоей районной управы. Той самой, где в октябре вы стояли в очереди за справками.`,
  `— В твоей управе стоит кабина Церебры. Она помнит всех, кто был рядом с октября: тебя, отца, мать, Нику. Раз в неделю, в ночь на субботу, она отправляет всё это в башню «Лимен». Надо, чтобы в эту субботу она отправила пустоту.`,
  `Ночь на субботу. Управа тёмная, горит только дежурная лампа над входом.`,
  `Проникнуть внутрь можно по-разному.`,
], choices:[
  {t:`Тихо, через форточку и старые замки.`, check:{stat:'agi', v:5, bonus:[{when:s=>s.flags.roofRoutes, why:'ты изучил крыши квартала'}]},
    ok:{hint:`Никто не услышит`, res:[`Труба, карниз, форточка, которую тут не закрывали ни разу. Ты внутри, среди запаха хлорки и казённых бумаг.`], next:'k2'},
    fail:{hint:`Можешь нашуметь`, eff:{flag:'alarmK'}, res:[`Карниз скользкий. Ты влетаешь внутрь, сшибая что-то с полки. Где-то тонко запела сигнализация. Времени мало.`], next:'k2'}},
  {t:`Отключить сигнализацию через щиток снаружи.`, check:{stat:'tech', v:7, bonus:[{when:s=>s.flags.teoJob, why:'у Тео ты вскрывал и не такое'}]},
    ok:{hint:`Дом уснёт`, res:[`Щиток за углом, замок на нём для вида. Пара перемычек, и красный глазок над дверью гаснет.`], next:'k2'},
    fail:{hint:`Щиток капризный`, eff:{flag:'alarmK'}, res:[`Ты путаешь перемычки, и сигнализация будит полквартала. Времени мало.`], next:'k2'}},
  {t:`Попросить дверь открыться. Даром.`, hint:`Тихо, но оставит след.`, check:{stat:'control', v:2},
    ok:{hint:`Замок послушается`, eff:{strange:1}, res:[`Ты кладёшь ладонь на дверь и слушаешь. Замок думает о своих пружинах, о холоде. Ты просишь. Щелчок. Красный глазок моргает и горит дальше, будто ничего не было.`], next:'k2'},
    fail:{hint:`Дар капризнее замка`, eff:{strange:1, flag:'alarmK'}, res:[`Ты просишь слишком сильно, и разом открываются все двери первого этажа, а сигнализация заходится криком. Времени мало.`], next:'k2'}},
  {t:`Выждать, пока сторож уйдёт на обход, и войти в этот момент.`, check:{stat:'mind', v:6, bonus:[{when:s=>s.flags.grachDeal, why:'на камерах Грача ты научился следить за обходами'}]},
    ok:{hint:`Рассчитаешь время`, res:[`Сторож обходит здание раз в сорок минут, минута в минуту. Ты засекаешь время по его фонарику в окнах и входишь в служебную дверь, пока он на третьем этаже.`], next:'k2'},
    fail:{hint:`Можешь ошибиться со временем`, eff:{flag:'alarmK'}, res:[`Сторож возвращается раньше. Ты проскакиваешь мимо, но он успевает нажать кнопку. Времени мало.`], next:'k2'}},
  {t:`Уболтать ночного сторожа.`, check:{stat:'charm', v:5, bonus:[{when:s=>s.flags.marketJob, why:'месяц за прилавком у Рафы'}, {when:s=>s.moral>=3, why:'у тебя честное лицо: тебе верят'}, {when:s=>s.moral<=-2, why:'врать тебе всё легче'}]},
    ok:{hint:`Сторож поверит стажёру`, res:[`— Я стажёр из учёта, перчатки забыл, а в них ключи от дома… Сторож зевает во весь рот и верит. — Иди, стажёр. Свет не включай.`], next:'k2'},
    fail:{hint:`Сторож не в духе`, eff:{flag:'alarmK'}, res:[`Сторож смотрит на тебя, на часы и жмёт кнопку. Ты уходишь от него внутрь. Времени мало.`], next:'k2'}},
  {t:`Отжать плечом старую дверь подвала.`, check:{stat:'body', v:5, bonus:[{when:s=>s.flags.trainedBody, why:'месяцы тренировок'}]},
    ok:{hint:`Дверь поддастся без шума`, res:[`Дверь в подвал держится на честном слове и ржавой щеколде. Ты наваливаешься плечом, медленно, без рывка. Щеколда сдаётся с тихим вздохом.`], next:'k2'},
    fail:{hint:`Можешь выбить с грохотом`, eff:{flag:'alarmK'}, res:[`Дверь не поддаётся, потом поддаётся вся сразу, вместе с косяком. Грохот на весь двор. Где-то тонко запела сигнализация. Времени мало.`], next:'k2'}},
  {t:`Припугнуть ночного сторожа.`, show:s=>s.moral<=-1, hint:`Быстро. Но это уже не тот Лео, что в сентябре.`, eff:{moral:-1, flag:'scaredGuard'}, res:[`Ты заходишь к сторожу в будку и говоришь очень тихо, что знаешь, где он живёт. Это неправда. Но он верит. Он отдаёт ключи и отворачивается к стене. Руки у него трясутся. У тебя, почему-то, нет.`], next:'k2'},
]},

k2:{scene:'s21', mood:'tense', text:[
  `Зал ожидания ночью — аквариум без воды. Белая кабина светится сама, мягко и ровно.`,
  {when:s=>s.flags.alarmK, text:`Сигнализация поёт. Где-то хлопнула дверь. Минуты три, может, меньше.`},
  `На экране крутится логотип Церебры и строчка: «Синхронизация через 00:34».`,
], choices:[
  {t:`Стереть память кабины даром.`, hint:`Изнутри. Первый настоящий взлом.`, check:{stat:'control', v:3, bonus:[{when:s=>evCount(s,'teo')>=2, why:'вечера у Тео'}]},
    ok:{hint:`Кабина забудет`, eff:{stat:{control:1}, why:`Первый настоящий взлом: память кабины стёрта изнутри.`, strange:1, flag:'erasedData'}, res:[
      `Ты кладёшь ладонь на тёплый корпус. Кабина частит, как испуганная птица: лица, имена, проценты. Ты просишь её забыть.`,
      `Она забывает. Экран моргает: «Журнал пуст». Кровь из носа ты замечаешь не сразу.`,
    ]},
    fail:{hint:`Сотрёшь не всё`, eff:{strange:1, flag:'partialErase'}, res:[`Кабина вырывается, как живая. Ты стираешь половину, и голова взрывается болью. Половина — лучше, чем ничего.`]},
    next:'k3'},
  {t:`Снять заднюю панель и забрать накопитель.`, check:{stat:'tech', v:7, bonus:[{when:s=>s.flags.keptModule, why:'модуль калибровки: ты знаешь, как устроена кабина'}]},
    ok:{hint:`Унесёшь всё с собой`, eff:{flag:['erasedData','tookDrive']}, res:[
      `Восемь винтов, и накопитель размером с пачку жвачки у тебя в кармане. Кабина гаснет, как задутая свеча.`,
      `Дома ты подключаешь его к старому ноутбуку. Список «на совпадение», двенадцать строк. Первая: «Вельт Л., Южные кварталы. Вероятность 71%».`,
    ]},
    fail:{hint:`Застрянет`, eff:{flag:'partialErase'}, res:[`Винт срывается, накопитель застревает, и ты успеваешь только его разбить. Половина данных в труху.`]},
    next:'k3'},
  {t:`Найти в меню кабины ручную очистку.`, check:{stat:'mind', v:6, bonus:[{when:s=>s.flags.knowsRules || s.flags.grachKnowsCabins, why:'ты знаешь, как устроены кабины изнутри'}]},
    ok:{hint:`Официально и чисто`, eff:{flag:'erasedData'}, res:[`Сервисное меню прячется за логотипом, если держать палец пять секунд. «Очистить локальный журнал? Да». Кабина услужливо мигает: «Готово». Она даже не поняла, что её ограбили.`]},
    fail:{hint:`Заблудишься в меню`, eff:{flag:'partialErase'}, res:[`Меню уводит по кругу, пароль на паролях. Ты успеваешь стереть только последнюю неделю.`]},
    next:'k3'},
]},

k3:{scene:'s21', text:[
  {when:s=>s.flags.alarmK, text:`Ты уходишь тем же путём под вой сигнализации. Во дворе уже мигают фары. Ты сворачиваешь в проходной двор, который знаешь, а они — нет, и растворяешься в дожде.`},
  {when:s=>!s.flags.alarmK, text:`Ты уходишь так же тихо, как пришёл. Управа за спиной спит и видит казённые сны.`},
  {when:s=>s.flags.erasedData, text:`Дело сделано. В эту субботу в башню «Лимен» уйдёт пустота там, где была твоя семья.`},
  {when:s=>s.flags.partialErase, text:`Ты стёр половину. В субботу в башню уйдёт наполовину пустой журнал. Это лучше, чем целый. Но это не пустота.`},
  `Тео ждёт тебя в будке, не спит.`,
], choices:[
  {t:`«Готово».`, eff:{rel:{teo:1}}, res:[`Тео смотрит на кровь у тебя под носом и молча протягивает платок. — Первый раз всегда так, — говорит он. — Со временем перестанет идти. Или не перестанет. У всех по-разному.`], next:'l1'},
  {t:`Спросить, как часто так можно, пока это не убьёт.`, hint:`Тео знает по опыту. Чужому.`, check:{stat:'mind', v:6},
    ok:{hint:`Тео скажет правду`, eff:{flag:'knowsCost'}, res:[
      `Тео долго молчит. — Шестая делала это часто, — говорит он наконец. — Слишком часто. К концу она забывала, кто она. Дар брал память в уплату. Каждый раз немного.`,
      `— Так что считай, Лео. Каждый раз считай, стоит ли оно того.`,
    ]},
    fail:{hint:`Тео уйдёт от ответа`, res:[`— Реже, чем хочется, — отвечает Тео. — Чаще, чем можно. — И отворачивается.`]},
    next:'l1'},
]},

/* ---------- СЦЕНА 22. ИСПОВЕДЬ ТЕО ---------- */
l1:{scene:'s22', head:true, text:[
  `Через неделю после управы, когда урок закончен, Тео не отпускает тебя. Наливает две кружки чая, себе и тебе, чего не делал никогда.`,
  `— Ты спрашивал, откуда я знаю таких, как ты, — говорит он. — Слушай.`,
  `— Шестнадцать лет назад в «Лимене» была девочка. Шестой образец. Единственная до тебя, кто выжил. Её звали… неважно, как её звали. Ей было двенадцать. Я отвечал за её безопасность.`,
], choices:[
  {t:`«Что с ней случилось?»`, res:[`Тео поднимает ладонь: дай договорить.`], next:'l1b'},
  {t:`Молча слушать.`, res:[`Ты молчишь. Тео кивает, будто молчание ему и было нужно.`], next:'l1b'},
]},

l1b:{scene:'s22', text:[
  `— Она попросилась на волю. Я мог помочь. Вместо этого я сдал её Церебре обратно. За это, — он показывает на мёртвый глаз, — и за свободу. Свою.`,
  `— А через год родился ты. И я увидел твоих родителей, которые собирались бежать. И я решил: этих я вынесу. Хоть этих.`,
  `Он смотрит на тебя мёртвым глазом и живым. — Я помог твоей семье не потому, что добрый. А потому что однажды был очень недобрым. Теперь ты знаешь.`,
], choices:[
  {t:`«Ты искупаешь одну девочку мной. Это нечестно по отношению к нам обоим».`, check:{stat:'mind', v:6},
    ok:{hint:`Тео услышит`, eff:{rel:{teo:1}, flag:'teoUnderstood'}, res:[`Тео долго молчит. — Умный, — говорит он наконец. — Да. Нечестно. Но это всё, что у меня есть. Прости старика.`]},
    fail:{hint:`Прозвучит жёстче, чем хотел`, eff:{rel:{teo:-1}}, res:[`Слова выходят злее, чем ты хотел. Тео кивает, будто получил заслуженную пощёчину, и не спорит.`]},
    next:'l2'},
  {t:`«Спасибо, что вынес нас. Остальное — не моё дело».`, eff:{rel:{teo:2}, flag:'forgaveTeo'}, res:[`— Спасибо, что вынес нас. Тео отворачивается к мониторам, и плечи у него вздрагивают. — Иди домой, — говорит он хрипло. — Поздно уже.`], next:'l2'},
  {t:`«А что стало с Шестой?»`, hint:`Тео может не захотеть отвечать.`, eff:{flag:'askedSixth'}, res:[
    `— Что с ней стало? — Не знаю, — говорит Тео, и ты видишь, что он врёт. — Церебра забрала её. Больше я её не видел. — Он врёт, и вы оба это знаете. Но давить сейчас — жестоко.`,
  ], next:'l2'},
  {t:`Молча допить чай и уйти.`, res:[`Ты допиваешь чай молча. У двери оборачиваешься. Тео сидит спиной, маленький и старый. — До вторника, — говоришь ты. — До вторника, — отвечает он, не оборачиваясь.`], next:'l2'},
]},

/* ---------- СЦЕНА 23. ДАНА ---------- */
l2:{scene:'s23', head:true, text:[
  `С Даной вы почти не виделись весь февраль: то у неё Мигель, то у тебя «дела». Дела, о которых ты не можешь рассказать. Она это чувствует.`,
  `В субботу она сама приходит к мастерской. Стоит под козырьком, мокрая, без зонта.`,
  `— Нам надо поговорить, — говорит она. — Пока я не передумала.`,
], choices:SHARED_CHOICES.DANA_REVEAL},

l3:{scene:'s23', text:[
  `Дана сидит на ступеньке мастерской, обхватив колени. Дождь стучит по козырьку.`,
  `— Церебра платит за имплант Мигеля, — говорит она глухо. — Без обслуживания он умрёт за неделю. Год назад они пришли и сказали: будешь смотреть за одним студентом и писать отчёты — брат живёт. Не будешь — не живёт. Вот и всё. Вот и весь я, страшный шпион.`,
], choices:[
  {t:`Сесть рядом с ней.`, res:[`Ты садишься рядом, на мокрую ступеньку. Дана не отодвигается.`], next:'l3b'},
  {t:`Остаться стоять.`, res:[`Ты стоишь под козырьком и слушаешь. Капли стучат по металлу, как метроном.`], next:'l3b'},
]},

l3b:{scene:'s23', text:[
  `— Я не знала, кто ты. Правда не знала. Мне сказали: «проверь этого парня». Я и проверяла. А потом ты дал мне адрес мастерской, и починил стенд, и был… ты. И я поняла, что не могу больше писать эти отчёты. И что если перестану, Мигель…`,
  {when:s=>s.flags.toldDanaSecret, text:`— Ты рассказал мне про «Лимен». В январе, на подоконнике. Я должна была написать это в отчёте в тот же вечер. Я не написала. Это первое, что я им не написала.`},
  {when:s=>s.flags.honestDana && !s.flags.toldDanaSecret, text:`— Ты ни разу мне не соврал. Даже когда нечего было сказать, говорил «не знаю». А я врала тебе каждый день. Знаешь, как это?`},
  {when:s=>s.flags.liedDana && !s.flags.honestDana, text:`— Ты мне тоже врал, я знаю. Про отца-самоучку. Я так и написала в отчёте: «семья обычная». Это было враньё поверх вранья, и почему-то от этого легче не стало.`},
  {when:s=>s.flags.usedDana, text:`— Ты попросил меня узнать про Вельтов. Я узнала. И поняла, что ты тоже умеешь пользоваться людьми. Мы квиты, Лео.`},
  {when:s=>s.flags.danaWarned, text:`— Про людей в сером я предупредила тебя сама. Это было единственное, что я могла.`},
  `Она поднимает на тебя мокрое лицо. — Прости. Я не имела права к тебе привязываться. Но я привязалась.`,
], choices:[
  {t:`«Мы вылечим Мигеля без Церебры. Обещаю».`, hint:`Обещание, которое трудно сдержать.`, eff:{moral:1, rel:{dana:2}, flag:'promiseMiguel'}, res:[
    `— Мы что-нибудь придумаем. Тео разбирается в имплантах. Найдём способ обслуживать его сами. Ты больше никому ничего не должна.`,
    `Дана смотрит на тебя так, будто ты сказал, что дождь можно выключить. — Ты сумасшедший, — шепчет она. — Ты правда сумасшедший. — И утыкается тебе в плечо.`,
  ], next:'l4'},
  {t:`Предложить: пусть пишет отчёты дальше, но такие, какие нужны вам.`, check:{stat:'mind', v:6, bonus:[{when:s=>s.flags.sawCurator || s.flags.askedCurator, why:'ты знаешь про Куратора'}, {when:s=>s.moral<=0, why:'ты научился думать как они'}]},
    ok:{hint:`Дана станет двойным агентом`, eff:{rel:{dana:1}, flag:'doubleDana'}, res:[
      `— Не переставай писать отчёты, — говоришь ты. — Пиши. Только теперь мы решаем, что в них. Церебра будет знать ровно то, что мы захотим.`,
      `Дана медленно поднимает голову. В глазах у неё что-то новое: не вина, а расчёт. — Это опасно. — Опаснее, чем сейчас, уже некуда. — Она кивает. У вас теперь есть глаз внутри Церебры.`,
    ]},
    fail:{hint:`Дана испугается`, eff:{rel:{dana:1}}, res:[`— Я не смогу, — качает головой Дана. — Если они поймут, что я вожу их за нос, Мигель… Нет. Я просто перестану. Совсем. Будь что будет.`]},
    next:'l4'},
  {t:`«Ты писала отчёты про меня год. Мне надо это переварить».`, eff:{rel:{dana:-1}, flag:'coldDana'}, res:[
    `— Год, Дана. Ты год за мной следила. Я понимаю про Мигеля. Но мне надо… мне надо побыть одному.`,
    `Дана встаёт. — Понимаю, — говорит она ровным голосом, за которым слишком много всего. — Спасибо, что выслушал. — И уходит под дождь, так и не взяв зонт.`,
  ], next:'l4'},
]},

l4:{scene:'s23', text:[
  {when:s=>s.flags.coldDana, text:`Дана уходит в дождь. Ты стоишь под козырьком и понимаешь, что впервые в жизни промолчал там, где надо было обнять. И что это, наверное, ошибка.`},
  {when:s=>!s.flags.coldDana, text:`Дождь всё идёт. Вы сидите на ступеньке мастерской, и впервые за долгое время между вами нет ни одной тайны. Это странное, лёгкое чувство. Как будто сняли рюкзак, который ты носил, не замечая.`},
], choices:[
  {t:`Сидеть с ней, пока не кончится дождь.`, show:s=>!s.flags.coldDana, eff:{rel:{dana:1}}, res:[
    `Дождь не кончается: в Ноктисе он никогда не кончается. Вы сидите, пока у Даны не звонит будильник на таблетки Мигеля. Она встаёт, отряхивает джинсы и на секунду кладёт ладонь тебе на затылок. — До понедельника, — говорит она. — До понедельника.`,
  ], next:'mon2'},
  {t:`Проводить её до станции.`, show:s=>!s.flags.coldDana, res:[
    `Ты раскрываешь над ней зонт, и вы идёте к станции молча, плечом к плечу. На платформе Дана оборачивается: — Спасибо, что не выгнал. — Ты же знаешь, где мастерская, — говоришь ты. — Приходи и без повода.`,
  ], next:'mon2'},
  {t:`Написать ей вечером: «Мне нужно время. Дело не в тебе».`, show:s=>s.flags.coldDana, res:[
    `Ты пишешь, стираешь, пишешь снова. В итоге отправляешь восемь слов. Ответ приходит через час: «Понимаю». Одно слово. Ты перечитываешь его до ночи.`,
  ], next:'mon2'},
  {t:`Ничего не делать. Пусть пройдёт время.`, show:s=>s.flags.coldDana, res:[
    `Ты опускаешь рольставню и садишься за верстак. Паяльник, схема, припой. Руки работают, голова молчит. К полуночи ты чинишь три чужих комма и ни одной своей мысли.`,
  ], next:'mon2'},
]},

mon2:{scene:'mon2', head:true, text:[
  `Февраль на исходе. Ты живёшь двумя жизнями сразу: студент днём, кто-то другой ночью. Обе требуют сил.`,
  {when:s=>s.flags.erasedData && !s.flags.tookDrive, tag:'Новости Ноктиса', text:`«Кабина биометрии в управе Южных кварталов потеряла журнал за полгода. Причина: сбой питания»`},
  {when:s=>s.flags.tookDrive, tag:'Новости Ноктиса', text:`«Из кабины биометрии в управе Южных кварталов пропал накопитель. Церебра обещает награду»`},
  {when:s=>s.flags.scaredGuard, tag:'Новости Ноктиса', text:`«Ночной сторож управы Южных кварталов уволился после „неприятного инцидента“. Подробности не раскрываются»`},
  {when:s=>s.flags.alarmK, tag:'Новости Ноктиса', text:`«Ночью в управе Южных кварталов сработала сигнализация. Полиция: „Ничего не пропало“»`},
  {when:s=>s.flags.vivIntern, text:`А по вторникам есть и третья: стажировка в Пандоре. Стеклянный отдел аналитики, где тебя ни о чём не спрашивают. Вивьен заходит раз в неделю и спрашивает только об одном: как дела у семьи.`},
  `Чем ты жил этот месяц?`,
], choices:[
  {t:`Тренировал дар с Тео.`, hint:`Дар послушнее. След заметнее.`, eff:{stat:{control:1}, why:`Февраль тренировок с Тео.`, strange:1}, res:[`Ты уже не злишься на замки. Ты с ними договариваешься. Тео говорит, что у Шестой так не выходило и за полгода.`], next:'ev2'},
  {t:`Готовил тело к худшему.`, eff:{stat:{body:1}, why:`Февраль в спортзале.`, flag:'trainedBody'}, res:[`Если дар подведёт, останутся руки и ноги. Ты качаешь и то, и другое.`], next:'ev2'},
  {t:`Учил крыши и подземелья квартала.`, eff:{stat:{agi:1}, why:`Февраль на путях отхода.`, flag:'roofRoutes'}, res:[`Ты знаешь теперь три способа уйти из дома незамеченным. На всякий случай.`], next:'ev2'},
  {t:`Разбирал накопитель из кабины.`, show:s=>s.flags.tookDrive, eff:{stat:{mind:1}, why:`Февраль над накопителем из кабины Церебры.`, flag:'studiedDrive'}, res:[`В накопителе не только список кандидатов. Там протокол «Возврат образца»: как именно Церебра забирает своих обратно. Чтение не из приятных.`], next:'ev2'},
  {t:`Читал всё про импланты, чтобы помочь Мигелю.`, show:s=>s.flags.promiseMiguel, eff:{stat:{mind:1}, why:`Февраль над схемами импланта Мигеля.`, flag:'studiedMiguel'}, res:[`Имплант Мигеля можно обслуживать вручную, если достать редкий картридж-стабилизатор. Такие бывают только у Церебры. Или на очень чёрном рынке.`], next:'ev2'},
  {t:`Держался, чтобы не сойти с ума от двойной жизни.`, eff:{stat:{will:1}, why:`Февраль на одной силе воли.`}, res:[`Две жизни, один ты. Ты держишь обе, и ни одна пока не рухнула.`], next:'ev2'},
]},

/* ================= МАРТ ================= */

/* ---------- СЦЕНА 24. ОБЛАВА ---------- */
m1a:{scene:'s24', head:true, mood:'tense', text:[
  `Они приходят в ночь на пятое марта. Не люди в сером — эти были разведкой. Приходят тихие люди в тёмном, с фургоном без номеров, который встаёт у мастерской в три часа ночи.`,
  {when:s=>s.flags.erasedData, text:`Ты стёр журнал кабины, и это дало вам месяцы. Но не годы. Рано или поздно они всё равно свели концы.`},
  {when:s=>s.flags.partialErase || !s.flags.erasedData, text:`Журнал ты стёр не весь, и они собрали остальное по крупицам. Вот и собрали.`},
  {when:s=>s.flags.helpedBag || s.flags.askedBag, text:`Отец будит тебя одним словом: «Рюкзак». Ты вскакиваешь раньше, чем просыпаешься. Рюкзак под верстаком, ты помнишь.`},
  {when:s=>!(s.flags.helpedBag || s.flags.askedBag), text:`Отец трясёт тебя за плечо. Лицо у него белое. — Они здесь. Буди Нику.`},
  `Первый удар в рольставню. Она держит. Второй. Держит. У вас есть минута, может, две.`,
], choices:[
  {t:`Уходить всем через крышу, пути ты знаешь.`, check:{stat:'agi', v:6, bonus:[{when:s=>s.flags.roofRoutes, why:'ты изучил крыши квартала'}]},
    ok:{hint:`Уведёшь семью`, eff:{flag:'familyEscaped'}, res:[
      `Люк на крышу, доска на соседнее здание, пожарная лестница, проходной двор. Ты ведёшь семью тем путём, который учил всю зиму. Ника не отстаёт. Мать держится. Отец замыкает.`,
      `Внизу воет фургон, но вас там уже нет. Вы уходите в дождь вчетвером.`,
    ], next:'m2c'},
    fail:{hint:`Кого-то могут перехватить`, eff:{flag:'dadTaken'}, res:[
      `Ты ведёшь семью на крышу, но у соседнего дома вас ждут. Отец отталкивает тебя к люку. — Уводи их! — Он бросается на тёмные фигуры, чтобы дать вам секунды. Ты успеваешь увести мать и Нику. Отца — нет.`,
    ], next:'m2c'}},
  {t:`Спрятать всех в тайнике под полом мастерской.`, check:{stat:'will', v:4},
    ok:{hint:`Семья спрячется. Но кто-то должен их отвлечь.`, eff:{flag:'dadTaken'}, res:[
      `Тайник, где отец хранил папку «Лимена», тесный, но вместит троих. Ты загоняешь туда мать и Нику и лезешь сам. Отец опускает над вами половицу.`,
      `— Пап! — Тихо, — говорит он сверху. — Им нужен кто-то. Пусть это буду я.`,
      `Ставня падает. Шаги, голоса, щелчок наручников. Потом тишина. Вы сидите в темноте до утра.`,
    ]},
    fail:{hint:`Паника может всех выдать`, eff:{flag:'dadTaken'}, res:[`Ника всхлипывает в темноте тайника слишком громко. Отец наверху громко роняет ящик с инструментами, отвлекая их на себя, и выходит к ним сам, чтобы они не стали искать дальше.`]},
    next:'m2c'},
  {t:`Задержать их даром, пока семья уходит.`, hint:`Дорого. Но выиграет время.`, check:{stat:'control', v:4, bonus:[{when:s=>evCount(s,'teo')>=2, why:'вечера у Тео'}]},
    ok:{hint:`Обесточишь весь квартал`, eff:{stat:{control:1}, why:`Обесточил квартал, чтобы прикрыть семью.`, strange:2, flag:'familyEscaped'}, res:[
      `Ты кладёшь обе ладони на рольставню и просишь квартал уснуть. Весь. Свет гаснет на три улицы. Фургон глохнет. Фонарики в темноте мечутся, как светлячки.`,
      `Под этот покров отец уводит мать и Нику через крышу. Ты уходишь последним, шатаясь, с двумя дорожками крови из носа. Но уходишь. Все уходят.`,
    ], next:'m2c'},
    fail:{hint:`Дар может тебя подвести`, eff:{strange:2, flag:['dadTaken','leoWeak']}, res:[
      `Ты просишь слишком много и сразу. Свет гаснет, но и ты гаснешь: колени подгибаются, мир заваливается набок. Отец подхватывает тебя, выталкивает к матери и Нике. — Уводите его! А сам остаётся в темноте, чтобы вас не догнали.`,
    ], next:'m2c'}},
  {t:`Позвать на помощь тех, кто должен.`, show:s=>s.flags.grachDeal || s.flags.froze || s.flags.foundReset || evCount(s,'kit')>=2, hint:`У квартала длинная память на услуги.`, eff:{flag:['calledFavor','familyEscaped']}, res:s=>[
      s.flags.grachDeal ? `Ты жмёшь тревожную кнопку, которую сам встроил в камеры Грача «на всякий случай». Через минуту переулок заполняют люди Грача: молча, деловито, как на работу. Тёмные фигуры у фургона впервые оказываются в меньшинстве.` : (s.flags.froze || s.flags.foundReset) ? `Ты кричишь в ночь имя Барро, и старый солдат выходит из темноты с протезом наперевес. Один против фургона. Этого хватает на те секунды, что нужны семье.` : `Ты свистишь в два пальца, как учил Кит. Через минуту с крыш рынка сыплются мальчишки: орут, швыряют в фургон гнилые овощи и светят фонариками в лица. Тёмные фигуры теряют драгоценные секунды.`,
      `Под шумок вы уходите через крышу. Все четверо.`,
    ], next:'m2c'},
  {t:`Держать рольставню, пока семья уходит через люк.`, hint:`Ты уйдёшь последним. Если уйдёшь.`, check:{stat:'body', v:6, bonus:[{when:s=>s.flags.trainedBody, why:'месяцы тренировок'}]},
    ok:{hint:`Выдержишь, пока все уйдут`, eff:{flag:['familyEscaped','heldShutter']}, res:[
      `Ты упираешься в рольставню плечом и спиной. Удар. Ещё удар. Металл гнётся, но держит, потому что держишь ты. — Уходите! — Отец выталкивает мать и Нику в люк на крышу и оборачивается к тебе. — Иди, пап!`,
      `Последний удар ты встречаешь уже на лестнице. Ставня падает внутрь, но в мастерской пусто. Вы уходите в дождь вчетвером, а у тебя до утра гудит плечо.`,
    ], next:'m2c'},
    fail:{hint:`Ставня может не выдержать`, eff:{flag:'dadTaken'}, res:[
      `Ставня держит два удара. На третьем она прогибается, и тебя отбрасывает на верстак. Отец рывком поднимает тебя и толкает к люку: — Уводи их! — А сам встаёт у ставни, где только что стоял ты.`,
    ], next:'m2c'}},
  {t:`Разбудить соседей: ты годами чинил им всё бесплатно.`, show:s=>s.moral>=3, hint:`Квартал помнит добро.`, eff:{flag:['familyEscaped','calledNeighbors']}, res:[
    `Ты выскакиваешь через чёрный ход и колотишь в двери. Госпожа Сун, Рафа, семья с третьего этажа, которой ты чинил холодильник. Через минуту переулок полон людей в халатах и с фонарями, которые громко спрашивают, что тут происходит.`,
    `Тихие люди в тёмном не любят свидетелей. Фургон уезжает, так и не выломав ставню. Вы уходите через крышу, все четверо, пока соседи загораживают переулок.`,
  ], next:'m2c'},
]},

m2c:{scene:'s24', text:[
  {when:s=>s.flags.familyEscaped && !s.flags.dadTaken, text:`Вы отсиживаетесь в будке Тео. Все четверо, живые. Тео молча кипятит чайник на всех. Мать не выпускает руку Ники. Отец смотрит в стену.`},
  {when:s=>s.flags.dadTaken, text:`Вы отсиживаетесь в будке Тео. Втроём. Место отца пустое. Мать не плачет: она сидит очень прямо и очень тихо, и это страшнее слёз. Ника вцепилась в тебя и не отпускает.`},
  {when:s=>s.flags.dadTaken, text:`— Они взяли Адама вместо тебя, — говорит Тео глухо. — Это временно. Им нужен ты. Он — приманка.`},
  `В мастерскую возвращаться нельзя. К утру Тео находит вам две комнаты над прачечной на рынке: сыро, тесно, зато хозяйка не спрашивает имён.`,
], choices:[
  {t:`Пообещать матери: «Я его верну».`, show:s=>s.flags.dadTaken, eff:{rel:{mom:1}}, res:[
    `— Я его верну, мам. — Мать смотрит на тебя долго, будто видит впервые. Потом берёт твоё лицо в ладони. — Не обещай. Просто вернись сам. — Ты всё равно обещаешь. Про себя.`,
  ], next:'m3a'},
  {t:`Сесть рядом с Никой и не отпускать её руку до утра.`, show:s=>s.flags.dadTaken, eff:{rel:{nika:1}}, res:[
    `Ты садишься рядом с Никой. Она кладёт голову тебе на плечо и засыпает только под утро, так и не разжав пальцы. Ты не спишь вовсе. Смотришь на дверь и думаешь, с чего начать.`,
  ], next:'m3a'},
  {t:`Сказать: «Все живы. Остальное починим».`, show:s=>!s.flags.dadTaken, eff:{rel:{dad:1}}, res:[
    `— Все живы, — говоришь ты. — Остальное починим. — Отец впервые за ночь отрывает взгляд от стены. — Это моя фраза, — говорит он. — Двадцать лет её говорю. — Значит, работает.`,
  ], next:'m3a'},
  {t:`Спросить Тео, что дальше.`, res:s=>[
    `— Что дальше? — Тео разливает чай по кружкам, одна с отбитой ручкой. — Дальше они не отступят, — говорит он. — Им нужен ты, и они это только что всем показали.`,
    s.flags.dadTaken ? `— Значит, пойду за отцом. — Не один, — отвечает Тео. — И не завтра. Сначала выспись. Утром будут новости, я чую.` : `— Значит, надо успеть раньше них. — Успеем, — говорит Тео. — Утром будут новости, я чую. Сначала выспись.`,
  ], next:'m3a'},
  {t:`Вернуться под утро к мастерской: проверить, не досталось ли соседям.`, hint:`Опасно. Но они тебе не чужие.`, eff:{moral:1, flag:'checkedNeighbors'}, res:[
    `Под утро ты возвращаешься дворами. У госпожи Сун выбита дверь: искали тебя. Сама она сидит на кухне в пальто и держит в руках чашку, которая давно остыла.`,
    `Ты чинишь ей замок, пока светает. — Уходи, мальчик, — говорит она, когда ты заканчиваешь. — И береги своих. — Потом, подумав, суёт тебе в карман пакет с печеньем.`,
  ], next:'m3a'},
]},

/* ---------- СЦЕНА 25. БАШНЯ ПАНДОРЫ ---------- */
m3a:{scene:'s25', head:true, text:[
  {when:s=>s.flags.vivIntern || s.flags.vivMaybe || s.flags.leftViv, text:`Тео был прав: новости приходят утром. Комм звонит в комнате над прачечной. Вивьен Кросс. — Я слышала, у вас была трудная ночь, — говорит она без «здравствуйте». — Пандора может это исправить. Поднимайтесь. Шестидесятый этаж.`},
  {when:s=>s.flags.vivRefused, text:`Утром, в комнате над прачечной, ты находишь визитку Вивьен на дне рюкзака. Ты клялся, что не позвонишь. Ты звонишь. — Я знала, что вы передумаете, — говорит она мягко. — Поднимайтесь.`},
  `Деловой центр. Шестидесятый этаж. Над облаками солнце. Вивьен ждёт тебя не в кафе, а в переговорной со стеклянными стенами, за которыми весь Ноктис лежит, как схема.`,
  {when:s=>s.flags.dadTaken, text:`— Вашего отца держат в башне «Лимен», — говорит Вивьен без предисловий. — Тридцать первый этаж, медицинский блок. Живой. Пока полезен как приманка. Я могу его оттуда достать. Пандора может.`},
  {when:s=>!s.flags.dadTaken, text:`— Церебра не отступит, — говорит Вивьен. — Вчера был фургон. Завтра будет что-то серьёзнее. Пандора может спрятать вашу семью так, что их не найдут. Но за услугу платят услугой.`},
], choices:[
  {t:`Спросить прямо: какова цена.`, check:{stat:'mind', v:6, bonus:[{when:s=>s.flags.vivTruth, why:'в январе Вивьен уже была с тобой откровенна'}]},
    ok:{hint:`Вивьен назовёт всё`, eff:{rel:{viv:1}, flag:'vivPrice'}, res:[
      `— Цена, — Вивьен наливает вам обоим воды. — Один раз вы войдёте в сеть Церебры и откроете нам её архивы. Изнутри, ключом. Всё, что Церебра прячет двадцать лет, станет нашим. После этого вы свободны, а ваша семья — под нашей защитой навсегда.`,
      `— Я не буду делать вид, что это благотворительность. Это сделка. Но это честная сделка.`,
    ]},
    fail:{hint:`Вивьен смягчит формулировки`, res:[`— Сущий пустяк, — улыбается Вивьен. — Немного сотрудничества. Детали позже.`]},
    next:'m3b'},
  {t:`Спросить, чем Пандора лучше Церебры.`, check:{stat:'charm', v:5, bonus:[{when:s=>s.flags.vivPlayed, why:'ты уже переиграл её однажды'}, {when:s=>s.moral<=0, why:'с циником Вивьен откровеннее'}]},
    ok:{hint:`Вивьен ответит честно`, eff:{flag:'vivHonestEvil'}, res:[
      `— Ничем, — легко отвечает Вивьен. — Мы такие же. Разница в одном: Церебра хочет вас разобрать и изучить. А мне вы полезнее целым и довольным. Циничная разница, но для вас существенная.`,
    ]},
    fail:{hint:`Вивьен уйдёт от ответа`, res:[`— Мы люди будущего, а они люди прошлого, — гладко говорит Вивьен рекламным голосом. Ты не веришь ни слову.`]},
    next:'m3b'},
]},

m3b:{scene:'s25', text:[
  `Вивьен встаёт и подходит к стеклянной стене. Отсюда башня Церебры видна как на ладони: чёрная игла с белой короной огней наверху.`,
  `— Вон она, «Лимен». Тридцать первый этаж, где горит белым. Красиво, да? Двадцать лет там держат в банках то, что осталось от шести детей. И одного, который выжил.`,
  `Она поворачивается к тебе. — Я не давлю. Я показываю. Решать вам, Лео.`,
], choices:[
  {t:`Принять помощь Пандоры.`, hint:`Союзник против Церебры. С собственным счётом.`, eff:{rel:{viv:2}, flag:'alliedViv'}, res:[
    `— Хорошо. Мы договорились.`,
    `Вивьен пожимает тебе руку. Ладонь у неё сухая и прохладная. — Вы приняли взрослое решение. Я подготовлю операцию. Мы вытащим вашего отца и войдём в «Лимен» одновременно. Одна ночь, один шанс.`,
  ], next:'mon3'},
  {t:`Отказаться: ты справишься сам, со своими.`, hint:`Гордо. И опасно.`, eff:{rel:{viv:-1}, flag:'refusedViv'}, res:[
    `— Нет. Я не стану менять одну корпорацию на другую.`,
    `Вивьен не сердится. — Уважаю, — говорит она. — Глупо, но уважаю. Визитка всё ещё действует. Учтите: в одиночку в «Лимен» ещё никто не входил и не выходил.`,
  ], next:'mon3'},
  {t:`Согласиться, но тайно решить обмануть Пандору.`, show:s=>s.stats.mind>=7, hint:`Опасная двойная игра.`, eff:{rel:{viv:1}, flag:['alliedViv','planBetrayViv']}, res:[
    `— Договорились, — говоришь ты и жмёшь ей руку, уже зная, что не отдашь Пандоре архивы. Пусть поможет вытащить отца. Дальше ты решишь сам.`,
    `Вивьен улыбается тебе тепло и открыто. На секунду тебе становится не по себе: а вдруг она тоже так улыбается?`,
  ], next:'mon3'},
  {t:`Принять помощь и отдать Пандоре Тео: он знает о «Лимене» больше, чем ты.`, hint:`Вивьен оценит. Тео — нет.`, eff:{moral:-2, rel:{viv:2, teo:-3}, flag:['alliedViv','soldTeo']}, res:[
    `— Хорошо. И ещё. Есть человек, который работал в «Лимене» инженером безопасности. Тео Бартал. Он знает башню лучше меня.`,
    `Вивьен улыбается чуть шире обычного. — Вы быстро учитесь, Лео. — Вечером Тео не открывает тебе дверь будки. Через стекло ты видишь, как он молча собирает вещи. Он уже знает.`,
  ], next:'mon3'},
]},

mon3:{scene:'mon3', head:true, text:[
  `Март на исходе. Ты больше не строишь планов на годы. Ты строишь планы на дни.`,
  {when:s=>s.flags.dadTaken, tag:'Новости Ноктиса', text:`«Инженер из Южных кварталов задержан по делу о промышленном шпионаже. Имя не называется»`},
  {when:s=>!s.flags.dadTaken, tag:'Новости Ноктиса', text:`«Мастерская под эстакадой закрыта уже месяц. Соседи не знают, куда делись хозяева»`},
  {when:s=>s.flags.alliedViv, tag:'Новости Ноктиса', text:`«Акции Пандоры выросли на четыре процента: аналитики ждут „крупной сделки“»`},
  `Чем ты жил этот месяц?`,
], choices:[
  {t:`Тренировал дар до предела.`, hint:`Дар острее. След ярче. Церебра ближе.`, eff:{stat:{control:2}, why:`Март на пределе: дар отточен до предела.`, strange:2}, res:[`Ты можешь теперь то, о чём Тео говорит шёпотом. Открыть, погасить, стереть. Тео смотрит на тебя со смесью гордости и страха. — Не увлекайся, — повторяет он. — Не увлекайся.`], next:'ev3'},
  {t:`Готовил тело к штурму башни.`, eff:{stat:{body:1}, why:`Март подготовки к штурму.`, flag:'trainedBody'}, res:[`Бег с грузом, лестницы, задержка дыхания. Если дар откажет в башне, тело не должно.`], next:'ev3'},
  {t:`Отрабатывал проникновение и отход.`, eff:{stat:{agi:1}, why:`Март на отработке проникновений.`, flag:'roofRoutes'}, res:[`Ты лазаешь по строительным лесам, учишься вскрывать окна и уходить по карнизам. Тео говорит: «У Шестой руки были золотые. Как у тебя».`], next:'ev3'},
  {t:`Изучал планы башни «Лимен».`, eff:{stat:{mind:1}, why:`Март над планами башни «Лимен».`, flag:'studiedTower'}, res:[`Тео и Дана по крупицам собрали план башни. Тридцать первый этаж, медблок, серверное ядро на тридцать пятом. Ты знаешь дорогу наизусть. Осталось по ней пройти.`], next:'ev3'},
  {t:`Сколачивал команду: говорил с каждым.`, eff:{stat:{charm:1}, why:`Март на переговорах: собирал команду.`, flag:'ralliedTeam'}, res:[`Грач, Барро, Кит, Рафа, соседи. Ты говоришь с каждым. Не все соглашаются. Но многие. В Ноктисе, оказывается, есть люди, которые готовы драться не за деньги.`], next:'ev3'},
  {t:`Держал семью и себя от паники.`, eff:{stat:{will:1}, why:`Март на воле: держал всех от паники.`}, res:[`Кто-то должен быть спокойным, когда все боятся. Этим кем-то стал ты. Тебе девятнадцать. Иногда ты чувствуешь себя на сто.`], next:'ev3'},
]},

/* ================= АПРЕЛЬ ================= */

/* ---------- СЦЕНА 26. НИКА ---------- */
n1a:{scene:'s26', head:true, text:[
  `В начале апреля Ника пропадает.`,
  `Она оставляет записку на столе в комнате над прачечной, кривым злым почерком: «Я не буду сидеть и ждать, пока заберут и меня. Я знаю, где папа. Я его вытащу. Не ищите».`,
  {when:s=>s.flags.dadTaken, text:`Ника, шестнадцать лет, одна, идёт вытаскивать отца из башни Церебры. Твоё сердце останавливается.`},
  {when:s=>!s.flags.dadTaken, text:`Отец дома, целый. Но Ника этого будто не видит: она пошла «спасать» его от угрозы, которую чувствует кожей. Твоё сердце останавливается всё равно.`},
  {when:s=>evCount(s,'nika')>=2, text:`Ты знаешь, как она думает: вы провели вместе не один вечер. Это поможет её найти.`},
  {when:s=>s.flags.giftPhotos || (s.rel.nika||0)>=4, text:`Под запиской она оставила кулон с рыбкой. «Чтобы ты знал, что я вернусь за ним».`},
], choices:[
  {t:`Искать её по камерам Грача.`, show:s=>s.flags.grachDeal || (s.rel.grach||0)>=1, check:{stat:'mind', v:6, bonus:[{when:s=>evCount(s,'nika')>=2, why:'вечера с Никой: ты знаешь её маршруты'}]},
    ok:{hint:`Найдёшь её быстро`, eff:{flag:'foundNika'}, res:[
      `Ты бежишь к Грачу. Его камеры, которые ты чинил всю зиму, видят весь квартал. Через двадцать минут вы находите Нику: она на станции монорельса, покупает билет до делового центра.`,
      `Грач смотрит на экран, потом на тебя. — Иди за сестрой, — говорит он. — Камеры подождут.`,
    ], next:'n1b'},
    fail:{hint:`Потеряешь время`, eff:{flag:'nikaRisk'}, res:[`Камеры теряют её в толпе у станции. Ты бежишь туда наугад, теряя минуты.`], next:'n1b'}},
  {t:`Догнать её даром: почувствовать её комм в сети.`, hint:`Дорого, но точно.`, check:{stat:'control', v:4, bonus:[{when:s=>evCount(s,'teo')>=2, why:'вечера у Тео'}]},
    ok:{hint:`Найдёшь по сигналу`, eff:{stat:{control:1}, why:`Нашёл комм Ники в городской сети.`, strange:1, flag:'foundNika'}, res:[
      `Ты закрываешь глаза и слушаешь город. Миллионы сигналов, гул, шум. Среди них один знакомый: старый комм Ники, который ты сам ей чинил. Вот он. Станция монорельса.`,
      `Кровь из носа. Но ты знаешь, где она.`,
    ], next:'n1b'},
    fail:{hint:`Сигналов слишком много`, eff:{strange:1, flag:'nikaRisk'}, res:[`Город слишком большой, сигналов слишком много, голова взрывается болью раньше, чем ты находишь её. Придётся искать ногами.`], next:'n1b'}},
  {t:`Подумать, куда она пошла бы, и перехватить её там.`, check:{stat:'mind', v:6, bonus:[{when:s=>evCount(s,'nika')>=2, why:'вечера с Никой: ты знаешь, как она думает'}]},
    ok:{hint:`Угадаешь`, eff:{flag:'foundNika'}, res:[`Ника упрямая, но не глупая. К башне монорельсом через деловой центр, пересадка на «Эстакаде». Ты едешь прямо на пересадку и встречаешь её на платформе.`]},
    fail:{hint:`Можешь ошибиться`, eff:{flag:'nikaRisk'}, res:[`Ты едешь туда, где её нет. Когда понимаешь ошибку, теряешь час.`]},
    next:'n1b'},
  {t:`Бежать на станцию: она наверняка там.`, check:{stat:'agi', v:5, bonus:[{when:s=>s.flags.roofRoutes, why:'ты изучил крыши квартала'}]},
    ok:{hint:`Успеешь`, eff:{flag:'foundNika'}, res:[`Ты бежишь на станцию напрямик, через крыши и переулки, которые учил всю зиму. Ника ещё на платформе, растерянная, с билетом в руке. Ты успел.`], next:'n1b'},
    fail:{hint:`Можешь не успеть`, eff:{flag:'nikaRisk'}, res:[`Ты добегаешь до станции, когда её монорельс уже отходит. В окне мелькает знакомая толстовка. Твоя толстовка.`], next:'n1b'}},
]},

n1b:{scene:'s26', text:[
  {when:s=>s.flags.foundNika, text:`Ты хватаешь Нику за плечи. Она вырывается, потом обмякает и ревёт, уткнувшись тебе в куртку. — Я не могла просто сидеть, — всхлипывает она. — Не могла, слышишь.`},
  {when:s=>s.flags.nikaRisk, text:`Ты находишь Нику через два часа, у самой башни делового центра, где её остановила охрана «за подозрительное поведение». Ещё бы немного, и её забрали бы уже не соседи. Она белая от страха и не признается, что испугалась.`},
], choices:[
  {t:`«Мы вытащим папу вместе. Обещаю. Но не поодиночке».`, eff:{rel:{nika:2}, flag:'nikaTeam'}, res:[
    `— Вместе, — говоришь ты. — Слышишь? Не ты одна, не я один. Вместе. Дай слово, что больше не убежишь. — Ника вытирает нос твоим рукавом. — Даю. На этот раз по-настоящему.`,
  ], next:'n2a'},
  {t:`Накричать на неё от страха.`, eff:{rel:{nika:-1}, flag:'yelledNika'}, res:[
    `Ты кричишь. Про то, что она могла погибнуть, что она думает только о себе, что тебе и так страшно. Ника слушает молча, и по её лицу ты понимаешь, что зря. Страх — плохой советчик.`,
  ], next:'n2a'},
]},

/* ---------- СЦЕНА 27. УЛЬТИМАТУМ ---------- */
n2a:{scene:'s27', head:true, mood:'tense', text:[
  {when:s=>s.flags.nikaTeam, text:`Неделю после побега Ника держит слово: не уходит дальше прачечной и каждый вечер спрашивает, какой у вас план.`},
  {when:s=>!s.flags.nikaTeam, text:`Неделю после побега Ника почти с тобой не разговаривает. Но и не убегает. Это уже что-то.`},
  `А в середине апреля ультиматум приходит в один день с трёх сторон разом.`,
  `Церебра — казённым письмом на серой бумаге, какое ты уже видел: «Образцу 7 предлагается явиться в башню „Лимен“ добровольно. В этом случае семья Рейне освобождается от дальнейшего внимания. Срок: 30 апреля».`,
  {when:s=>s.flags.dadTaken, text:`Приписка от руки: «Ваш отец ждёт вас. Он в порядке. Пока вы сотрудничаете».`},
  {when:s=>s.flags.alliedViv, text:`Пандора — звонком Вивьен: «Церебра форсирует. Значит, действуем в ночь на тридцатое. Мой человек проведёт вас на служебный этаж. Дальше вы ключом, я архивами. Не подведите, Лео».`},
  {when:s=>s.flags.refusedViv, text:`Тео — молча кладёт на стол план башни. — Если идти, то без Пандоры. Втроём: ты, я и тот, кого возьмёшь. Шансов мало. Но они есть.`},
  `Тридцатое апреля. Одна ночь. Один выбор.`,
], choices:[
  {t:`Идти в башню и покончить с этим.`, hint:`Финал. Обратной дороги не будет.`, eff:{flag:'goingTower'}, res:[
    `— Идём, — говоришь ты. — Тридцатого. Все вопросы решаются в одну ночь.`,
    `В комнате повисает тишина, в которой каждый считает про себя, вернётся ли он с этой ночи.`,
  ], next:'mon4'},
  {t:`Сначала убедиться, что семья в безопасности, что бы ни случилось с тобой.`, check:{stat:'mind', v:6, bonus:[{when:s=>s.flags.grachDeal || evCount(s,'kit')>=2, why:'рынок спрячет твоих'}]},
    ok:{hint:`Спрячешь своих понадёжнее`, eff:{flag:['goingTower','familySafe']}, res:[
      `Прежде чем идти, ты прячешь своих. Мать и Нику — к Грачу, в место, о котором знают трое. Если ты не вернёшься, они хотя бы будут жить.`,
      `— Ты как будто прощаешься, — тихо говорит Ника. — На всякий случай, — отвечаешь ты. И это правда.`,
    ], next:'mon4'},
    fail:{hint:`Времени в обрез`, eff:{flag:'goingTower'}, res:[`Ты хочешь всё устроить, но времени нет. Придётся идти, оставив своих там, где они есть, и надеяться.`], next:'mon4'}},
]},

mon4:{scene:'mon4', head:true, text:[
  `Последние дни апреля. Ты знаешь дату. Ты знаешь, что может не быть мая.`,
  `На что ты потратил эти дни?`,
], choices:[
  {t:`На последние уроки Тео.`, hint:`Дар на максимум перед башней.`, eff:{stat:{control:2}, why:`Последние дни апреля с Тео.`, strange:1}, res:[`Тео отдаёт тебе всё, что знает, будто торопится. В конце он говорит: — Больше мне нечему тебя учить. Дальше ты сам. — И впервые за всё время обнимает тебя.`], next:'o1a'},
  {t:`На тело: башня не прощает слабых.`, eff:{stat:{body:1}, why:`Последние дни апреля в зале.`, flag:'trainedBody'}, res:[`Ты выжимаешь из себя всё. Если дойдёт до драки, ты будешь готов.`], next:'o1a'},
  {t:`На отработку маршрута до последнего шага.`, eff:{stat:{agi:1}, why:`Последние дни апреля на маршруте.`}, res:[`Ты проходишь путь в голове сто раз. Окно, лестница, коридор, ядро. Сто раз.`], next:'o1a'},
  {t:`На план: продумать всё, что может пойти не так.`, eff:{stat:{mind:1}, why:`Последние дни апреля над планом.`, flag:'perfectPlan'}, res:[`Ты расписываешь каждый шаг, каждый запасной выход, каждое «если». План на пятнадцати листах. Тео присвистывает: — Даже Адам так не готовился.`], next:'o1a'},
  {t:`На людей: обнять всех, кто дорог, пока есть время.`, eff:{stat:{charm:1}, why:`Последние дни апреля с близкими.`, rel:{nika:1}}, res:[`Ты проводишь эти дни с теми, кто дорог. На случай, если это последние дни. Каждый разговор — как последний. Может, так и есть.`], next:'o1a'},
  {t:`На то, чтобы не сломаться под тяжестью того, что будет.`, eff:{stat:{will:1}, why:`Последние дни апреля на одной воле.`}, res:[`Страх стал огромным. Ты стал больше страха. Ненамного. Но достаточно.`], next:'o1a'},
]},

/* ================= ФИНАЛ ================= */

/* ---------- СЦЕНА 28. ПОДГОТОВКА ---------- */
o1a:{scene:'s28', head:true, text:[
  `Вечер двадцать девятого апреля. Будка Тео слишком мала для всех, кто пришёл. Но пришли.`,
  {when:s=>s.flags.soldTeo, text:`Тео пришёл. Он знает, что ты отдал его Пандоре, и не смотрит на тебя. Но пришёл: ради Адама. И ради Шестой.`},
  `Тео раскладывает план башни. Руки у него не дрожат. Впервые ты видишь его собранным, как инженер, которым он был когда-то.`,
  {when:s=>s.flags.grachDeal, text:`Грач сидит в углу с тетрадью. — Мои мальчики будут у ворот, — говорит он. — Шуметь умеют. Считай, это возврат долга. В твою пользу.`},
  {when:s=>s.flags.froze || s.flags.foundReset || s.flags.shouted || s.flags.barroNY, text:`Барро стоит в дверях, заслоняя половину света. — Твой отец мне руку вернул, — говорит он. — Теперь моя очередь.`},
  {when:s=>s.flags.promiseMiguel || s.flags.doubleDana || s.flags.danaPass, text:`Дана принесла пропуск Куратора. — Он откроет служебный лифт до двадцатого этажа, — говорит она. — Дальше сам.`},
  {when:s=>s.flags.kitFriend || evCount(s,'kit')>=1, text:`Кит сидит на прилавке и болтает ногами. Никто его не звал. Выгнать его никто не решился.`},
  {when:s=>s.flags.alliedViv, text:`Вивьен на связи. Её человек будет ждать у служебного входа ровно в 02:00.`},
  {when:s=>s.flags.nikaTeam, text:`Ника сидит рядом с тобой. Она не пойдёт в башню, вы договорились. Но она здесь, и это важно.`},
  {when:s=>s.moral>=3 && !s.flags.blamedSun, text:`Пришли и те, кого ты не звал: госпожа Сун с термосом, Рафа, соседи из-под эстакады. — Ты нам полгода всё чинил бесплатно, — говорит Рафа. — Теперь наша очередь.`},
  {when:s=>s.moral<=-2, text:`Народу меньше, чем ты рассчитывал. Рафа не пришёл. Соседи, завидев тебя, закрывают двери. Квартал помнит не только добро.`},
  {when:s=>!s.flags.dadTaken, text:`— Я иду с тобой, — говорит отец. Это не обсуждается. — На тридцать первом этаже архив образцов. Там всё, что из тебя сделали. Я двадцать лет хотел это стереть. Сам.`},
  `— Как пойдём? — спрашивает Тео.`,
], choices:[
  {t:`Тихо: крыши, вентиляция, служебные лестницы.`, hint:`Ставка на ловкость.`, eff:{flag:'appStealth'}, res:[`— Тихо, — говоришь ты. — Никто не должен понять, что мы внутри, пока мы не у цели. Тео кивает: — Как в старые времена.`], next:'o2a'},
  {t:`Через сеть: ты откроешь башню изнутри.`, hint:`Ставка на дар. След будет огромный.`, eff:{flag:'appHack'}, res:[`— Я открою её, — говоришь ты. — Всю. Изнутри. Тео долго смотрит на тебя. — Шестая пыталась так уйти, — говорит он тихо. — Ладно. Ты не Шестая.`], next:'o2a'},
  {t:`Громко: пока друзья шумят у ворот, ты проходишь с чёрного хода.`, show:s=>s.flags.grachDeal || s.flags.froze || s.flags.foundReset || s.flags.shouted || s.flags.ralliedTeam || s.moral>=3, hint:`Ставка на союзников.`, eff:{flag:'appLoud'}, res:[`— Пусть смотрят на ворота, — говоришь ты. — А я войду сзади. Грач закрывает тетрадь. Барро разминает пальцы протеза.`], next:'o2a'},
  {t:`С Пандорой: человек Вивьен проведёт внутрь.`, show:s=>s.flags.alliedViv, hint:`Надёжно. Но это путь Пандоры.`, eff:{flag:'appViv'}, res:[`— Пойдём с Пандорой, — говоришь ты. Тео морщится, но молчит. Вивьен в наушнике: «Мудро. В 02:00».`], next:'o2a'},
]},

/* ---------- СЦЕНА 29. БАШНЯ «ЛИМЕН» ---------- */
o2a:{scene:'s29', head:true, mood:'tense', text:[
  `Ночь на тридцатое апреля. Башня «Лимен» — чёрная игла, уходящая в облака. Наверху горит белая корона.`,
  {when:s=>s.flags.dadTaken, text:`Где-то там отец. Где-то там твой ответ.`},
  {when:s=>!s.flags.dadTaken, text:`Отец стоит рядом, подняв воротник. Двадцать лет он обходил эту башню стороной. Где-то там твой ответ.`},
  {when:s=>s.flags.appLoud, text:`У главных ворот начинается праздник: люди Грача гремят кастрюлями, Барро переворачивает мусорный бак, Кит орёт что-то неприличное про Церебру. Охрана бежит туда.`},
  {when:s=>s.flags.appViv, text:`У служебного входа ждёт человек в сером костюме. Молча открывает дверь картой и уходит, не оглядываясь.`},
], choices:[
  {t:`Вентиляцией на служебную лестницу.`, show:s=>s.flags.appStealth, check:{stat:'agi', v:6, bonus:[{when:s=>s.flags.studiedTower, why:'ты выучил план башни'}]},
    ok:{hint:`Проскользнёшь`, res:[`Решётка, короб, темнота, пыль двадцати лет. Ты выползаешь на служебную лестницу двадцать восьмого этажа, никем не замеченный.`], next:'o2b'},
    fail:{hint:`Можешь выдать себя`, eff:{flag:'towerAlarm'}, res:[`Короб прогибается с гулким звуком. Где-то внизу загорается тревога. Ты выбираешься на лестницу, но тебя уже ищут.`], next:'o2b'}},
  {t:`Попросить башню открыться.`, show:s=>s.flags.appHack, check:{stat:'control', v:5, bonus:[{when:s=>evCount(s,'teo')>=2, why:'вечера у Тео'}]},
    ok:{hint:`Башня откроется`, eff:{strange:1}, res:[`Ты касаешься стены, и башня отвечает. Она огромная, сложная, и где-то в её глубине кто-то тихо считает вслух. Двери открываются перед тобой одна за другой.`], next:'o2b'},
    fail:{hint:`Башня сопротивляется`, eff:{strange:1, flag:'towerAlarm'}, res:[`Башня сопротивляется, как живая. Ты продавливаешь двери силой, и по всем этажам воет сирена.`], next:'o2b'}},
  {t:`Пройти чёрным ходом, пока все у ворот.`, show:s=>s.flags.appLoud, res:[`Чёрный ход пуст: вся охрана у ворот. Ты поднимаешься служебным лифтом, слушая далёкий грохот кастрюль. Спасибо, Грач.`], next:'o2b'},
  {t:`Идти за человеком Вивьен.`, show:s=>s.flags.appViv, res:[`Пропуска Пандоры открывают всё до двадцать девятого этажа. Дальше, говорит человек в сером, «наши полномочия заканчиваются». Дальше ты сам.`], next:'o2b'},
  {t:`Использовать пропуск Куратора, который дала Дана.`, show:s=>s.flags.promiseMiguel || s.flags.doubleDana || s.flags.danaPass, res:[`Пропуск Куратора открывает служебный лифт. Лифт молча везёт тебя наверх. Спасибо, Дана.`], next:'o2b'},
  {t:`Подняться по служебной лестнице бегом, все двадцать восемь этажей.`, check:{stat:'body', v:6, bonus:[{when:s=>s.flags.trainedBody, why:'месяцы тренировок'}]},
    ok:{hint:`Дыхания хватит`, res:[`Этаж за этажом, не останавливаясь. На пятнадцатом горят ноги, на двадцать пятом лёгкие. На двадцать восьмом ты выходишь в коридор, и камеры видят только пустую лестницу за твоей спиной.`], next:'o2b'},
    fail:{hint:`Можешь выдохнуться`, eff:{flag:'towerAlarm'}, res:[`На двадцатом этаже ты останавливаешься отдышаться прямо под камерой. Она поворачивается к тебе. Где-то внизу загорается тревога.`], next:'o2b'}},
]},

o2b:{scene:'s29', mood:'tense', text:[
  {when:s=>!s.flags.dadTaken, text:`На двадцать восьмом этаже вы с отцом расходитесь: ему на тридцать первый, в архив образцов, тебе выше, к ядру на тридцать пятом. — Встретимся у ядра, — говорит он. Вы оба знаете, что это может быть неправдой.`},
  `Тридцать пятый этаж. Здесь нет окон. Белый коридор, длинный и очень чистый. Ты его уже видел. Во сне.`,
  {when:s=>s.flags.towerAlarm, text:`Сирена воет где-то внизу, а здесь тихо. Будто коридор решил не пускать сюда шум.`},
  `Из динамиков под потолком звучит голос. Девичий, спокойный, чуть механический. — Пять. Шесть. Семь. Седьмой. Я тебя ждала.`,
  `За стеклянной стеной — ядро башни: серверы, кабели, холодный свет. Голос идёт оттуда.`,
  {when:s=>s.flags.readLimen, text:`«Возвращена. Интегрирована». Теперь ты понимаешь, что это значит. Шестая не умерла. Её разум стал частью башни.`},
  `— Меня подключили, чтобы искать тебя, — говорит голос. — Кабины, турникеты, дроны — это я. Я слышала тебя в ноябре. И сказала им неправильный этаж.`,
], choices:SHARED_CHOICES.SIXTH},

o2c:{scene:'s29', mood:'tense', text:[
  `Белый зал на тридцать первом этаже. Пустой, круглый, залитый светом без источника.`,
  {when:s=>s.flags.dadTaken, text:`У дальней стены в кресле сидит отец. Живой, бледный, осунувшийся. Увидев тебя, он закрывает глаза. — Лео. Зачем ты пришёл.`},
  {when:s=>!s.flags.dadTaken, text:`У дальней стены стоит отец, руки за спиной в пластиковых браслетах. Охрана взяла его у архива. — Прости, — говорит он. — Я хотел стереть всё сам. Не успел.`},
  `В центре зала стоит женщина лет шестидесяти в белом халате. Доктор Сорель, руководитель программы «Лимен».`,
  `— Седьмой, — говорит она почти нежно. — Двадцать лет работы. Шесть неудач. И одна удача, которую унесли в рюкзаке. Останься, и все, кого ты привёл, уйдут домой. Это честное предложение.`,
  `За её спиной охрана. Их импланты светятся под кожей ровным синим светом.`,
], choices:SHARED_CHOICES.SOREL},

/* ---------- СЦЕНА 30. ВЫБОР ---------- */
fin_choice:{scene:'s30', head:true, text:[
  `Ядро башни. Серверы гудят, свет холодный и ровный. Отец стоит рядом, держит тебя за плечо.`,
  {when:s=>s.flags.sixthAlly, text:`Голос Шестой звучит тихо, будто рядом: — Ключ у тебя в голове. Отсюда ты можешь сделать с башней что угодно. И со мной тоже.`},
  `Ты понимаешь это сам, без подсказок: отсюда, из сердца «Лимена», ключ дотянется до любой системы в городе. До кабин. До архивов. До каждого импланта с белым логотипом.`,
  `Двадцать лет всё крутилось вокруг этого. Теперь решать тебе.`,
], choices:[
  {t:`Уйти с семьёй. Новые имена, другой город, никаких корпораций.`, hint:`Свобода. Горько-сладкая.`, next:'e_run'},
  {t:`Уничтожить ключ. Стереть «Лимен» и то, что делает тебя Седьмым.`, show:s=>s.stats.control>=5 || s.stats.mind>=8, hint:`Ты потеряешь дар и часть памяти.`, next:'e_destroy'},
  {t:`Отдать ключ Пандоре, как договаривались.`, show:s=>s.flags.alliedViv, hint:`Защита семьи навсегда. Хозяин тоже навсегда.`, next:'e_viv'},
  {t:`Взять власть себе. Весь город в твоих руках.`, show:s=>s.stats.control>=7 && s.strange>=8, hint:`Никто больше не будет решать за тебя. Даже совесть?`, next:'e_power'},
]},

/* ---------- ФИНАЛЫ ---------- */
e_run:{scene:'end_run', head:true, text:[
  `Ты не трогаешь ключ. Просто уходишь. Вниз по служебной лестнице, через двор, в дождь, держа отца за руку.`,
  `Через неделю семья Вельт исчезает из Южных кварталов. Мастерская под эстакадой стоит пустая, рольставня опущена.`,
  `В приморском городе на юге открывается маленькая мастерская «Ремонт всего». Хозяин — седой инженер с масляной полосой на щеке. Его сын чинит дроны и не рассказывает о прошлом.`,
  {when:s=>s.flags.nikaTeam || (s.rel.nika||0)>=3, text:`Ника ходит в новую школу. На запястье у неё светится голубая рыбка. Она говорит всем, что брат у неё немного странный, но лучший.`},
  {when:s=>s.flags.promiseMiguel, text:`Раз в месяц ты отправляешь на север посылку без обратного адреса: картридж для импланта Мигеля, который достаёт Тео. Дана пишет коротко: «Живой. Спасибо».`},
  {when:s=>s.flags.coldDana, text:`Иногда ты думаешь о Дане. О том, что сказал бы, если бы тогда её обнял. Писем нет.`},
  {when:s=>s.flags.sixthAlly, text:`Шестая остаётся в башне. Ты обещал вернуться за ней. Каждую ночь ты об этом помнишь.`},
  `Ключ у тебя в голове спит. Иногда просыпается, когда ты злишься, и лампочки мигают. Ты учишься с этим жить. Как все.`,
], choices:[{t:`Конец.`, eff:{flag:'end_run'}, next:'END'}]},

e_destroy:{scene:'end_destroy', head:true, text:[
  `Ты кладёшь ладони на ядро и просишь его забыть. Всё. Программу «Лимен», шесть отчётов, седьмой образец, ключ.`,
  `Башня стонет. Свет гаснет по этажам сверху вниз. Кабины по всему городу выключаются разом.`,
  {when:s=>s.flags.sixthAlly, text:`— Спасибо, — шепчет Шестая, и голос её уходит, как вода в песок. Спокойно. Без страха. Впервые за шестнадцать лет.`},
  `А потом что-то гаснет и в тебе.`,
  `Ты приходишь в себя в будке Тео через три дня. Помнишь имя, семью, мастерскую. Не помнишь, как зажигал лампу без рук. Не помнишь, каково это — слышать город. Как будто закрылась дверь в комнату, в которой ты жил.`,
  {when:s=>s.flags.promiseMiguel || s.flags.doubleDana, text:`Импланты Церебры по всему городу перешли в автономный режим. Мигель больше не зависит от белой клиники. Дана приходит к тебе с тортом и плачет, пока вы его едите.`},
  `Церебра объявляет о «технической реорганизации». Пандора молчит. Никто больше не ищет Седьмого: Седьмого больше нет. Есть Лео Вельт, студент-инженер.`,
], choices:[{t:`Конец.`, eff:{flag:'end_destroy'}, next:'END'}]},

e_viv:{scene:'end_viv', head:true, text:[
  {when:s=>!s.flags.planBetrayViv, text:`Ты открываешь архивы «Лимена» для Пандоры. Двадцать лет тайн утекают в чужие серверы за одну минуту.`},
  {when:s=>s.flags.planBetrayViv, text:`Ты собирался обмануть Пандору. Но когда Вивьен в наушнике говорит: «Ваша семья уже в машине, Лео», ты понимаешь, что обманывать уже некого. Ты открываешь архивы.`},
  `Через месяц Церебра продаёт Пандоре программу «Лимен» «в рамках стратегического партнёрства». В новостях это называют крупнейшей сделкой десятилетия.`,
  `Семья Вельт живёт в корпоративном жилом комплексе Пандоры. Охрана, чистый воздух, солнце на крыше. Отец снова работает в лаборатории. Он почти не разговаривает.`,
  `Ты стажёр отдела перспективных талантов. У тебя пропуск, зарплата и кабинет на пятидесятом этаже. Вивьен заходит по пятницам с кофе. Она всегда говорит правду. Но не всю.`,
  {when:s=>s.flags.sixthAlly, text:`Шестую перевезли в новую башню. Пандора бережёт свои активы. Иногда, проходя мимо серверной, ты слышишь, как кто-то тихо считает до семи.`},
  `Ты свободен. У тебя есть всё. Ты никуда не можешь уйти.`,
], choices:[{t:`Конец.`, eff:{flag:'end_viv'}, next:'END'}]},

e_cer:{scene:'end_cer', head:true, text:[
  `Ты остаёшься в башне. Отца и остальных отпускают той же ночью: Сорель держит слово. Она всегда держит слово, когда это выгодно.`,
  `Тебе выделяют комнату на тридцать пятом этаже. Белую, чистую, с видом на город. Здесь хорошо кормят и вежливо разговаривают.`,
  {when:s=>s.flags.sixthAlly || s.flags.sixthTeo, text:`По ночам вы разговариваете с Шестой. Два образца «Лимена». Она учит тебя слушать город. Ты учишь её смеяться. Получается не сразу.`},
  `Раз в месяц Нике разрешают прислать письмо. Она пишет длинно, с ошибками, и всегда заканчивает одинаково: «Мы тебя вытащим. Жди».`,
  `Ты ждёшь. Ключ у тебя в голове тоже ждёт. Церебра думает, что приручила его. Церебра ошибается.`,
], choices:[{t:`Конец.`, eff:{flag:'end_cer'}, next:'END'}]},

e_power:{scene:'end_power', head:true, text:[
  `Ты берёшь ключ и поворачиваешь. Весь город отвечает тебе разом: кабины, камеры, дроны, импланты, светофоры. Ноктис замирает и слушает.`,
  {when:s=>s.moral>=2, text:`Первым делом ты гасишь все кабины Церебры в бедных районах. Потом открываешь архивы для журналистов. Потом отключаешь импланты-поводки вроде того, что был у Мигеля. Ты не трогаешь людей. Ты только снимаешь с них цепи.`},
  {when:s=>s.moral<2, text:`Ты гасишь кабины. Потом стираешь долги Южных кварталов в банках. Потом решаешь, что управа работает плохо, и начинаешь работать за неё. Советоваться тебе больше не с кем. И незачем.`},
  `Корпорации объявляют тебя угрозой. Ты читаешь их переписку раньше, чем они её отправляют.`,
  {when:s=>s.flags.overrodePeople, text:`Иногда ночью ты вспоминаешь белый зал и людей, которые мягко оседали на пол. Ты тогда впервые понял, что можешь. С тех пор ты стараешься не вспоминать.`},
  `Тео смотрит на тебя из своей будки долгим взглядом. — Шестая тоже так начинала, — говорит он. Ты не отвечаешь.`,
  `Ноктис спит спокойнее, чем когда-либо. Потому что за ним присматривает мальчик из мастерской под эстакадой. Остаётся только надеяться, что мальчик останется мальчиком.`,
], choices:[{t:`Конец.`, eff:{flag:'end_power'}, next:'END'}]},

};

/* ============================================================
   СВОБОДНЫЕ ВЕЧЕРА: два вечера в месяц, с кем провёл — та линия и развивается.
   Флаг ev_<кто>_<месяц>. evCount(s,'nika') — сколько вечеров за год.
   ============================================================ */
const EV_WHO = {dana:s=>'dana' in s.rel, nika:()=>true, teo:()=>true, family:()=>true, kit:s=>s.flags.kitFriend || s.flags.grachDeal || 'kit' in s.rel};
const EVENINGS = {
  '10':{after:'g1', list:[
    {who:'dana', t:`Позаниматься с Даной в библиотеке.`, eff:{rel:{dana:1}}, res:[
      `Библиотека до закрытия. Дана решает задачи по схемотехнике быстрее тебя, а ты находишь ошибку в её ответе быстрее, чем она успевает возмутиться.`,
      `Под конец ты чинишь её перемотанный изолентой комм. Она смотрит, как ты работаешь, и вдруг говорит: — Ты единственный, кто ничего от меня не хочет. — Ты не успеваешь спросить, что это значит.`]},
    {who:'nika', t:`Помочь Нике с физикой.`, eff:{rel:{nika:1}}, res:[
      `Задача про два поезда навстречу друг другу. Ника решает её быстрее тебя и невыносимо гордится весь вечер.`,
      `— Ты же инженер, — говорит она. — Как можно не знать, когда встретятся поезда? — Инженер чинит поезда. Встречаются они сами.`]},
    {who:'teo', t:`Заглянуть к Тео просто так, без работы.`, eff:{rel:{teo:1}}, res:[
      `Тео удивляется, но наливает чай. Весь вечер он рассказывает про рынок: кто кому должен, у кого настоящие детали, а у кого старое железо под свежей краской.`,
      `— Зачем ты мне это рассказываешь? — Потому что ты пришёл без дела, — говорит Тео. — Ко мне так не ходят.`]},
    {who:'family', t:`Поужинать с родителями без спешки.`, eff:{rel:{dad:1, mom:1}}, res:[
      `Мать дома, не на смене, редкий случай. Отец рассказывает, как в молодости собрал радио из будильника и чайника. Мать смеётся и поправляет: из кофеварки.`,
      `Ты замечаешь, что все их истории заканчиваются лет двадцать назад. Дальше как будто ничего не было.`]},
    {who:'kit', t:`Погулять с Китом по крышам рынка.`, eff:{rel:{kit:1}}, res:[
      `Кит учит тебя свистеть в два пальца. У тебя не выходит весь вечер. У Кита выходит так, что внизу оборачивается полрынка.`,
      `— Грач говорит, ты правильный, — сообщает Кит между свистами. — Правильные долго не живут. Ты это, живи.`]},
  ]},
  '11':{after:'e0', list:[
    {who:'dana', t:`Прийти к Мигелю на реванш в «Гонки».`, eff:{rel:{dana:1}}, res:[
      `Мигель встречает тебя в дверях с джойстиком наперевес. — Реванш! — Реванш, — соглашаешься ты и проигрываешь четыре раза подряд.`,
      `Дана весь вечер сидит на подоконнике с учебником и не переворачивает страницу. У лифта она говорит: — Приходи ещё. Если захочешь.`]},
    {who:'nika', t:`Научить Нику паять.`, eff:{rel:{nika:1}}, res:[
      `Ника обжигается на третьей минуте, ругается словами, которых ты от неё не слышал, и не бросает. К ночи на её самодельной плате мигает светодиод.`,
      `— Это рыбка, — говорит она. — Видишь? Хвост. — Ты видишь. Правда похоже на рыбку.`]},
    {who:'teo', t:`Сыграть с Тео в го.`, eff:{rel:{teo:1}}, res:[
      `На доске у Тео не хватает половины камней, недостающие он заменяет гайками. Играет он медленно и выигрывает всегда.`,
      `— Ты думаешь на два хода, — говорит он. — Серьёзные люди думают на двадцать. Учись.`]},
    {who:'family', t:`Встретить мать после ночной смены.`, eff:{rel:{mom:1, dad:1}}, res:[
      `Ты ждёшь мать на станции и несёшь её сумку. Всю дорогу она молчит, а у подъезда вдруг берёт тебя под руку.`,

function evUsed(s, m){ return Object.keys(s.flags).filter(f=>s.flags[f] && /^ev_[a-z]+_\d+$/.test(f) && f.endsWith('_'+m)).length; }
(function buildEvenings(){
  for(const m in EVENINGS){
    const id = 'ev'+m, E = EVENINGS[m];
    NODES[id] = {scene:'mon'+m, text:[
      {when:s=>evUsed(s,m)===0, text:`Кроме того, у тебя было два свободных вечера. На всех, кто тебе дорог, их не хватит. С кем ты их провёл?`},
      {when:s=>evUsed(s,m)===1, text:`Остался ещё один свободный вечер.`},
    ], choices:E.list.map(c=>({
      t:c.t, hint:c.hint,
      show:s=>EV_WHO[c.who](s) && (!c.show || c.show(s)) && !s.flags['ev_'+c.who+'_'+m],
      eff:Object.assign({}, c.eff, {flag:[].concat((c.eff && c.eff.flag) || [], 'ev_'+c.who+'_'+m)}),
      res:c.res,
      next:s=>evUsed(s,m)>=2 ? E.after : id,
    }))};
  }
})();
