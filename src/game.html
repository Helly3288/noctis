const SAVE_KEY = 'noctis-leo-v1';
let S = null;

function fresh(){
  return {v:2, stats:{...START_STATS}, moral:2, strange:0, money:40,
    rel:{dad:2, mom:2, nika:1}, flags:{}, road:[], after:null,
    node:'intro', view:'node', result:null};
}
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function load(){
  try{ const r = localStorage.getItem(SAVE_KEY); if(r){ const o = JSON.parse(r); if(o && o.v===2 && o.stats && o.stats.control==null) o.stats.control=0;
    if(o && o.v===2 && (NODES[o.node] || o.node==='END' || o.node==='intro')) return o; } }catch(e){}
  return null;
}
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const val = x => typeof x==='function' ? x(S) : x;
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function resolveText(arr){
  const out = [];
  (val(arr)||[]).forEach(p=>{
    if(p==null) return;
    if(typeof p==='string') out.push({text:p});
    else if(typeof p==='object'){ if(p.when && !p.when(S)) return; out.push({text:p.text, tag:p.tag}); }
  });
  return out;
}

function apply(eff){
  const ch = [];
  if(!eff) return ch;
  if(eff.stat) for(const k in eff.stat){
    const o = S.stats[k]; S.stats[k] = clamp(o+eff.stat[k],1,10); const d = S.stats[k]-o;
    if(d){
      ch.push({t:(d>0?'+':'')+d+' '+STATS[k], c:d>0?'up':'down', stat:k, from:o, to:S.stats[k], why:eff.why||''});
      if(d>0){ if(!S.growth) S.growth=[]; S.growth.push({stat:k, from:o, to:S.stats[k], why:eff.why||'', where:(SCENES[(NODES[S.node]||{}).scene]||{}).title||''}); }
    }
  }
  if(eff.moral){
    const o = S.moral; S.moral = clamp(o+eff.moral,-5,5); const d = S.moral-o;
    if(d) ch.push({t:'Мораль '+(d>0?'↑':'↓'), c:d>0?'up':'down'});
  }
  if(eff.strange){
    const o = S.strange; S.strange = clamp(o+eff.strange,0,10); const d = S.strange-o;
    if(d && showStrange()) ch.push({t:'Странность +'+d, c:'odd'});
  }
  if(eff.money){
    const o = S.money; S.money = Math.max(0,o+eff.money); const d = S.money-o;
    if(d) ch.push({t:(d>0?'+':'−')+credits(Math.abs(d)), c:d>0?'up':'down'});
  }
  if(eff.rel) for(const k in eff.rel){
    const isNew = !(k in S.rel);
    const o = isNew ? 0 : S.rel[k];
    S.rel[k] = clamp(o+eff.rel[k],-5,5); const d = S.rel[k]-o;
    const name = REL[k].split(/[,(]/)[0].trim();
    if(isNew) ch.push({t:FACTIONS[k] || 'Новое знакомство: '+name, c:'new'});
    if(d) ch.push({t:name+': отношения '+(d>0?'↑':'↓'), c:d>0?'rel-up':'down'});
  }
  if(eff.flag) [].concat(eff.flag).forEach(f=>S.flags[f]=true);
  return ch;
}

/* Шанс проверки: хватает — всегда успех; не хватает 1 — 35%; 2 — 10%; больше — провал */
function checkChance(have, need){ const d = need-have; return d<=0 ? 1 : d===1 ? .35 : d===2 ? .1 : 0; }
const pct = c => Math.round(c*100)+'%';
function credits(n){ const a=Math.abs(n)%100, b=a%10; const w = (a>10&&a<20)?'кредитов':b===1?'кредит':(b>=2&&b<=4)?'кредита':'кредитов'; return n+' '+w; }
const FACTIONS = {street:'Появилась репутация в квартале'};

/* Бонус за прошлое: check.bonus = [{when:s=>..., v:1, why:'…'}] — прошлые выборы помогают в проверке */
function checkBonus(c){ return ((c.check && c.check.bonus) || []).filter(b=>!b.when || b.when(S)); }
/* Свободные вечера: сколько вечеров Лео провёл с человеком за год */
function evCount(s, who){ return Object.keys(s.flags).filter(f=>s.flags[f] && f.startsWith('ev_'+who+'_')).length; }

function choiceInfo(c){
  if(c.show && !c.show(S)) return null;
  if(c.thought) return {kind:'thought'};
  if(c.req){ const have=S.stats[c.req.stat]; return {kind: have>=c.req.v ? 'req-ok' : 'locked', stat:c.req.stat, need:c.req.v, have}; }
  if(c.check){ const base=S.stats[c.check.stat]; const bonus=checkBonus(c); const plus=bonus.reduce((a,b)=>a+(b.v||1),0); const have=base+plus; const chance=checkChance(have,c.check.v); return {kind:'check', stat:c.check.stat, need:c.check.v, have, base, plus, bonus, chance}; }
  return {kind:'plain'};
}

function choose(i){
  const n = NODES[S.node]; const c = n.choices[i]; const info = choiceInfo(c);
  if(!info || info.kind==='thought' || info.kind==='locked') return;
  let branch = c, check = null;
  if(c.check){ const pass = info.chance>=1 || Math.random()<info.chance; branch = pass ? c.ok : c.fail; check = {stat:c.check.stat, need:c.check.v, have:info.have, base:info.base, plus:info.plus, chance:info.chance, pass}; }
  const changes = apply(branch.eff);
  const text = resolveText(branch.res);
  const next = branch.next !== undefined ? branch.next : c.next;
  S.view = 'result';
  S.result = {chosen: val(c.t), text, changes, check, next};
  save(); render();
}

function go(next){
  if(typeof next==='function') next = next(S);
  if(next && typeof next==='object' && next.road){
    S.after = next.then; S.roadCtx = next.ctx || '';
    const pool = ROAD_POOL.filter(id=>!S.road.includes(id));
    if(!pool.length){ next = next.then; }
    else { next = pool[Math.floor(Math.random()*pool.length)]; S.road.push(next); }
  }
  if(next==='@after'){ next = S.after || 'END'; S.after = null; }
  S.node = next; S.view = 'node'; S.result = null;
  save(); render(true);
}

const $story = document.getElementById('story');
const $panel = document.getElementById('panel');
const $where = document.getElementById('where');

function paras(list){
  return list.map(p=> p.tag
    ? `<p class="${p.tag==='Новости Ноктиса'?'news':'insight'}"><span class="tag">${esc(p.tag)}</span>${esc(p.text)}</p>`
    : `<p>${esc(p.text)}</p>`).join('');
}

function effLines(eff){
  const out = [];
  if(!eff) return out;
  if(eff.stat) for(const k in eff.stat){ const d=eff.stat[k]; out.push([(d>0?'+':'')+d+' '+STATS[k], d>0?'up':'down']); }
  if(eff.moral) out.push(['Мораль '+(eff.moral>0?'↑':'↓'), eff.moral>0?'up':'down']);
  if(eff.rel) for(const k in eff.rel){
    const name = REL[k].split(/[,(]/)[0].trim(), d = eff.rel[k];
    if(!(k in S.rel)) out.push([FACTIONS[k] || 'Новое знакомство: '+name, 'mem']);
    if(d) out.push([name+': отношения '+(d>0?'↑':'↓'), d>0?'rel-up':'down']);
  }
  if(eff.money) out.push([(eff.money>0?'+':'−')+credits(Math.abs(eff.money)), eff.money>0?'up':'down']);
  if(eff.strange && showStrange()) out.push(['Может случиться что-то странное', 'odd']);
  if(eff.flag && [].concat(eff.flag).some(f=>MEMORY.some(m=>m[0]===f))) out.push(['Мир это запомнит', 'mem']);
  return out;
}
function previewHtml(c, info){
  const ln = arr => arr.map(([t,cl])=>`<span class="ln ${cl}">${esc(t)}</span>`).join('');
  let h = '';
  if(info.kind==='thought'){
    h = `<span class="hint">Мимолётная мысль. Ты пока не понимаешь, откуда она и что с ней делать.</span>`;
    return `<span class="preview" role="tooltip">${h}</span>`;
  }
  if(c.hint) h += `<span class="hint">${esc(val(c.hint))}</span>`;
  if(info.kind==='locked'){
    h += `<span class="ln down">Нужно: ${STATS[info.stat]} ${info.need}, у тебя ${info.have}</span>`;
    const e = effLines(c.eff); if(e.length) h += `<span class="grp">Дало бы</span>`+ln(e);
  } else if(info.kind==='check'){
    h += `<span class="ph">Проверка · ${STATS[info.stat]}: у тебя ${info.base}${info.plus?` +${info.plus} за прошлое`:''}, нужно ${info.need}</span>`;
    info.bonus.forEach(b=>{ h += `<span class="ln up">+${b.v||1} · ${esc(b.why)}</span>`; });
    h += info.chance>=1 ? `<span class="ln up">Успех гарантирован</span>` : info.chance>0 ? `<span class="ln risk">Шанс успеха ${pct(info.chance)}: может повезти</span>` : `<span class="ln down">Провал неизбежен: не хватает ${info.need-info.have}</span>`;
    const ok = effLines(c.ok && c.ok.eff), fail = effLines(c.fail && c.fail.eff);
    const side = (b, e) => (b && b.hint ? `<span class="ln mem">${esc(b.hint)}</span>` : '') + (e.length ? ln(e) : (b && b.hint ? '' : `<span class="ln none">без изменений в статах</span>`));
    h += `<span class="grp ok">Если получится</span>` + side(c.ok, ok);
    h += `<span class="grp fail">Если не получится</span>` + side(c.fail, fail);
  } else {
    const e = effLines(c.eff);
    h += e.length ? ln(e) : (c.hint ? '' : `<span class="ln none">Без заметных последствий</span>`);
  }
  if(!h) return '';
  const tap = info.kind==='locked' ? 'Этот вариант сейчас недоступен' : 'Нажми ещё раз, чтобы выбрать';
  return `<span class="preview" role="tooltip">${h}<span class="tap">${tap}</span></span>`;
}

function tagsFor(info){
  if(info.kind==='req-ok') return `<span class="tag-chip ok">${STATS[info.stat]} ${info.need} ✓</span>`;
  if(info.kind==='locked') return `<span class="tag-chip lock">Нужно: ${STATS[info.stat]} ${info.need} · у тебя ${info.have}</span>`;
  if(info.kind==='check'){ const cl = info.chance>=1?'ok':info.chance>0?'risk':'fail'; return info.bonus.map(b=>`<span class="tag-chip bonus">+${b.v||1} · ${esc(b.why)}</span>`).join('') + `<span class="tag-chip ${cl}">Проверка · ${STATS[info.stat]} ${info.plus?info.base+'+'+info.plus:info.have}/${info.need} · ${info.chance>=1?'успех':info.chance>0?'шанс '+pct(info.chance):'провал'}</span>`; }
  if(info.kind==='thought') return `<span class="tag-chip">мысль · пока недоступно</span>`;
  return '';
}

function renderNode(){
  const n = NODES[S.node]; const sc = SCENES[n.scene];
  if(sc.month) S.curMonth = sc.month;
  $where.textContent = (sc.month || S.curMonth || '') + ' · ' + sc.place;
  let h = '';
  const fd = S.view==='result' ? '' : ' fade';
  if(n.head) h += Art.html(sc.art || n.scene, sc.title) + `<div class="scene-head${fd}"><span class="scene-num">${esc(sc.label)}</span><h1>${esc(sc.title)}</h1><p class="scene-place">${esc(sc.month || S.curMonth || '')} · ${esc(sc.place)}</p></div>`;
  h += `<div class="text${fd}">${paras(resolveText(n.text))}</div>`;

  if(S.view==='result' && S.result){
    const r = S.result;
    h += `<div class="chosen fade">${esc(r.chosen)}</div>`;
    if(r.check){ const ch = r.check.chance!=null && r.check.chance<1 && r.check.chance>0 ? ` · шанс ${pct(r.check.chance)}` : ''; const luck = r.check.pass && r.check.chance<1 ? ' · повезло' : ''; const hv = r.check.plus ? `${r.check.base} +${r.check.plus}` : r.check.have; h += `<div class="checkline ${r.check.pass?'pass':'fail'}">Проверка · ${STATS[r.check.stat]} ${hv} против ${r.check.need}${ch} · ${r.check.pass?'успех':'провал'}${luck}</div>`; }
    h += `<div class="text result fade">${paras(r.text)}</div>`;
    const ups = r.changes.filter(c=>c.stat && c.c==='up'), rest = r.changes.filter(c=>!(c.stat && c.c==='up'));
    ups.forEach(u=>{ h += `<div class="levelup fade"><span class="lu-k">Характеристика выросла</span><span class="lu-v">${STATS[u.stat]} ${u.from} → ${u.to}</span>${u.why?`<span class="lu-why">${esc(u.why)}</span>`:''}</div>`; });
    if(rest.length) h += `<div class="changes fade">${rest.map(c=>`<span class="chg ${c.c}">${esc(c.t)}</span>`).join('')}</div>`;
    h += `<button class="next" id="nextBtn" type="button">Далее →</button>`;
  } else {
    let k = 0;
    h += `<div class="choices">`;
    n.choices.forEach((c,i)=>{
      const info = choiceInfo(c); if(!info) return;
      const disabled = info.kind==='thought' || info.kind==='locked';
      const cls = info.kind==='thought' ? 'thought' : (info.kind==='locked' ? 'locked' : '');
      const key = disabled ? '·' : String(++k);
      h += `<button class="choice ${cls}" id="ch-${S.node}-${i}" type="button" data-i="${i}" ${disabled?'aria-disabled="true" data-off="1"':`data-key="${key}"`}>
        <span class="key">${key}</span>
        <span class="body"><span>${esc(val(c.t))}</span>${info.kind!=='plain'?`<span class="tags">${tagsFor(info)}</span>`:''}${previewHtml(c, info)}</span>
      </button>`;
    });
    h += `</div>`;
  }
  $story.innerHTML = h;
  const touch = window.matchMedia && window.matchMedia('(hover: none)').matches;
  $story.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{
    const off = b.dataset.off==='1';
    if(touch && !b.classList.contains('armed')){
      $story.querySelectorAll('.choice.armed').forEach(o=>o.classList.remove('armed'));
      b.classList.add('armed'); return;
    }
    if(off) return;
    choose(+b.dataset.i);
  }));
  const nb = document.getElementById('nextBtn');
  if(nb){ nb.addEventListener('click',()=>go(S.result.next)); }
}

function strangeLabel(v){ return v===0?'Ничего странного':v<=2?'Совпадения':v<=4?'Слишком много совпадений':v<=6?'Что-то не так':'Это не совпадения'; }
function relLabel(v){ return v<=-3?['Враждебно','l-bad']:v<0?['Прохладно','l-bad']:v===0?['Нейтрально','l-mid']:v<=2?['Тепло','l-good']:['Близко','l-good']; }

      <div class="strange">${Array.from({length:10},(_,i)=>`<i class="${i<S.strange?'on':''}"></i>`).join('')}</div>
      ${HELP?`<div class="s-help" style="margin-top:0">${esc(SCALE_HELP.strange)}</div>`:''}</div>` : ''}
  </section><section class="p-sec"><h2>Связи</h2>
  ${HELP?`<div class="s-help">${esc(SCALE_HELP.rel)}</div>`:''}`;
  Object.keys(REL).forEach(k=>{
    if(!(k in S.rel)) return;
    const v = S.rel[k]; const [lab,cls] = relLabel(v);
    const left = v<0 ? 50+v*10 : 50; const w = Math.abs(v)*10;
    const col = v<0 ? 'var(--bad)' : 'var(--good)';
    const relName = (S.flags.revealed && k==='dad') ? 'Адам (Томаш), отец' : (S.flags.revealed && k==='mom') ? 'Ирена (Ирина), мать' : REL[k];
    h += `<div class="rel"><span class="n">${relName}</span><span class="l ${cls}">${lab}</span><span class="bar"><b style="left:${left}%;width:${w}%;background:${col}"></b></span></div>`;
  });
  h += `</section>
  <div class="money" title="${esc(SCALE_HELP.money)}"><span>Кредиты</span><b>${credits(S.money)}</b></div>
  ${HELP?`<div class="s-help">${esc(SCALE_HELP.money)}</div>`:''}
  <div class="p-foot"><button class="btn-ghost" id="restartBtn" type="button">Начать заново</button></div>`;
  $panel.innerHTML = h;
  const rb = document.getElementById('restartBtn');
  let armed = null;
  rb.addEventListener('click',()=>{
    if(armed){ clearTimeout(armed); clearSave(); S = fresh(); closePanel(); render(true); return; }
    rb.textContent = 'Точно? Нажми ещё раз';
    armed = setTimeout(()=>{ armed=null; rb.textContent='Начать заново'; }, 3000);
  });
  document.getElementById('closePanel').addEventListener('click', closePanel);
  document.getElementById('helpBtn').addEventListener('click',()=>{ HELP=!HELP; try{ localStorage.setItem('noctis-help', HELP?'1':'0'); }catch(e){} renderPanel(); });
}

/* «Что стало с…»: по строке о каждом близком человеке, в зависимости от финала и отношений */
function epilogue(s){
  const E = ['end_run','end_destroy','end_viv','end_cer','end_power'].find(k=>s.flags[k]) || 'end_run';
  const r = k => s.rel[k]||0, out = [];
  out.push(['Лео · '+moralLabel(s.moral), s.moral>=3 ? `Что бы с ним ни случилось, он остался тем, кто помогает, не считая.` : s.moral>=1 ? `Помогает чаще, чем отказывает. И знает, чего это стоит.` : s.moral>=-1 ? `Считает, прежде чем помочь. Обычно считает правильно.` : `Не помнит, когда в последний раз делал что-то просто так. И не очень хочет вспоминать.`]);
  const nika = {
    end_run: r('nika')>=3 ? `Ходит в новую школу у моря. Паяет лучше всех в классе и никому не говорит, кто её научил.` : `Ходит в новую школу у моря. С братом они говорят реже, чем раньше. Но говорят.`,
    end_destroy: r('nika')>=3 ? `Каждую субботу рассказывает брату то, что он забыл, и записывает в тетрадь, чтобы больше не потерялось.` : `Живёт своей жизнью и иногда смотрит на брата так, будто пытается узнать.`,
    end_viv: `Учится в лучшей школе города и ненавидит её. По ночам убегает на крышу комплекса. Охрана делает вид, что не замечает.`,
    end_cer: `Пишет брату раз в месяц. В каждом письме новый план, как его вытащить. С каждым письмом план становится лучше.`,
    end_power: r('nika')>=3 ? `Единственная, кто может сказать брату «хватит». Иногда говорит. Иногда он слушает.` : `Переехала к подруге. Говорит, что брат стал чужим, и не уверена, что ошибается.`,
  }[E];
  out.push(['Ника', nika]);
  const fam = {
    end_run: `Отец снова держит мастерскую, мать работает в больнице у моря. По вечерам они сидят на веранде и впервые за двадцать лет не оглядываются.`,
    end_destroy: `Вернулись в мастерскую под эстакадой. Отец больше не прячет рюкзак под верстаком.`,
    end_viv: `Отец работает в лаборатории Пандоры и почти не разговаривает. Мать держится за двоих.`,
    end_cer: `Отец каждую неделю подаёт прошение о свидании с сыном. Каждую неделю ему отказывают. Он подаёт снова.`,
    end_power: `Отец смотрит на сына так, как когда-то смотрел на кабины Церебры. Мать всё ещё ставит на стол четыре тарелки.`,
  }[E] + (r('dad')<=0 ? ` Разговор о прошлом вы так и не закончили.` : r('dad')>=4 ? ` По воскресеньям вы с отцом чините что-нибудь вдвоём, как раньше.` : '');
  out.push(['Адам и Ирена', fam]);
  if('dana' in s.rel){
    let d;
    if(s.flags.coldDana && !s.flags.ev_dana_2 && r('dana')<3) d = `Перевелась обратно в Северный технический. Иногда вы сталкиваетесь в сети: короткий лайк, и больше ничего.`;
    else if(s.flags.promiseMiguel || s.flags.doubleDana || s.flags.danaPass) d = {
      end_run: `Пишет коротко: «Мигель живой. Спасибо». Иногда добавляет: «Скучаю».`,
      end_destroy: `Мигель больше не зависит от белой клиники. Дана заново рассказывает тебе всё, что ты про неё забыл. Ты слушаешь очень внимательно.`,
      end_viv: `Пандора взяла на себя лечение Мигеля. Дана работает у Вивьен. Вы встречаетесь в лифте и делаете вид, что так и надо.`,
      end_cer: `Каждое воскресенье приходит к подножию башни. Она знает, что ты видишь её через камеры.`,
      end_power: `Единственная, кто спорит с тобой вслух. Ты оставил ей эту привилегию. Пока.`,
    }[E];
    else d = `Доучилась и уехала с Мигелем на север. Отчётов она больше не пишет. Никому.`;
    out.push(['Дана', d]);
  }
  let teo;
  if(s.flags.soldTeo) teo = `Не простил, что ты отдал его Пандоре. Но в ночь башни прикрывал тебе спину. Больше вы не виделись.`;
  else if(r('teo')<0) teo = `Вы больше не разговариваете. Зелёная лампа в будке горит для других.`;
  else if(E==='end_destroy' && s.flags.sixthAlly) teo = `По вечерам ходит к башне, хотя там больше никого нет. Говорит, что ему наконец спокойно.`;
  else teo = {
    end_run: `Будка с зелёной лампой всё так же прилеплена к кинотеатру. Раз в год Тео получает открытку без обратного адреса. На ней нарисована лампа.`,
    end_destroy: `Снова учит тебя. Не дару — пайке. Говорит, так даже лучше.`,
    end_viv: `Закрыл будку и исчез. Говорят, его видели на юге.`,
    end_cer: `Каждую ночь слушает эфир башни и ждёт сигнала. Он умеет ждать.`,
    end_power: `Держит будку открытой всю ночь. На случай, если мальчик из мастерской захочет поговорить.`,
  }[E];
  out.push(['Тео', teo]);
  if('grach' in s.rel) out.push(['Грач', s.flags.grachDeal ? `Камеры на рынке работают до сих пор. Грач вычеркнул тебя из графы должников и записал в графу, у которой нет названия.` : r('grach')<0 ? `Твоё имя всё ещё в его тетради. Он никуда не торопится.` : `По-прежнему пьёт чай у окна «Белого журавля». Если спросить о тебе, улыбается и молчит.`]);
  if(s.flags.kitFriend || 'kit' in s.rel) out.push(['Кит', evCount(s,'kit')>=2 ? `Собрал свой первый настоящий дрон. Он летает целую минуту. Всем Кит говорит, что научился сам.` : s.flags.kitFree ? `Продаёт лапшу у Рафы и ходит в вечернюю школу. Грач платит. Кит ворчит.` : `Всё так же бегает по крышам рынка. Если ты вернёшься, он узнает первым.`]);
  if('barro' in s.rel) out.push(['Барро', `Таскает ящики на рынке. Протез, который чинил твой отец, не подвёл ни разу.`]);
  if('viv' in s.rel && E!=='end_viv') out.push(['Вивьен Кросс', s.flags.alliedViv ? `Архивов она так и не получила. При встрече улыбается тебе как старому другу. От этой улыбки холодно.` : `Получила повышение. Визитку с твоим именем держит в верхнем ящике стола. На всякий случай.`]);
  return out;
}

/* Дождь */
(function rain(){
  const cv = document.getElementById('rain'); const ctx = cv.getContext('2d');
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=0,H=0,drops=[];
  function size(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    W = cv.clientWidth; H = cv.clientHeight; cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const count = Math.round(W*H/9000);
    drops = Array.from({length:count},()=>({x:Math.random()*W, y:Math.random()*H, l:8+Math.random()*16, v:6+Math.random()*9, a:.05+Math.random()*.12}));
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.lineWidth = 1;
    for(const d of drops){
      ctx.strokeStyle = `rgba(160,190,205,${d.a})`;
      ctx.beginPath(); ctx.moveTo(d.x,d.y); ctx.lineTo(d.x-d.l*.18, d.y+d.l); ctx.stroke();
    }
  }
  function tick(){
    if(!document.hidden){
      for(const d of drops){ d.y += d.v; d.x -= d.v*.18; if(d.y>H){ d.y = -d.l; d.x = Math.random()*(W+40); } }
      draw();
    }
    requestAnimationFrame(tick);
  }
  size(); window.addEventListener('resize', size);
  if(reduce) draw(); else requestAnimationFrame(tick);
})();

/* ============================================================
   МУЗЫКА (процедурная, Web Audio)
   Позже можно заменить готовыми треками: TRACKS = {home:'music/home.mp3', ...}
   ============================================================ */
const MOODS = {
  home:  {tempo:72,  bars:8, chords:[[57,60,64,67,71],[53,57,60,64,67],[48,55,59,64,67],[55,59,62,64,69]], pad:.20, cutoff:950,  pluck:{p:.32, oct:12, type:'triangle', every:2, lvl:.07}, bass:'root', wet:.35},
  street:{tempo:100, bars:8, chords:[[50,53,57,60,64],[46,50,53,57,60],[53,57,60,64],[48,52,55,59,62]], pad:.14, cutoff:800,  pluck:{p:.85, oct:12, type:'square', every:1, lvl:.028, arp:true}, bass:'eighth', wet:.28},
  uni:   {tempo:76,  bars:8, chords:[[52,55,59,62,66],[48,52,55,59,64],[55,59,62,66,71],[50,54,57,62,64]], pad:.12, cutoff:1700, pluck:{p:.45, oct:24, type:'sine', every:2, lvl:.07}, bass:'none', wet:.5},
  night: {tempo:56,  bars:8, chords:[[38,45,50,53,58],[37,44,49,52,55]], pad:.22, cutoff:520, pluck:{p:.12, oct:24, type:'sine', every:2, lvl:.05}, bass:'none', heart:true, wet:.45},
  tense: {tempo:132, bars:4, chords:[[38,41,44,50],[37,40,43,49]], pad:.16, cutoff:1200, pluck:{p:.9, oct:24, type:'sawtooth', every:1, lvl:.02, arp:true}, bass:'sixteenth', heart:true, wet:.2},
};
const Music = (()=>{
  const PREF = 'noctis-sound';
  let on = true; try{ on = localStorage.getItem(PREF)!=='off'; }catch(e){}
  let ctx=null, master=null, reverb=null, layer=null, send=null, mood=null, want='home';
  let step=0, nextT=0, timer=null;
  const mtof = m => 440*Math.pow(2,(m-69)/12);

  function impulse(sec){
    const len = ctx.sampleRate*sec, b = ctx.createBuffer(2,len,ctx.sampleRate);
    for(let c=0;c<2;c++){ const d=b.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3); }
    return b;
  }
  function noiseBuf(){
    const len = ctx.sampleRate*2, b = ctx.createBuffer(1,len,ctx.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1; return b;
  }
  function init(){
    if(ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return false;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0;
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value=-18; comp.ratio.value=3;
    master.connect(comp); comp.connect(ctx.destination);
    reverb = ctx.createConvolver(); reverb.buffer = impulse(3.5); reverb.connect(master);
    // Дождь и гул города: всегда тихо на фоне
    const nb = noiseBuf();
    const rain = ctx.createBufferSource(); rain.buffer=nb; rain.loop=true;
    const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=900;
    const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=5500;
    const rg = ctx.createGain(); rg.gain.value=.028;
    rain.connect(hp); hp.connect(lp); lp.connect(rg); rg.connect(master); rain.start();
    const hum = ctx.createBufferSource(); hum.buffer=nb; hum.loop=true; hum.playbackRate.value=.7;
    const hl = ctx.createBiquadFilter(); hl.type='lowpass'; hl.frequency.value=160;
    const hg = ctx.createGain(); hg.gain.value=.05;
    hum.connect(hl); hl.connect(hg); hg.connect(master); hum.start();
    timer = setInterval(tick, 60);
    document.addEventListener('visibilitychange', ()=>{ if(!ctx) return; if(document.hidden) ctx.suspend(); else if(on) ctx.resume(); });
    return true;
  }
  function newLayer(m){
    const now = ctx.currentTime;
    if(layer){ const old=layer, os=send; old.gain.setTargetAtTime(0, now, .9); setTimeout(()=>{ try{old.disconnect(); os.disconnect();}catch(e){} }, 6000); }
    layer = ctx.createGain(); layer.gain.value = 0; layer.gain.setTargetAtTime(1, now+.2, 1.2);
    send = ctx.createGain(); send.gain.value = m.wet;
    layer.connect(master); layer.connect(send); send.connect(reverb);
    step = 0; nextT = now+.15;
  }
  function pad(m, notes, t, dur){
    const f = ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=m.cutoff; f.Q.value=.6;
    const g = ctx.createGain(); const lvl = m.pad/notes.length;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(lvl,t+2.2); g.gain.setValueAtTime(lvl,t+dur); g.gain.linearRampToValueAtTime(0,t+dur+3);
    f.connect(g); g.connect(layer);
    notes.forEach(n=>[-7,7].forEach(cent=>{ const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=mtof(n); o.detune.value=cent; o.connect(f); o.start(t); o.stop(t+dur+3.1); }));
  }
  function pluck(freq, t, type, lvl, dec){
    const o=ctx.createOscillator(), g=ctx.createGain(), f=ctx.createBiquadFilter();
    o.type=type; o.frequency.value=freq; f.type='lowpass'; f.frequency.value=2600;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(lvl,t+.006); g.gain.exponentialRampToValueAtTime(.0001,t+dec);
    o.connect(f); f.connect(g); g.connect(layer); o.start(t); o.stop(t+dec+.05);
  }
  function bass(freq, t, dec, lvl){
    const o=ctx.createOscillator(), g=ctx.createGain(), f=ctx.createBiquadFilter();
    o.type='triangle'; o.frequency.value=freq; f.type='lowpass'; f.frequency.value=380;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(lvl,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dec);
    o.connect(f); f.connect(g); g.connect(layer); o.start(t); o.stop(t+dec+.05);
  }
  function thump(t, lvl){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(95,t); o.frequency.exponentialRampToValueAtTime(42,t+.16);

  }
  function schedule(m, s, t){
    const spb = 60/m.tempo;                            // bars = сколько долей держится один аккорд
    const stepsPerChord = m.bars*4;
    const ci = Math.floor(s/stepsPerChord) % m.chords.length, ch = m.chords[ci], inChord = s % stepsPerChord;
    if(inChord===0){
      pad(m, ch, t, m.bars*spb);
      if(m.bass==='root') bass(mtof(ch[0]-12), t, 2.5, .22);
    }
    if(m.bass==='eighth' && s%2===0) bass(mtof(ch[0]-12), t, .22, .2);
    if(m.bass==='sixteenth') bass(mtof(ch[0]-12), t, .1, .17);
    const p = m.pluck;
    if(p && s%p.every===0 && Math.random()<p.p){
      const idx = p.arp ? (s/p.every)%ch.length : Math.floor(Math.random()*ch.length);
      pluck(mtof(ch[idx]+p.oct), t, p.type, p.lvl, p.arp ? .22 : 1.1);
    }
    if(m.heart){
      const beatLen = m.tempo>100 ? 4 : 8;
      if(s%beatLen===0) thump(t, .5); else if(s%beatLen===1) thump(t, .3);

  }
  function tick(){
    if(!ctx || !layer || !mood) return;
    const m = MOODS[mood], dt = 60/m.tempo/4;
    while(nextT < ctx.currentTime + .3){ schedule(m, step, nextT); nextT += dt; step++; }
  }
  function apply(){
    if(!ctx) return;
    const now = ctx.currentTime;
    master.gain.cancelScheduledValues(now);
    master.gain.setTargetAtTime(on ? .55 : 0, now, .4);
    if(on){ ctx.resume(); if(want!==mood){ mood=want; newLayer(MOODS[mood]); } }
    else setTimeout(()=>{ if(!on && ctx) ctx.suspend(); }, 1500);
  }
  return {
    get on(){ return on; },
    unlock(){ if(!on) return; if(ctx && ctx.state==='running' && mood) return; if(init()) apply(); },
    setMood(m){ want = MOODS[m] ? m : 'home'; if(ctx && on && want!==mood){ mood=want; newLayer(MOODS[mood]); } },
    toggle(){ on=!on; try{ localStorage.setItem(PREF, on?'on':'off'); }catch(e){} if(on) init(); apply(); return on; },
  };
})();
